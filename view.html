<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Объявление — MNE Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-bold text-lg tracking-tight text-gray-950">
                <span class="text-xl">🇲🇪</span> MNE<span class="text-blue-600">Market</span>
            </a>
            <a href="index.html" class="text-xs font-semibold text-gray-600 hover:text-blue-600 transition-colors flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> На главную
            </a>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-2xl mx-auto px-4 pt-6" id="postContainer">
        <div class="text-center py-20 text-gray-400 text-sm">Загрузка объявления...</div>
    </main>

    <script>
        lucide.createIcons();

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const citiesMap = {
            budva: { ru: "Будва", en: "Budva", cnr: "Budva" },
            bar: { ru: "Бар", en: "Bar", cnr: "Bar" },
            tivat: { ru: "Тиват", en: "Tivat", cnr: "Tivat" },
            podgorica: { ru: "Подгорица", en: "Podgorica", cnr: "Podgorica" },
            kotor: { ru: "Котор", en: "Kotor", cnr: "Kotor" },
            herceg_novi: { ru: "Херцег-Нови", en: "Herceg Novi", cnr: "Herceg Novi" }
        };

        const categoriesMap = {
            auto: { ru: "Авто", en: "Vehicles", cnr: "Auto" },
            realestate: { ru: "Недвижимость", en: "Real Estate", cnr: "Nekretnine" },
            furniture: { ru: "Мебель", en: "Furniture", cnr: "Namještaj" },
            tech: { ru: "Электроника", en: "Electronics", cnr: "Tehnika" },
            clothes: { ru: "Одежда", en: "Clothing", cnr: "Odjeća" },
            other: { ru: "Разное", en: "Other", cnr: "Razno" }
        };

        const currentLang = localStorage.getItem('mne_lang') || 'ru';

        async function fetchPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                document.getElementById('postContainer').innerHTML = `<div class="text-center py-20 text-gray-400 text-sm">Объявление не найдено</div>`;
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .eq('id', postId)
                    .single();

                if (error) throw error;
                if (!data) throw new Error('Not found');

                renderPost(data);
            } catch (err) {
                console.error(err);
                document.getElementById('postContainer').innerHTML = `<div class="text-center py-20 text-gray-400 text-sm">Ошибка загрузки объявления</div>`;
            }
        }

        function renderPost(post) {
            const imageUrl = post.image_url || (post.images && post.images[0]) || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500';
            const cityName = citiesMap[post.city]?.[currentLang] || post.city;
            const categoryName = categoriesMap[post.category]?.[currentLang] || post.category;

            document.getElementById('postContainer').innerHTML = `
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden space-y-6 pb-6">
                    <div class="h-72 bg-gray-100 relative">
                        <img src="${imageUrl}" class="w-full h-full object-cover" alt="${post.title}">
                    </div>
                    
                    <div class="px-6 space-y-4">
                        <div class="flex items-center justify-between">
                            <span class="bg-blue-50 text-blue-600 text-xs font-bold px-3 py-1 rounded-xl">${categoryName}</span>
                            <div class="flex items-center gap-1 text-gray-400 text-xs font-medium">
                                <i data-lucide="map-pin" class="w-4 h-4"></i>
                                <span>${cityName}</span>
                            </div>
                        </div>

                        <div>
                            <h1 class="text-xl font-extrabold text-gray-950">${post.title}</h1>
                            <div class="text-2xl font-extrabold text-blue-600 mt-2">${post.price} €</div>
                        </div>

                        <hr class="border-gray-100">

                        <div>
                            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Описание</h3>
                            <p class="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">${post.description || 'Без описания'}</p>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        fetchPost();
    </script>
</body>
</html>
