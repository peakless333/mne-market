<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать объявление — MNE Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-bold text-lg tracking-tight text-gray-950">
                <span class="text-xl">🇲🇪</span> MNE<span class="text-blue-600">Market</span>
            </a>
            <a href="index.html" class="text-xs font-semibold text-gray-600 hover:text-blue-600 transition-colors flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> На главную
            </a>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-xl mx-auto px-4 pt-6 space-y-6">
        <h1 class="text-xl font-extrabold text-gray-950">Новое объявление</h1>

        <form id="createForm" onsubmit="submitPost(event)" class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm space-y-4">
            
            <!-- Категория -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">Категория</label>
                <select id="category" required class="w-full bg-gray-100 border border-transparent rounded-xl px-3.5 py-2.5 text-xs font-semibold text-gray-800 outline-none focus:bg-white focus:border-blue-500 transition-all cursor-pointer">
                    <option value="auto">Авто</option>
                    <option value="realestate">Недвижимость</option>
                    <option value="furniture">Мебель</option>
                    <option value="tech">Электроника</option>
                    <option value="clothes">Одежда</option>
                    <option value="other">Разное</option>
                </select>
            </div>

            <!-- Город -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">Город</label>
                <select id="city" required class="w-full bg-gray-100 border border-transparent rounded-xl px-3.5 py-2.5 text-xs font-semibold text-gray-800 outline-none focus:bg-white focus:border-blue-500 transition-all cursor-pointer">
                    <option value="budva">Будва</option>
                    <option value="bar">Бар</option>
                    <option value="tivat">Тиват</option>
                    <option value="podgorica">Подгорица</option>
                    <option value="kotor">Котор</option>
                    <option value="herceg_novi">Херцег-Нови</option>
                </select>
            </div>

            <!-- Название -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">Название товара</label>
                <input type="text" id="title" required placeholder="Например: iPhone 13 Pro" class="w-full bg-gray-100 border border-transparent rounded-xl px-3.5 py-2.5 text-xs font-semibold text-gray-800 outline-none focus:bg-white focus:border-blue-500 transition-all">
            </div>

            <!-- Цена -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">Цена (€)</label>
                <input type="number" id="price" required min="0" placeholder="0" class="w-full bg-gray-100 border border-transparent rounded-xl px-3.5 py-2.5 text-xs font-semibold text-gray-800 outline-none focus:bg-white focus:border-blue-500 transition-all">
            </div>

            <!-- Описание -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">Описание</label>
                <textarea id="description" rows="4" placeholder="Расскажите подробнее о товаре..." class="w-full bg-gray-100 border border-transparent rounded-xl px-3.5 py-2.5 text-xs font-semibold text-gray-800 outline-none focus:bg-white focus:border-blue-500 transition-all resize-none"></textarea>
            </div>

            <!-- Ссылка на фото -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">Ссылка на фото (URL)</label>
                <input type="url" id="image_url" placeholder="https://images.unsplash.com/..." class="w-full bg-gray-100 border border-transparent rounded-xl px-3.5 py-2.5 text-xs font-semibold text-gray-800 outline-none focus:bg-white focus:border-blue-500 transition-all">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl text-xs font-bold transition-all shadow-sm cursor-pointer mt-2">
                Опубликовать объявление
            </button>
        </form>
    </main>

    <script>
        lucide.createIcons();

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userToken = localStorage.getItem('mne_user_token');
        if (!userToken) {
            userToken = 'user_' + Math.random().toString(36.20) + Date.now();
            localStorage.setItem('mne_user_token', userToken);
        }

        async function submitPost(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Публикация...';

            const newPost = {
                category: document.getElementById('category').value,
                city: document.getElementById('city').value,
                title: document.getElementById('title').value.trim(),
                price: Number(document.getElementById('price').value),
                description: document.getElementById('description').value.trim(),
                image_url: document.getElementById('image_url').value.trim() || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500',
                user_token: userToken,
                created_at: new Date().toISOString()
            };

            try {
                const { error } = await supabaseClient.from('posts').insert([newPost]);
                if (error) throw error;
                window.location.href = 'index.html';
            } catch (err) {
                alert('Ошибка при создании: ' + err.message);
                btn.disabled = false;
                btn.innerText = 'Опубликовать объявление';
            }
        }
    </script>
</body>
</html>
