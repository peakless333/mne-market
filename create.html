<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MNE Market — Новое объявление</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo" style="margin-right: auto;">MNE Market</a>
      <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Отмена</a>
    </div>
  </header>

  <main class="container-form">
    <h1 style="font-size: 24px; margin-bottom: 24px; text-align: center;">Подать объявление</h1>
    <form id="createForm">
      <div class="form-group">
        <label>Название объявления</label>
        <input type="text" id="title" required placeholder="Например: iPhone 13 Pro Max">
      </div>
      
      <div class="post-grid" style="gap: 16px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label>Категория</label>
          <select id="category" required>
            <option value="Электроника">Электроника</option>
            <option value="Транспорт">Транспорт</option>
            <option value="Недвижимость">Недвижимость</option>
            <option value="Услуги">Услуги</option>
            <option value="Личные вещи">Личные вещи</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Цена (€)</label>
          <input type="number" id="price" required placeholder="0">
        </div>
      </div>

      <div class="form-group" style="margin-top: 20px;">
        <label>Город / Локация</label>
        <input type="text" id="location" required placeholder="Например: Будва">
      </div>

      <div class="form-group">
        <label>Фотография товара</label>
        <input type="file" id="imageFile" accept="image/*" style="padding: 10px;">
      </div>

      <div class="form-group">
        <label>Описание</label>
        <textarea id="description" rows="6" placeholder="Опишите состояние, комплектацию и другие важные детали..."></textarea>
      </div>

      <div class="form-group">
        <label>Ваше имя и контакты (Telegram / Телефон)</label>
        <input type="text" id="contact_name" required placeholder="Иван, @ivan_tg">
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: 16px; font-size: 16px;" id="submitBtn">Опубликовать объявление</button>
    </form>
  </main>

  <script src="supabase.js"></script>
  <script>
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Загрузка данных...';
      btn.disabled = true;

      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const price = parseFloat(document.getElementById('price').value);
      const location = document.getElementById('location').value;
      const description = document.getElementById('description').value;
      const contact_name = document.getElementById('contact_name').value;
      const fileInput = document.getElementById('imageFile');

      let imageUrl = '';

      try {
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

          const { error: uploadError } = await supabase.storage
            .from('images')
            .upload(fileName, file);

          if (uploadError) throw uploadError;

          const { data: publicUrlData } = supabase.storage
            .from('images')
            .getPublicUrl(fileName);

          imageUrl = publicUrlData.publicUrl;
        }

        const { error: insertError } = await supabase
          .from('ads')
          .insert([{ title, category, price, location, description, contact_name, image_url: imageUrl }]);

        if (insertError) throw insertError;

        alert('Объявление успешно опубликовано!');
        window.location.href = 'index.html';

      } catch (err) {
        console.error(err);
        alert('Ошибка: ' + err.message);
        btn.textContent = 'Опубликовать объявление';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
