<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Разместить объявление — MNE Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f5f6f8] text-gray-950 min-h-screen pb-20 antialiased">

    <!-- Уведомления -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none">
        <span id="toastText"></span>
    </div>

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-black text-lg text-gray-950 tracking-tight">
                <span class="text-xl">🇲🇪</span> 
                <span>MNE<span class="text-[#009cf0]">Market</span></span>
            </a>
            <div class="flex items-center gap-2">
                <!-- Переключатель языка -->
                <div class="flex bg-gray-100 p-1 rounded-xl text-xs font-semibold">
                    <button onclick="setLang('ru')" id="langRu" class="px-2.5 py-1.5 rounded-lg transition-all">RU</button>
                    <button onclick="setLang('en')" id="langEn" class="px-2.5 py-1.5 rounded-lg transition-all">EN</button>
                    <button onclick="setLang('me')" id="langMe" class="px-2.5 py-1.5 rounded-lg transition-all">ME</button>
                </div>
                <a href="index.html" id="navHome" class="text-xs font-semibold text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-xl transition-all">
                    На главную
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-6">
        <div class="bg-white rounded-3xl p-6 sm:p-8 border border-gray-200/80 shadow-xs space-y-6">
            <h1 id="mainHeader" class="text-xl font-black text-gray-950 tracking-tight">Новое объявление</h1>

            <form id="postForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
                
                <!-- Категория -->
                <div class="space-y-1.5">
                    <label id="labelCategory" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Категория</label>
                    <select id="category" onchange="renderCategoryAttributes()" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs outline-none focus:border-[#009cf0] focus:bg-white transition-all font-medium">
                        <option value="electronics">Электроника / Tehnika</option>
                        <option value="auto">Авто / Automobili</option>
                        <option value="realty">Недвижимость / Nekretnine</option>
                        <option value="jobs">Работа / Posao</option>
                        <option value="services">Услуги / Usluge</option>
                        <option value="clothing">Одежда / Odjeća</option>
                        <option value="home">Для дома / Za kuću</option>
                        <option value="other">Разное / Ostalo</option>
                    </select>
                </div>

                <!-- Динамические атрибуты под категорию -->
                <div id="attributesContainer" class="space-y-4"></div>

                <!-- Название -->
                <div class="space-y-1.5">
                    <label id="labelTitle" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Название</label>
                    <input type="text" id="title" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs outline-none focus:border-[#009cf0] focus:bg-white transition-all font-medium" placeholder="Например: iPhone 14 Pro 128GB">
                </div>

                <!-- Описание -->
                <div class="space-y-1.5">
                    <label id="labelDesc" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Описание</label>
                    <textarea id="description" rows="4" class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-4 text-xs outline-none focus:border-[#009cf0] focus:bg-white transition-all font-medium resize-none" placeholder="Расскажите подробнее о товаре или услуге..."></textarea>
                </div>

                <!-- Цена -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label id="labelPrice" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Цена (€)</label>
                        <input type="number" id="price" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs outline-none focus:border-[#009cf0] focus:bg-white transition-all font-medium" placeholder="Оставьте пустым, если бесплатно">
                    </div>
                    <div class="space-y-1.5">
                        <label id="labelCity" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Город</label>
                        <select id="city" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs outline-none focus:border-[#009cf0] focus:bg-white transition-all font-medium">
                            <option value="Budva">Будва (Budva)</option>
                            <option value="Podgorica">Подгорица (Podgorica)</option>
                            <option value="Bar">Бар (Bar)</option>
                            <option value="Tivat">Тиват (Tivat)</option>
                            <option value="Kotor">Котор (Kotor)</option>
                            <option value="Herceg Novi">Герцег-Нови (Herceg Novi)</option>
                            <option value="Ulcinj">Ульцинь (Ulcinj)</option>
                            <option value="Cetinje">Цетинье (Cetinje)</option>
                            <option value="Nikšić">Никшич (Nikšić)</option>
                        </select>
                    </div>
                </div>

                <!-- Фотографии -->
                <div class="space-y-1.5">
                    <label id="labelPhotos" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Фотографии (до 10 шт.)</label>
                    <div class="flex flex-wrap gap-3" id="photoPreviews">
                        <label class="w-20 h-20 bg-gray-50 border-2 border-dashed border-gray-200 hover:border-[#009cf0] rounded-2xl flex flex-col items-center justify-center cursor-pointer text-gray-400 hover:text-[#009cf0] transition-all">
                            <i data-lucide="image-plus" class="w-5 h-5"></i>
                            <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImagesSelect(event)" class="hidden">
                        </label>
                    </div>
                </div>

                <!-- Контакты -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-gray-100">
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Telegram / Телефон</label>
                        <input type="text" id="contact" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs outline-none focus:border-[#009cf0] focus:bg-white transition-all font-medium" placeholder="@username или +382...">
                    </div>
                    <div class="space-y-1.5">
                        <label id="labelAuthor" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Имя автора</label>
                        <input type="text" id="username" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs outline-none focus:border-[#009cf0] focus:bg-white transition-all font-medium" placeholder="Ваше имя">
                    </div>
                </div>

                <!-- Кнопка отправки -->
                <button type="submit" id="submitBtn" class="w-full bg-[#009cf0] hover:bg-[#0089d1] text-white font-bold py-3.5 rounded-2xl text-xs transition-all shadow-md shadow-blue-500/20 cursor-pointer mt-4">
                    Опубликовать объявление
                </button>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const translations = {
            ru: {
                pageTitle: "Разместить объявление — MNE Market",
                navHome: "На главную",
                mainHeader: "Новое объявление",
                labelCategory: "Категория",
                labelTitle: "Название",
                labelDesc: "Описание",
                labelPrice: "Цена (€)",
                labelCity: "Город",
                labelPhotos: "Фотографии (до 10 шт.)",
                labelAuthor: "Имя автора",
                submitBtn: "Опубликовать объявление",
                toastSuccess: "Объявление успешно опубликовано!",
                toastError: "Ошибка при сохранении"
            },
            en: {
                pageTitle: "Create Listing — MNE Market",
                navHome: "Home",
                mainHeader: "New Listing",
                labelCategory: "Category",
                labelTitle: "Title",
                labelDesc: "Description",
                labelPrice: "Price (€)",
                labelCity: "City",
                labelPhotos: "Photos (up to 10)",
                labelAuthor: "Author Name",
                submitBtn: "Publish Listing",
                toastSuccess: "Listing published successfully!",
                toastError: "Error saving listing"
            },
            me: {
                pageTitle: "Kreiraj oglas — MNE Market",
                navHome: "Početna",
                mainHeader: "Novi oglas",
                labelCategory: "Kategorija",
                labelTitle: "Naslov",
                labelDesc: "Opis",
                labelPrice: "Cijena (€)",
                labelCity: "Grad",
                labelPhotos: "Fotografije (do 10)",
                labelAuthor: "Ime autora",
                submitBtn: "Objavi oglas",
                toastSuccess: "Oglas je uspješno objavljen!",
                toastError: "Greška pri čuvanju"
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let uploadedImages = [];

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            updateLocalization();
            renderCategoryAttributes();
        }

        function updateLocalization() {
            const t = translations[currentLang];
            document.getElementById('pageTitle').innerText = t.pageTitle;
            document.getElementById('navHome').innerText = t.navHome;
            document.getElementById('mainHeader').innerText = t.mainHeader;
            document.getElementById('labelCategory').innerText = t.labelCategory;
            document.getElementById('labelTitle').innerText = t.labelTitle;
            document.getElementById('labelDesc').innerText = t.labelDesc;
            document.getElementById('labelPrice').innerText = t.labelPrice;
            document.getElementById('labelCity').innerText = t.labelCity;
            document.getElementById('labelPhotos').innerText = t.labelPhotos;
            document.getElementById('labelAuthor').innerText = t.labelAuthor;
            document.getElementById('submitBtn').innerText = t.submitBtn;

            ['ru', 'en', 'me'].forEach(l => {
                const btn = document.getElementById(`lang${l.charAt(0).toUpperCase() + l.slice(1)}`);
                if (l === currentLang) {
                    btn.className = "px-2.5 py-1.5 rounded-lg bg-white text-gray-950 shadow-xs transition-all";
                } else {
                    btn.className = "px-2.5 py-1.5 rounded-lg text-gray-500 hover:text-gray-900 transition-all";
                }
            });
        }

        function renderCategoryAttributes() {
            const cat = document.getElementById('category').value;
            const container = document.getElementById('attributesContainer');
            
            // Динамические поля в зависимости от категории
            if (cat === 'realty') {
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Тип недвижимости</label>
                            <select id="attr_realty_type" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs outline-none focus:border-[#009cf0]">
                                <option value="Новостройки">Новостройки (Первичное)</option>
                                <option value="Вторичное жилье">Вторичное жилье</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Комнаты</label>
                            <input type="text" id="attr_rooms" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs outline-none focus:border-[#009cf0]" placeholder="Например: 2 спальни">
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = '';
            }
        }

        function handleImagesSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    if (uploadedImages.length < 10) {
                        uploadedImages.push(e.target.result);
                        updateImagePreviews();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function updateImagePreviews() {
            const container = document.getElementById('photoPreviews');
            const addBtnHTML = container.firstElementChild.outerHTML;
            
            let imagesHTML = uploadedImages.map((img, index) => `
                <div class="relative w-20 h-20 rounded-2xl overflow-hidden border border-gray-200 group">
                    <img src="${img}" class="w-full h-full object-cover">
                    <button type="button" onclick="removeImage(${index})" class="absolute top-1 right-1 bg-rose-600 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </div>
            `).join('');

            container.innerHTML = imagesHTML + addBtnHTML;
            lucide.createIcons();
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            updateImagePreviews();
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Автозаполнение имени автора из сессии
        const currentUser = JSON.parse(localStorage.getItem('mne_logged_user') || 'null');
        if (currentUser && currentUser.username) {
            document.getElementById('username').value = currentUser.username;
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const t = translations[currentLang];
            
            const postData = {
                category: document.getElementById('category').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                price: document.getElementById('price').value ? parseFloat(document.getElementById('price').value) : null,
                city: document.getElementById('city').value,
                images: uploadedImages,
                image_url: uploadedImages[0] || null,
                contact: document.getElementById('contact').value,
                username: document.getElementById('username').value,
                created_at: new Date().toISOString()
            };

            try {
                const { error } = await supabaseClient.from('posts').insert([postData]);
                if (error) throw error;
                
                showToast(t.toastSuccess);
                setTimeout(() => window.location.href = 'cabinet.html', 1500);
            } catch (err) {
                console.error(err);
                showToast(t.toastError);
            }
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.firstElementChild.innerText = text;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none'), 2500);
        }

        updateLocalization();
        renderCategoryAttributes();
    </script>
</body>
</html>
