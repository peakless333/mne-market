        function togglePriceNegotiable() {
            const checkbox = document.getElementById('priceNegotiable');
            const priceInput = document.getElementById('postPrice');
            if (checkbox.checked) {
                priceInput.value = '';
                priceInput.disabled = true;
                priceInput.classList.add('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
                priceInput.removeAttribute('required');
            } else {
                priceInput.disabled = false;
                priceInput.classList.remove('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
                priceInput.setAttribute('required', 'true');
            }
        }

            const phoneVal = document.getElementById('postPhone').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            if (tgVal !== '' || phoneVal !== '') {
                submitBtn.disabled = false;
                submitBtn.classList.remove('bg-gray-300', 'cursor-not-allowed');
                submitBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'cursor-pointer');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'cursor-pointer');
                submitBtn.classList.add('bg-gray-300', 'cursor-not-allowed');
            }
        }

            } else if (category === 'services') {

        function updateClothesSizeDropdown(selectedSize = '') {
            const typeEl = document.getElementById('attr_clothes_type');
            const wrapper = document.getElementById('clothesSizeWrapper');
            if (!typeEl || !wrapper) return;

            const clothesType = typeEl.value;
            const a = dict[currentLang].attrs;
            let sizeObj, labelText, elementId;

            if (clothesType === 'top') {
                sizeObj = a.size_top.opts;
                labelText = a.size_top.label;
                elementId = 'attr_size_top';
            } else if (clothesType === 'bottom') {
                sizeObj = a.size_bottom.opts;
                labelText = a.size_bottom.label;
                elementId = 'attr_size_bottom';
            } else {
                sizeObj = a.size_shoes.opts;
                labelText = a.size_shoes.label;
                elementId = 'attr_size_shoes';
            }

            wrapper.innerHTML = `
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${labelText}</label>
                    <select id="${elementId}" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                        ${Object.keys(sizeObj).map(k => `<option value="${k}" ${selectedSize === k ? 'selected' : ''}>${sizeObj[k]}</option>`).join('')}
                    </select>
                </div>
            `;
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            if (editPostId) {
                document.getElementById('pageTitle').innerText = dict[lang].titleEdit;
                document.getElementById('submitBtn').querySelector('span').innerText = dict[lang].saveBtn;
            } else {
                document.getElementById('pageTitle').innerText = dict[lang].titleNew;
                document.getElementById('submitBtn').querySelector('span').innerText = dict[lang].publishBtn;
            }

            document.getElementById('postTitle').placeholder = dict[lang].ph_title;
            document.getElementById('postPrice').placeholder = dict[lang].ph_price;
            document.getElementById('postDesc').placeholder = dict[lang].ph_desc;

            const currentCityValue = document.getElementById('postCity').value || 'budva';
            initCitiesSelect(currentCityValue);
            
            const currentAttrs = collectAttributesFromDOM();
            renderCategoryAttributes(currentAttrs);
        }

        function collectAttributesFromDOM() {
            const attrs = {};
            const propTypeEl = document.getElementById('attr_property_type');
            const propDealEl = document.getElementById('attr_property_deal_type');
            const roomsEl = document.getElementById('attr_rooms_count');
            const condEl = document.getElementById('attr_condition');
            const clothesTypeEl = document.getElementById('attr_clothes_type');
            const sizeTopEl = document.getElementById('attr_size_top');
            const sizeBottomEl = document.getElementById('attr_size_bottom');
            const sizeShoesEl = document.getElementById('attr_size_shoes');
            const furnEl = document.getElementById('attr_furniture_type');
            const kidsEl = document.getElementById('attr_kids_type');
            const servicesEl = document.getElementById('attr_services_type');
            const brandEl = document.getElementById('attr_brand');
            const yearEl = document.getElementById('attr_year');
            const milEl = document.getElementById('attr_mileage');

            if (propTypeEl) attrs.property_type = propTypeEl.value;
            if (propDealEl) attrs.property_deal_type = propDealEl.value;
            if (roomsEl) attrs.rooms_count = roomsEl.value;
            if (condEl) attrs.condition = condEl.value;
            if (clothesTypeEl) {
                attrs.clothes_type = clothesTypeEl.value;
                if (sizeTopEl) attrs.size = sizeTopEl.value;
                if (sizeBottomEl) attrs.size = sizeBottomEl.value;
                if (sizeShoesEl) attrs.size = sizeShoesEl.value;
            }
            if (furnEl) attrs.furniture_type = furnEl.value;
            if (kidsEl) attrs.kids_type = kidsEl.value;
            if (servicesEl) attrs.services_type = servicesEl.value;
            if (brandEl) attrs.brand = brandEl.value;
            if (yearEl) attrs.year = yearEl.value;
            if (milEl) attrs.mileage = milEl.value;

            return attrs;
        }

        document.getElementById('langSelect').value = currentLang;
        initCitiesSelect();
        renderCategoryAttributes();
        changeLanguage(currentLang);
        checkFormValidity();

        if (editPostId) {
            document.getElementById('pageTitle').innerText = dict[currentLang].titleEdit;
            document.getElementById('submitBtn').innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> <span>${dict[currentLang].saveBtn}</span>`;
            loadPostForEditing(editPostId);
        }

        async function loadPostForEditing(id) {
            try {
                const { data, error } = await supabaseClient.from('posts').select('*').eq('id', id).single();
                if (error) throw error;
                if (!data) return;

                document.getElementById('postTitle').value = data.title || '';
                document.getElementById('postCategory').value = data.category || 'other';
                initCitiesSelect(data.city || 'budva');
                
                currentPostAttributes = data.attributes || {};
                renderCategoryAttributes(currentPostAttributes);

                // Восстанавливаем статус «Договорная»
                if (data.is_negotiable) {
                    document.getElementById('priceNegotiable').checked = true;
                    togglePriceNegotiable();
                } else {
                    document.getElementById('postPrice').value = data.price !== null ? data.price : '';
                }

                document.getElementById('postDesc').value = data.description || '';
                document.getElementById('postTelegram').value = data.telegram || '';
                if (data.phone) {
                    document.getElementById('postPhone').value = data.phone;
                    document.getElementById('phoneContainer').classList.remove('hidden');
                }
                checkFormValidity();

                existingImages = data.images && Array.isArray(data.images) ? [...data.images] : (data.image_url ? [data.image_url] : []);
                renderPreviews();
            } catch (err) {
                console.error(err);
                alert('Не удалось загрузить объявление для редактирования');
            }
        }

        const dropZone = document.getElementById('dropZone');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('border-blue-500', 'bg-blue-50/70');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('border-blue-500', 'bg-blue-50/70');
            }, false);
        });

        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const files = Array.from(e.dataTransfer.files).filter(file => file.type.startsWith('image/'));
                if (files.length > 0) {
                    processFiles(files);
                    return;
                }
            }

            const items = e.dataTransfer.items;
            if (items) {
                for (const item of items) {
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        if (file) {
                            processFiles([file]);
                            return;
                        }
                    }
                }
            }

            const htmlData = e.dataTransfer.getData('text/html');
            const uriData = e.dataTransfer.getData('text/uri-list');
            const plainText = e.dataTransfer.getData('text/plain');
            
            let imageUrl = '';
            if (htmlData) {
                const match = htmlData.match(/src="([^"]+)"/);
                if (match && match[1]) {
                    imageUrl = match[1];
                }
            }
            if (!imageUrl && uriData) {
                imageUrl = uriData;
            }
            if (!imageUrl && plainText && (plainText.startsWith('http://') || plainText.startsWith('https://'))) {
                imageUrl = plainText;
            }

            if (imageUrl) {
                try {
                    const response = await fetch(imageUrl);
                    const blob = await response.blob();
                    if (blob.type.startsWith('image/')) {
                        const fileName = `tg_image_${Date.now()}.${blob.type.split('/')[1] || 'jpg'}`;
                        const file = new File([blob], fileName, { type: blob.type });
                        processFiles([file]);
                    }
                } catch (err) {
                    try {
                        const proxyResponse = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(imageUrl)}`);
                        const proxyBlob = await proxyResponse.blob();
                        const fileName = `tg_image_${Date.now()}.${proxyBlob.type.split('/')[1] || 'jpg'}`;
                        const file = new File([proxyBlob], fileName, { type: proxyBlob.type || 'image/jpeg' });
                        processFiles([file]);
                    } catch (proxyErr) {
                        console.error(proxyErr);
                        alert("Не удалось загрузить эту картинку напрямую. Попробуйте сохранить её или выбрать через проводник.");
                    }
                }
            }
        }, false);

        window.addEventListener('paste', async (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const files = [];
            
            for (const item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const blob = item.getAsFile();
                    if (blob) {
                        const fileName = `clipboard_${Date.now()}.${blob.type.split('/')[1] || 'jpg'}`;
                        files.push(new File([blob], fileName, { type: blob.type }));
                    }
                }
            }
            
            if (files.length > 0) {
                e.preventDefault();
                processFiles(files);
            }
        });

        function handleImageSelection(e) {
            const files = Array.from(e.target.files);
            processFiles(files);
            e.target.value = '';
        }

        function processFiles(files) {
            if (existingImages.length + selectedFiles.length + files.length > 10) {
                alert(dict[currentLang].maxPhotos);
                return;
            }
            selectedFiles = selectedFiles.concat(files);
            renderPreviews();
        }

        function removeExistingImage(index) {
            existingImages.splice(index, 1);
            renderPreviews();
        }

        function removeNewImage(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
        }

        function renderPreviews() {
            const container = document.getElementById('imagePreviewsContainer');
            if (existingImages.length === 0 && selectedFiles.length === 0) {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            let html = '';

            existingImages.forEach((url, idx) => {
                html += `
                    <div class="relative h-20 rounded-xl overflow-hidden border border-gray-200 bg-gray-100">
                        <img src="${url}" class="w-full h-full object-cover" alt="Preview">
                        <button type="button" onclick="removeExistingImage(${idx})" class="absolute top-1 right-1 bg-black/60 hover:bg-red-600 text-white p-1 rounded-full transition-all cursor-pointer">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            });

            selectedFiles.forEach((file, idx) => {
                const url = URL.createObjectURL(file);
                html += `
                    <div class="relative h-20 rounded-xl overflow-hidden border border-blue-200 bg-blue-50">
                        <img src="${url}" class="w-full h-full object-cover" alt="Preview">
                        <button type="button" onclick="removeNewImage(${idx})" class="absolute top-1 right-1 bg-black/60 hover:bg-red-600 text-white p-1 rounded-full transition-all cursor-pointer">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            lucide.createIcons();
        }

        async function submitPost(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = dict[currentLang].publishing;

            try {
                let imageUrls = [...existingImages];

                for (const file of selectedFiles) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                    
                    const { error } = await supabaseClient.storage.from('post-images').upload(fileName, file);
                    if (error) throw error;

                    const { data: publicUrlData } = supabaseClient.storage.from('post-images').getPublicUrl(fileName);
                    imageUrls.push(publicUrlData.publicUrl);
                }

                if (imageUrls.length === 0) {
                    imageUrls = [];
                }

                const telegramVal = document.getElementById('postTelegram').value.trim();
                const phoneVal = document.getElementById('postPhone').value.trim();
                const isNegotiable = document.getElementById('priceNegotiable').checked;

                const postData = {
                    title: document.getElementById('postTitle').value.trim(),
                    category: document.getElementById('postCategory').value,
                    city: document.getElementById('postCity').value,
                    attributes: collectAttributesFromDOM(),
                    price: isNegotiable ? 0 : Number(document.getElementById('postPrice').value || 0),
                    is_negotiable: isNegotiable, // Передаем корректное поле для Supabase
                    description: document.getElementById('postDesc').value.trim(),
                    telegram: telegramVal,
                    phone: phoneVal,
                    contact: telegramVal || phoneVal,
                    images: imageUrls,
                    image_url: imageUrls.length > 0 ? imageUrls[0] : null,
                    username: usernameToken,
                    user_token: usernameToken
                };

                if (editPostId) {
                    const { error: updateError } = await supabaseClient.from('posts').update(postData).eq('id', editPostId);
                    if (updateError) throw updateError;
                } else {
                    postData.telegram_id = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : null;
                    postData.views = 0;

                    const { data, error: insertError } = await supabaseClient.from('posts').insert([postData]).select();
                    if (insertError) throw insertError;
                }

                window.location.href = 'index.html';

            } catch (err) {
                console.error(err);
                alert('Ошибка при сохранении: ' + (err.message || 'Неизвестная ошибка'));
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i data-lucide="plus-circle" class="w-4 h-4"></i> <span>${editPostId ? dict[currentLang].saveBtn : dict[currentLang].publishBtn}</span>`;
                lucide.createIcons();
            }
        }
    </script>
