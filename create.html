<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNE Market — Создать объявление</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">MNE Market</a>
      <div class="search-bar">
        <input type="text" placeholder="Поиск по объявлениям...">
      </div>
      <div class="header-right">
        <select class="lang-switcher">
          <option value="ru">RU</option>
          <option value="en">EN</option>
        </select>
        <a href="create.html" class="btn-create">+ Разместить</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="form-container">
      <h2 class="section-title" style="text-align: center;">Новое объявление</h2>
      <form id="createForm">
        <div class="form-group">
          <label>Название товара</label>
          <input type="text" id="title" required placeholder="Например: iPhone 13">
        </div>
        <div class="form-group">
          <label>Категория</label>
          <select id="category">
            <option value="Электроника">Электроника</option>
            <option value="Мебель">Мебель</option>
            <option value="Одежда">Одежда</option>
            <option value="Разное">Разное</option>
          </select>
        </div>
        <div class="form-group">
          <label>Цена (€)</label>
          <input type="number" id="price" required placeholder="0">
        </div>
        <div class="form-group">
          <label>Фотография</label>
          <input type="file" id="imageFile" accept="image/*">
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="description" rows="4" placeholder="Расскажите о товаре..."></textarea>
        </div>
        <div class="form-group">
          <label>Telegram для связи</label>
          <input type="text" id="telegram" placeholder="@username">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Опубликовать</button>
      </form>
    </div>
  </main>

  <script src="supabase.js"></script>
  <script>
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Публикация...';
      btn.disabled = true;

      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const price = parseFloat(document.getElementById('price').value);
      const description = document.getElementById('description').value;
      const telegram = document.getElementById('telegram').value;
      const fileInput = document.getElementById('imageFile');

      let imageUrl = '';

      try {
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}.${fileExt}`;
          const filePath = `${fileName}`;

          const { error: uploadError } = await supabase.storage
            .from('images')
            .upload(filePath, file);

          if (uploadError) throw uploadError;

          const { data: publicUrlData } = supabase.storage
            .from('images')
            .getPublicUrl(filePath);

          imageUrl = publicUrlData.publicUrl;
        }

        const { error: insertError } = await supabase
          .from('ads')
          .insert([
            { title, category, price, description, telegram_id: telegram, image_url: imageUrl }
          ]);

        if (insertError) throw insertError;

        alert('Объявление успешно опубликовано!');
        window.location.href = 'index.html';

      } catch (error) {
        console.error('Ошибка:', error.message);
        alert('Ошибка при публикации: ' + error.message);
        btn.textContent = 'Опубликовать';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
