<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать объявление — MNE Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Шапка сайта -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-gray-600 hover:text-gray-900 font-medium text-sm">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> <span data-i18n="back">Назад</span>
            </a>
            <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-2.5 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                <option value="ru">🇷🇺 RU</option>
                <option value="en">🇬🇧 EN</option>
                <option value="cnr">🇲🇪 CNR</option>
            </select>
        </div>
    </header>

    <!-- Основная форма -->
    <main class="max-w-2xl mx-auto px-4 pt-6">
        <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm space-y-6">
            <h1 class="text-xl font-bold text-gray-900" data-i18n="title">Новое объявление</h1>

            <form id="createForm" onsubmit="submitPost(event)" class="space-y-4">
                
                <!-- Загрузка картинок -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2" data-i18n="photosLabel">Фотографии (до 5 шт.)</label>
                    <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImageSelection(event)">
                    
                    <div id="imagePreviewsContainer" class="grid grid-cols-5 gap-2 mb-2 hidden"></div>

                    <button type="button" onclick="document.getElementById('imageInput').click()" class="w-full border-2 border-dashed border-gray-200 hover:border-blue-500 bg-gray-50 hover:bg-blue-50/50 rounded-2xl p-6 text-center transition-all cursor-pointer flex flex-col items-center justify-center gap-2 group">
                        <div class="bg-white p-3 rounded-full shadow-sm text-gray-400 group-hover:text-blue-600 transition-colors">
                            <i data-lucide="image-plus" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-semibold text-gray-600 group-hover:text-blue-600" data-i18n="addPhotoBtn">Нажмите, чтобы добавить фото</span>
                    </button>
                </div>

                <!-- Название -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="nameLabel">Название</label>
                    <input type="text" id="postTitle" required placeholder="Например: iPhone 13 Pro 128GB" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all">
                </div>

                <!-- Категория и Город -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="categoryLabel">Категория</label>
                        <select id="postCategory" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            <option value="furniture" data-i18n="cat_furniture">Мебель</option>
                            <option value="tech" data-i18n="cat_tech">Техника</option>
                            <option value="auto" data-i18n="cat_auto">Авто</option>
                            <option value="clothes" data-i18n="cat_clothes">Одежда</option>
                            <option value="other" data-i18n="cat_other">Разное</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="cityLabel">Город</label>
                        <select id="postCity" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            <option value="budva">Будва</option>
                            <option value="bar">Бар</option>
                            <option value="tivat">Тиват</option>
                            <option value="podgorica">Подгорица</option>
                            <option value="kotor">Котор</option>
                            <option value="herceg_novi">Херцег-Нови</option>
                        </select>
                    </div>
                </div>

                <!-- Цена -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="priceLabel">Цена (€)</label>
                    <input type="number" id="postPrice" required placeholder="0 (если бесплатно)" min="0" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all">
                </div>

                <!-- Описание -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="descLabel">Описание</label>
                    <textarea id="postDesc" rows="4" required placeholder="Опишите состояние, комплектацию и детали..." class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all resize-none"></textarea>
                </div>

                <!-- Telegram для связи -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="tgLabel">Telegram для связи</label>
                    <input type="text" id="postTelegram" required placeholder="@username" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all">
                </div>

                <!-- Кнопка отправки -->
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer mt-4">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> <span data-i18n="publishBtn">Опубликовать объявление</span>
                </button>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe?.user?.username) {
                document.getElementById('postTelegram').value = '@' + tg.initDataUnsafe.user.username;
            }
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dict = {
            ru: {
                back: "Назад", title: "Новое объявление", photosLabel: "Фотографии (до 5 шт.)",
                addPhotoBtn: "Нажмите, чтобы добавить фото", nameLabel: "Название",
                categoryLabel: "Категория", cityLabel: "Город", priceLabel: "Цена (€)",
                descLabel: "Описание", tgLabel: "Telegram для связи", publishBtn: "Опубликовать объявление",
                cat_furniture: "Мебель", cat_tech: "Техника", cat_auto: "Авто", cat_clothes: "Одежда", cat_other: "Разное",
                publishing: "Публикация...", maxPhotos: "Максимально можно загрузить 5 фотографий"
            },
            en: {
                back: "Back", title: "New Listing", photosLabel: "Photos (up to 5)",
                addPhotoBtn: "Click to add photos", nameLabel: "Title",
                categoryLabel: "Category", cityLabel: "City", priceLabel: "Price (€)",
                descLabel: "Description", tgLabel: "Telegram username", publishBtn: "Publish listing",
                cat_furniture: "Furniture", cat_tech: "Electronics", cat_auto: "Vehicles", cat_clothes: "Clothing", cat_other: "Other",
                publishing: "Publishing...", maxPhotos: "Maximum 5 photos allowed"
            },
            cnr: {
                back: "Nazad", title: "Novi oglas", photosLabel: "Fotografije (do 5)",
                addPhotoBtn: "Kliknite da dodate fotografije", nameLabel: "Naziv",
                categoryLabel: "Kategorija", cityLabel: "Grad", priceLabel: "Cijena (€)",
                descLabel: "Opis", tgLabel: "Telegram za kontakt", publishBtn: "Objavi oglas",
                cat_furniture: "Namještaj", cat_tech: "Tehnika", cat_auto: "Auto", cat_clothes: "Odjeća", cat_other: "Razno",
                publishing: "Objavljivanje...", maxPhotos: "Možete otpremiti najviše 5 fotografija"
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let selectedFiles = [];

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });
        }
        document.getElementById('langSelect').value = currentLang;
        changeLanguage(currentLang);

        function handleImageSelection(e) {
            const files = Array.from(e.target.files);
            if (selectedFiles.length + files.length > 5) {
                alert(dict[currentLang].maxPhotos);
                return;
            }
            
            selectedFiles = selectedFiles.concat(files);
            renderPreviews();
            e.target.value = ''; // сброс инпута для возможности повторного выбора того же файла
        }

        function removeImage(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
        }

        function renderPreviews() {
            const container = document.getElementById('imagePreviewsContainer');
            if (selectedFiles.length === 0) {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            container.innerHTML = selectedFiles.map((file, idx) => {
                const url = URL.createObjectURL(file);
                return `
                    <div class="relative h-20 rounded-xl overflow-hidden border border-gray-200 bg-gray-100 group">
                        <img src="${url}" class="w-full h-full object-cover" alt="Preview">
                        <button type="button" onclick="removeImage(${idx})" class="absolute top-1 right-1 bg-black/60 hover:bg-red-600 text-white p-1 rounded-full transition-all cursor-pointer">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function submitPost(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = dict[currentLang].publishing;

            try {
                let imageUrls = [];

                // Загружаем файлы в Supabase Storage
                for (const file of selectedFiles) {
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}_${file.name}`;
                    const { data, error } = await supabaseClient.storage.from('posts_images').upload(fileName, file);
                    
                    if (error) throw error;

                    const { data: publicUrlData } = supabaseClient.storage.from('posts_images').getPublicUrl(fileName);
                    imageUrls.push(publicUrlData.publicUrl);
                }

                // Запасное фото, если ничего не выбрали
                if (imageUrls.length === 0) {
                    imageUrls.push('https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
                }

                const newPost = {
                    title: document.getElementById('postTitle').value,
                    category: document.getElementById('postCategory').value,
                    city: document.getElementById('postCity').value,
                    price: Number(document.getElementById('postPrice').value),
                    description: document.getElementById('postDesc').value,
                    telegram: document.getElementById('postTelegram').value,
                    images: imageUrls,
                    image_url: imageUrls[0], // для обратной совместимости
                    views: 0
                };

                const { error: insertError } = await supabaseClient.from('posts').insert([newPost]);
                if (insertError) throw insertError;

                window.location.href = 'index.html';

            } catch (err) {
                console.error(err);
                alert('Ошибка при публикации: ' + (err.message || 'Неизвестная ошибка'));
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i data-lucide="plus-circle" class="w-4 h-4"></i> <span>${dict[currentLang].publishBtn}</span>`;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
