<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разместить объявление — MNE Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[#f5f6f8] text-gray-900 pb-28 selection:bg-[#009cf0] selection:text-white antialiased">

    <!-- Toast уведомление -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none flex items-center gap-2">
        <span id="toastText">Уведомление</span>
    </div>

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200/80 sticky top-0 z-30 shadow-xs">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-gray-700 hover:text-gray-950 font-semibold text-xs transition-all cursor-pointer">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> <span data-i18n="back">Назад к объявлениям</span>
            </a>
            <span class="font-extrabold text-sm text-gray-900" data-i18n="headerTitle">Новое объявление</span>
            <div class="w-20"></div> <!-- Для баланса -->
        </div>
    </header>

    <!-- Основная форма -->
    <main class="max-w-2xl mx-auto px-4 pt-6">
        <form id="createForm" onsubmit="handleFormSubmit(event)" class="bg-white rounded-3xl border border-gray-200/80 p-6 shadow-xs space-y-6">
            
            <!-- Загрузка фото -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider" data-i18n="photosLabel">Фотографии (до 3 штук)</label>
                <div class="grid grid-cols-3 gap-3" id="imagePreviewsContainer">
                    <label id="addPhotoBtn" class="aspect-square bg-gray-50 hover:bg-blue-50/50 border-2 border-dashed border-gray-200 hover:border-[#009cf0] rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all text-gray-400 hover:text-[#009cf0]">
                        <i data-lucide="camera" class="w-6 h-6"></i>
                        <span class="text-[10px] font-semibold mt-1" data-i18n="addPhoto">Добавить</span>
                        <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImagesSelect(event)">
                    </label>
                </div>
            </div>

            <!-- Название -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider" data-i18n="titleLabel">Название товара</label>
                <input type="text" id="titleInput" required placeholder="Например: Велосипед Giant в отличном состоянии" class="w-full bg-gray-50 border border-gray-200 focus:border-[#009cf0] focus:bg-white rounded-2xl px-4 py-3 text-xs sm:text-sm outline-none transition-all">
            </div>

            <!-- Категория и Город -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider" data-i18n="catLabel">Категория</label>
                    <select id="categorySelect" required class="w-full bg-gray-50 border border-gray-200 focus:border-[#009cf0] focus:bg-white rounded-2xl px-4 py-3 text-xs sm:text-sm outline-none transition-all cursor-pointer">
                        <option value="auto" data-i18n="cat_auto">Авто</option>
                        <option value="realestate" data-i18n="cat_realestate">Недвижимость</option>
                        <option value="furniture" data-i18n="cat_furniture">Мебель и интерьер</option>
                        <option value="tech" data-i18n="cat_tech">Электроника</option>
                        <option value="clothes" data-i18n="cat_clothes">Одежда, обувь</option>
                        <option value="other" data-i18n="cat_other">Разные вещи</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider" data-i18n="cityLabel">Город</label>
                    <select id="citySelect" required class="w-full bg-gray-50 border border-gray-200 focus:border-[#009cf0] focus:bg-white rounded-2xl px-4 py-3 text-xs sm:text-sm outline-none transition-all cursor-pointer">
                        <option value="budva">Будва</option>
                        <option value="bar">Бар</option>
                        <option value="tivat">Тиват</option>
                        <option value="podgorica">Подгорица</option>
                        <option value="kotor">Котор</option>
                        <option value="herceg_novi">Херцег-Нови</option>
                    </select>
                </div>
            </div>

            <!-- Цена -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider" data-i18n="priceLabel">Цена (€) — оставьте 0 если бесплатно</label>
                <input type="number" id="priceInput" min="0" value="0" required class="w-full bg-gray-50 border border-gray-200 focus:border-[#009cf0] focus:bg-white rounded-2xl px-4 py-3 text-xs sm:text-sm outline-none transition-all">
            </div>

            <!-- Описание -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider" data-i18n="descLabel">Описание</label>
                <textarea id="descInput" rows="4" required placeholder="Расскажите подробнее о товаре, состоянии и условиях самовывоза..." class="w-full bg-gray-50 border border-gray-200 focus:border-[#009cf0] focus:bg-white rounded-2xl p-4 text-xs sm:text-sm outline-none transition-all resize-none"></textarea>
            </div>

            <!-- Контакты -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider" data-i18n="contactLabel">Контакт для связи (Telegram username или телефон)</label>
                <input type="text" id="contactInput" required placeholder="@username или +382..." class="w-full bg-gray-50 border border-gray-200 focus:border-[#009cf0] focus:bg-white rounded-2xl px-4 py-3 text-xs sm:text-sm outline-none transition-all">
            </div>

            <!-- Кнопка отправки -->
            <button type="submit" id="submitBtn" class="w-full bg-[#009cf0] hover:bg-[#0089d1] active:scale-98 text-white font-bold py-4 rounded-2xl text-sm transition-all shadow-lg shadow-blue-500/20 cursor-pointer flex items-center justify-center gap-2">
                <span data-i18n="submitBtn">Опубликовать объявление</span>
            </button>
        </form>
    </main>

    <!-- Скрипты -->
    <script>
        lucide.createIcons();

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe?.user?.username) {
                document.getElementById('contactInput').value = '@' + tg.initDataUnsafe.user.username;
            }
        }

        let userToken = localStorage.getItem('mne_user_token');
        if (!userToken) {
            userToken = 'user_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('mne_user_token', userToken);
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedFiles = [];

        function showToast(text) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            toastText.innerText = text;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 2500);
        }

        function handleImagesSelect(e) {
            const files = Array.from(e.target.files);
            if (selectedFiles.length + files.length > 3) {
                showToast('Максимум 3 фотографии');
                return;
            }

            files.forEach(file => {
                selectedFiles.push(file);
            });

            renderImagePreviews();
        }

        function removeImage(index) {
            selectedFiles.splice(index, 1);
            renderImagePreviews();
        }

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewsContainer');
            const addBtnHtml = `
                <label id="addPhotoBtn" class="aspect-square bg-gray-50 hover:bg-blue-50/50 border-2 border-dashed border-gray-200 hover:border-[#009cf0] rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all text-gray-400 hover:text-[#009cf0]">
                    <i data-lucide="camera" class="w-6 h-6"></i>
                    <span class="text-[10px] font-semibold mt-1">Добавить</span>
                    <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImagesSelect(event)">
                </label>
            `;

            let html = '';
            selectedFiles.forEach((file, index) => {
                const url = URL.createObjectURL(file);
                html += `
                    <div class="relative aspect-square rounded-2xl overflow-hidden border border-gray-200 group bg-gray-100">
                        <img src="${url}" class="w-full h-full object-cover">
                        <button type="button" onclick="removeImage(${index})" class="absolute top-1.5 right-1.5 bg-gray-900/80 hover:bg-rose-600 text-white p-1.5 rounded-full transition-all cursor-pointer">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            });

            if (selectedFiles.length < 3) {
                html += addBtnHtml;
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Публикация...';

            try {
                let imageUrls = [];

                // Загружаем файлы в бакет post-images
                for (const file of selectedFiles) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36.substring(2, 7))}.${fileExt}`;
                    
                    const { data: uploadData, error: uploadError } = await supabaseClient.storage
                        .from('post-images') // <--- ИСПОЛЬЗУЕМ ВАШ БАКЕТ
                        .upload(fileName, file);

                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = supabaseClient.storage
                        .from('post-images') // <--- ИСПОЛЬЗУЕМ ВАШ БАКЕТ
                        .getPublicUrl(fileName);

                    imageUrls.push(publicUrlData.publicUrl);
                }

                const postData = {
                    title: document.getElementById('titleInput').value.trim(),
                    category: document.getElementById('categorySelect').value,
                    city: document.getElementById('citySelect').value,
                    price: Number(document.getElementById('priceInput').value || 0),
                    description: document.getElementById('descInput').value.trim(),
                    contact: document.getElementById('contactInput').value.trim(),
                    image_url: imageUrls[0] || null,
                    images: imageUrls,
                    user_token: userToken,
                    telegram_id: tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : null
                };

                const { data, error } = await supabaseClient
                    .from('posts')
                    .insert([postData])
                    .select();

                if (error) throw error;

                if (data && data[0]) {
                    let myPosts = JSON.parse(localStorage.getItem('mne_my_posts') || '[]');
                    myPosts.push(String(data[0].id));
                    localStorage.setItem('mne_my_posts', JSON.stringify(myPosts));
                }

                showToast('Объявление успешно опубликовано!');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (err) {
                console.error('Ошибка публикации:', err);
                showToast('Ошибка публикации: ' + (err.message || 'Попробуйте снова'));
                submitBtn.disabled = false;
                submitBtn.innerText = 'Опубликовать объявление';
            }
        }
    </script>
</body>
</html>
