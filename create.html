<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подать объявление</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo">AvitoClone</a>
      <div class="header-actions">
        <a href="index.html" class="btn-primary" style="background: #707579;">На главную</a>
      </div>
    </div>
  </header>

  <main class="container-form">
    <h2 style="margin-bottom: 20px;">Новое объявление</h2>
    <form id="createForm">
      <div class="form-group">
        <label>Название товара</label>
        <input type="text" id="title" required placeholder="Например: Велосипед Stels">
      </div>
      <div class="form-group">
        <label>Категория</label>
        <select id="category">
          <option value="Электроника">Электроника</option>
          <option value="Транспорт">Транспорт</option>
          <option value="Недвижимость">Недвижимость</option>
          <option value="Работа">Работа</option>
          <option value="Личные вещи">Личные вещи</option>
        </select>
      </div>
      <div class="form-group">
        <label>Цена (₽)</label>
        <input type="number" id="price" required placeholder="0">
      </div>
      <div class="form-group">
        <label>Город / Местоположение</label>
        <input type="text" id="location" placeholder="Например: Москва">
      </div>
      <div class="form-group">
        <label>Фотография</label>
        <input type="file" id="imageFile" accept="image/*">
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="description" rows="5" placeholder="Укажите состояние, характеристики..."></textarea>
      </div>
      <div class="form-group">
        <label>Имя и телефон для связи</label>
        <input type="text" id="contact_name" placeholder="Иван, +7 999 000-00-00">
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 16px;" id="submitBtn">Опубликовать</button>
    </form>
  </main>

  <script src="supabase.js"></script>
  <script>
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Публикация...';
      btn.disabled = true;

      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const price = parseFloat(document.getElementById('price').value);
      const location = document.getElementById('location').value;
      const description = document.getElementById('description').value;
      const contact_name = document.getElementById('contact_name').value;
      const fileInput = document.getElementById('imageFile');

      let imageUrl = '';

      try {
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}.${fileExt}`;

          const { error: uploadError } = await supabase.storage
            .from('images') // Убедись, что создан бакет с именем images
            .upload(fileName, file);

          if (uploadError) throw uploadError;

          const { data: publicUrlData } = supabase.storage
            .from('images')
            .getPublicUrl(fileName);

          imageUrl = publicUrlData.publicUrl;
        }

        const { error: insertError } = await supabase
          .from('ads')
          .insert([{ title, category, price, location, description, contact_name, image_url: imageUrl }]);

        if (insertError) throw insertError;

        alert('Успешно опубликовано!');
        window.location.href = 'index.html';

      } catch (err) {
        console.error(err);
        alert('Ошибка при публикации: ' + err.message);
        btn.textContent = 'Опубликовать';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
