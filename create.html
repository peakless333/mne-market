                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="nameLabel">Название</label>

                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>

                        <select id="postCategory" onchange="onCategoryChange()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                        </select>
                    </div>

                    <div id="subCategoryWrapper" class="hidden">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="subcategoryLabel">Подкатегория</label>
                        <select id="postSubCategory" onchange="renderCategoryAttributes()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="cityLabel">Город</label>
                        <select id="postCity" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                        </select>
                    </div>
                </div>

                <div id="categoryAttributesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="priceLabel">Цена (€)</label>
                    <input type="number" id="postPrice" required placeholder="0 (если бесплатно)" min="0" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all">
                </div>

                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="descLabel">Описание</label>

                    },
                    size_top: { label: "Veličina (Gornji dio)", opts: { xs: "XS", s: "S", m: "M", l: "L", xl: "XL", xxl: "XXL", other: "Ostalo" } },
                    size_bottom: { 
                        label: "Veličina (Donji dio)", 
                        opts: { 
                            "28": "28", "29": "29", "30": "30", "31": "31", "32": "32", 
                            "33": "33", "34": "34", "36": "36", "38": "38", "40": "40", "other": "Ostalo" 
                        } 
                    },
                    size_shoes: { 
                        label: "Veličina (Obuća)", 
                        opts: { 
                            "38": "38 EU", "39": "39 EU", "40": "40 EU", "41": "41 EU", 
                            "42": "42 EU", "43": "43 EU", "44": "44 EU", "45": "45 EU", "46": "46 EU", "other": "Ostalo" 
                        } 
                    },
                    furniture_type: { label: "Vrsta namještaja", opts: { sofa: "Sofe i fotelje", table: "Stolovi i stolice", bed: "Kreveti i dušeci", wardrobe: "Ormari i komode", office: "Kancelarijski namještaj", other: "Ostalo" } },
                    kids_type: {

                        opts: {

                            clothes_kids: "Odjeća i obuća", 
                            furniture_kids: "Dječiji namještaj", 
                            feeding: "Hranjenje i njega", 
                            other_kids: "Ostalo" 
                        } 
                    },
                    brand: { label: "Marka / Proizvođač" },
                    year: { label: "Godina proizvodnje" },
                    mileage: { label: "Kilometraža (km)" }
                }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let selectedFiles = [];
        let existingImages = [];
        let currentPostAttributes = {}; 

        function initCategoriesSelect(selectedCat = 'realty', selectedSub = '') {
            const catSelect = document.getElementById('postCategory');
            const catsObj = dict[currentLang].categories;
            
            catSelect.innerHTML = Object.keys(catsObj).map(code => `
                <option value="${code}" ${code === selectedCat ? 'selected' : ''}>${catsObj[code].name}</option>
            `).join('');

            updateSubCategories(selectedCat, selectedSub);
        }

        function updateSubCategories(catCode, selectedSub = '') {
            const subWrapper = document.getElementById('subCategoryWrapper');
            const subSelect = document.getElementById('postSubCategory');
            const catsObj = dict[currentLang].categories;
            
            if (catsObj[catCode] && catsObj[catCode].subs) {
                const subsObj = catsObj[catCode].subs;
                subSelect.innerHTML = Object.keys(subsObj).map(subCode => `
                    <option value="${subCode}" ${subCode === selectedSub ? 'selected' : ''}>${subsObj[subCode]}</option>
                `).join('');
                subWrapper.classList.remove('hidden');
            } else {
                subSelect.innerHTML = '';
                subWrapper.classList.add('hidden');
            }
        }

        function onCategoryChange() {
            const catCode = document.getElementById('postCategory').value;
            updateSubCategories(catCode);
            renderCategoryAttributes();
        }

        function initCitiesSelect(selectedCity = 'budva') {
            const citySelect = document.getElementById('postCity');
            const citiesObj = dict[currentLang].cities;
            citySelect.innerHTML = Object.keys(citiesObj).map(code => `
                <option value="${code}" ${code === selectedCity ? 'selected' : ''}>${citiesObj[code]}</option>
            `).join('');
        }

        function renderCategoryAttributes(savedValues = {}) {
            const category = document.getElementById('postCategory').value;
            const container = document.getElementById('categoryAttributesContainer');
            const a = dict[currentLang].attrs;
            let html = '';

            if (category === 'clothes') {
                const currentClothesType = savedValues.clothes_type || 'top';
                html += `
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.clothes_type.label}</label>
                        <select id="attr_clothes_type" onchange="updateClothesSizeDropdown()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            ${Object.keys(a.clothes_type.opts).map(k => `<option value="${k}" ${currentClothesType === k ? 'selected' : ''}>${a.clothes_type.opts[k]}</option>`).join('')}
                        </select>
                    </div>
                    <div id="clothesSizeWrapper"></div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.condition.label}</label>
                        <select id="attr_condition" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            ${Object.keys(a.condition.opts).map(k => `<option value="${k}" ${savedValues.condition === k ? 'selected' : ''}>${a.condition.opts[k]}</option>`).join('')}
                        </select>
                    </div>
                `;
            } else if (category === 'tech') {
                html += `
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.brand.label}</label>
                        <input type="text" id="attr_brand" value="${savedValues.brand || ''}" placeholder="Apple, Samsung..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.condition.label}</label>
                        <select id="attr_condition" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            ${Object.keys(a.condition.opts).map(k => `<option value="${k}" ${savedValues.condition === k ? 'selected' : ''}>${a.condition.opts[k]}</option>`).join('')}
                        </select>
                    </div>
                `;
            } else if (category === 'auto') {
                html += `
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.year.label}</label>
                        <input type="number" id="attr_year" value="${savedValues.year || ''}" placeholder="2018" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.mileage.label}</label>
                        <input type="number" id="attr_mileage" value="${savedValues.mileage || ''}" placeholder="150000" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.condition.label}</label>
                        <select id="attr_condition" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            ${Object.keys(a.condition.opts).map(k => `<option value="${k}" ${savedValues.condition === k ? 'selected' : ''}>${a.condition.opts[k]}</option>`).join('')}
                        </select>
                    </div>
                `;
            } else if (category === 'furniture') {
                html += `
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.furniture_type.label}</label>
                        <select id="attr_furniture_type" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            ${Object.keys(a.furniture_type.opts).map(k => `<option value="${k}" ${savedValues.furniture_type === k ? 'selected' : ''}>${a.furniture_type.opts[k]}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.condition.label}</label>
                        <select id="attr_condition" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            ${Object.keys(a.condition.opts).map(k => `<option value="${k}" ${savedValues.condition === k ? 'selected' : ''}>${a.condition.opts[k]}</option>`).join('')}
                        </select>
                    </div>
                `;
            } else if (category === 'kids') {
                html += `
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.kids_type.label}</label>
                        <select id="attr_kids_type" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            ${Object.keys(a.kids_type.opts).map(k => `<option value="${k}" ${savedValues.kids_type === k ? 'selected' : ''}>${a.kids_type.opts[k]}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.condition.label}</label>
                        <select id="attr_condition" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            ${Object.keys(a.condition.opts).map(k => `<option value="${k}" ${savedValues.condition === k ? 'selected' : ''}>${a.condition.opts[k]}</option>`).join('')}
                        </select>
                    </div>
                `;
            } else {
                html += `
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${a.condition.label}</label>
                        <select id="attr_condition" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                            ${Object.keys(a.condition.opts).map(k => `<option value="${k}" ${savedValues.condition === k ? 'selected' : ''}>${a.condition.opts[k]}</option>`).join('')}
                        </select>
                    </div>
                `;
            }

            container.innerHTML = html;
            if (category === 'clothes') {
                updateClothesSizeDropdown(savedValues.size);
            }
        }

        function updateClothesSizeDropdown(selectedSize = '') {
            const typeEl = document.getElementById('attr_clothes_type');
            const wrapper = document.getElementById('clothesSizeWrapper');
            if (!typeEl || !wrapper) return;

            const clothesType = typeEl.value;
            const a = dict[currentLang].attrs;
            let sizeObj, labelText, elementId;

            if (clothesType === 'top') {
                sizeObj = a.size_top.opts;
                labelText = a.size_top.label;
                elementId = 'attr_size_top';
            } else if (clothesType === 'bottom') {
                sizeObj = a.size_bottom.opts;
                labelText = a.size_bottom.label;
                elementId = 'attr_size_bottom';
            } else {
                sizeObj = a.size_shoes.opts;
                labelText = a.size_shoes.label;
                elementId = 'attr_size_shoes';
            }

            wrapper.innerHTML = `
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">${labelText}</label>
                    <select id="${elementId}" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
                        ${Object.keys(sizeObj).map(k => `<option value="${k}" ${selectedSize === k ? 'selected' : ''}>${sizeObj[k]}</option>`).join('')}
                    </select>
                </div>
            `;
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            if (editPostId) {
                document.getElementById('pageTitle').innerText = dict[lang].titleEdit;
                document.getElementById('submitBtn').querySelector('span').innerText = dict[lang].saveBtn;
            } else {
                document.getElementById('pageTitle').innerText = dict[lang].titleNew;
                document.getElementById('submitBtn').querySelector('span').innerText = dict[lang].publishBtn;
            }

            document.getElementById('postTitle').placeholder = dict[lang].ph_title;
            document.getElementById('postPrice').placeholder = dict[lang].ph_price;
            document.getElementById('postDesc').placeholder = dict[lang].ph_desc;

            const currentCatValue = document.getElementById('postCategory').value || 'realty';
            const currentSubValue = document.getElementById('postSubCategory') ? document.getElementById('postSubCategory').value : '';
            initCategoriesSelect(currentCatValue, currentSubValue);

            const currentCityValue = document.getElementById('postCity').value || 'budva';
            initCitiesSelect(currentCityValue);
            
            const currentAttrs = collectAttributesFromDOM();
            renderCategoryAttributes(currentAttrs);
        }

        function collectAttributesFromDOM() {
            const attrs = {};
            const condEl = document.getElementById('attr_condition');
            const clothesTypeEl = document.getElementById('attr_clothes_type');
            const sizeTopEl = document.getElementById('attr_size_top');
            const sizeBottomEl = document.getElementById('attr_size_bottom');
            const sizeShoesEl = document.getElementById('attr_size_shoes');
            const furnEl = document.getElementById('attr_furniture_type');
            const kidsEl = document.getElementById('attr_kids_type');
            const brandEl = document.getElementById('attr_brand');
            const yearEl = document.getElementById('attr_year');
            const milEl = document.getElementById('attr_mileage');

            if (condEl) attrs.condition = condEl.value;
            if (clothesTypeEl) {
                attrs.clothes_type = clothesTypeEl.value;
                if (sizeTopEl) attrs.size = sizeTopEl.value;
                if (sizeBottomEl) attrs.size = sizeBottomEl.value;
                if (sizeShoesEl) attrs.size = sizeShoesEl.value;
            }
            if (furnEl) attrs.furniture_type = furnEl.value;
            if (kidsEl) attrs.kids_type = kidsEl.value;
            if (brandEl) attrs.brand = brandEl.value;
            if (yearEl) attrs.year = yearEl.value;
            if (milEl) attrs.mileage = milEl.value;

            return attrs;
        }

        document.getElementById('langSelect').value = currentLang;
        initCategoriesSelect();
        initCitiesSelect();
        renderCategoryAttributes();
        changeLanguage(currentLang);

        if (editPostId) {
            document.getElementById('pageTitle').innerText = dict[currentLang].titleEdit;
            document.getElementById('submitBtn').innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> <span>${dict[currentLang].saveBtn}</span>`;
            loadPostForEditing(editPostId);
        }

        async function loadPostForEditing(id) {
            try {
                const { data, error } = await supabaseClient.from('posts').select('*').eq('id', id).single();
                if (error) throw error;
                if (!data) return;

                document.getElementById('postTitle').value = data.title || '';
                
                const loadedCat = data.category || 'realty';
                const loadedSub = data.subcategory || data.sub_category || '';
                initCategoriesSelect(loadedCat, loadedSub);

                initCitiesSelect(data.city || 'budva');
                
                currentPostAttributes = data.attributes || {};
                renderCategoryAttributes(currentPostAttributes);

                document.getElementById('postPrice').value = data.price || 0;
                document.getElementById('postDesc').value = data.description || '';
                document.getElementById('postTelegram').value = data.telegram || data.contact || '';

                existingImages = data.images && Array.isArray(data.images) ? [...data.images] : (data.image_url ? [data.image_url] : []);
                renderPreviews();
            } catch (err) {
                console.error(err);
                alert('Не удалось загрузить объявление для редактирования');
            }
        }

        const dropZone = document.getElementById('dropZone');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('border-blue-500', 'bg-blue-50/70');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('border-blue-500', 'bg-blue-50/70');
            }, false);
        });

        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const files = Array.from(e.dataTransfer.files).filter(file => file.type.startsWith('image/'));
                if (files.length > 0) {
                    processFiles(files);
                    return;
                }
            }

            const items = e.dataTransfer.items;
            if (items) {
                for (const item of items) {
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        if (file) {
                            processFiles([file]);
                            return;
                        }
                    }
                }
            }

            const htmlData = e.dataTransfer.getData('text/html');
            const uriData = e.dataTransfer.getData('text/uri-list');
            const plainText = e.dataTransfer.getData('text/plain');
            
            let imageUrl = '';
            if (htmlData) {
                const match = htmlData.match(/src="([^"]+)"/);
                if (match && match[1]) {
                    imageUrl = match[1];
                }
            }
            if (!imageUrl && uriData) {
                imageUrl = uriData;
            }
            if (!imageUrl && plainText && (plainText.startsWith('http://') || plainText.startsWith('https://'))) {
                imageUrl = plainText;
            }

            if (imageUrl) {
                try {
                    const response = await fetch(imageUrl);
                    const blob = await response.blob();
                    if (blob.type.startsWith('image/')) {
                        const fileName = `tg_image_${Date.now()}.${blob.type.split('/')[1] || 'jpg'}`;
                        const file = new File([blob], fileName, { type: blob.type });
                        processFiles([file]);
                    }
                } catch (err) {
                    try {
                        const proxyResponse = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(imageUrl)}`);
                        const proxyBlob = await proxyResponse.blob();
                        const fileName = `tg_image_${Date.now()}.${proxyBlob.type.split('/')[1] || 'jpg'}`;
                        const file = new File([proxyBlob], fileName, { type: proxyBlob.type || 'image/jpeg' });
                        processFiles([file]);
                    } catch (proxyErr) {
                        console.error(proxyErr);
                        alert("Не удалось загрузить эту картинку напрямую. Попробуйте сохранить её или выбрать через проводник.");
                    }
                }
            }
        }, false);

        window.addEventListener('paste', async (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const files = [];
            
            for (const item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const blob = item.getAsFile();
                    if (blob) {
                        const fileName = `clipboard_${Date.now()}.${blob.type.split('/')[1] || 'jpg'}`;
                        files.push(new File([blob], fileName, { type: blob.type }));
                    }
                }
            }
            
            if (files.length > 0) {
                e.preventDefault();
                processFiles(files);
            }
        });

        function handleImageSelection(e) {
            const files = Array.from(e.target.files);
            processFiles(files);
            e.target.value = '';
        }

        function processFiles(files) {
            if (existingImages.length + selectedFiles.length + files.length > 10) {
                alert(dict[currentLang].maxPhotos);
                return;
            }
            selectedFiles = selectedFiles.concat(files);
            renderPreviews();
        }

        function removeExistingImage(index) {
            existingImages.splice(index, 1);
            renderPreviews();
        }

        function removeNewImage(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
        }

        function renderPreviews() {
            const container = document.getElementById('imagePreviewsContainer');
            if (existingImages.length === 0 && selectedFiles.length === 0) {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            let html = '';

            existingImages.forEach((url, idx) => {
                html += `
                    <div class="relative h-20 rounded-xl overflow-hidden border border-gray-200 bg-gray-100">
                        <img src="${url}" class="w-full h-full object-cover" alt="Preview">
                        <button type="button" onclick="removeExistingImage(${idx})" class="absolute top-1 right-1 bg-black/60 hover:bg-red-600 text-white p-1 rounded-full transition-all cursor-pointer">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            });

            selectedFiles.forEach((file, idx) => {
                const url = URL.createObjectURL(file);
                html += `
                    <div class="relative h-20 rounded-xl overflow-hidden border border-blue-200 bg-blue-50">
                        <img src="${url}" class="w-full h-full object-cover" alt="Preview">
                        <button type="button" onclick="removeNewImage(${idx})" class="absolute top-1 right-1 bg-black/60 hover:bg-red-600 text-white p-1 rounded-full transition-all cursor-pointer">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            lucide.createIcons();
        }

        async function submitPost(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = dict[currentLang].publishing;

            try {
                let imageUrls = [...existingImages];

                for (const file of selectedFiles) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                    
                    const { error } = await supabaseClient.storage.from('post-images').upload(fileName, file);
                    if (error) throw error;

                    const { data: publicUrlData } = supabaseClient.storage.from('post-images').getPublicUrl(fileName);
                    imageUrls.push(publicUrlData.publicUrl);
                }

                if (imageUrls.length === 0) {
                    imageUrls.push('https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
                }

                const postData = {
                    title: document.getElementById('postTitle').value.trim(),
                    category: document.getElementById('postCategory').value,
                    subcategory: document.getElementById('postSubCategory') ? document.getElementById('postSubCategory').value : null,
                    city: document.getElementById('postCity').value,
                    attributes: collectAttributesFromDOM(),
                    price: Number(document.getElementById('postPrice').value || 0),
                    description: document.getElementById('postDesc').value.trim(),
                    telegram: document.getElementById('postTelegram').value.trim(),
                    contact: document.getElementById('postTelegram').value.trim(),
                    images: imageUrls,
                    image_url: imageUrls[0],
                    username: usernameToken,
                    user_token: usernameToken
                };

                if (editPostId) {
                    const { error: updateError } = await supabaseClient.from('posts').update(postData).eq('id', editPostId);
                    if (updateError) throw updateError;
                } else {
                    postData.telegram_id = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : null;
                    postData.views = 0;

                    const { data, error: insertError } = await supabaseClient.from('posts').insert([postData]).select();
                    if (insertError) throw insertError;
                }

                window.location.href = 'index.html';

            } catch (err) {
                console.error(err);
                alert('Ошибка при сохранении: ' + (err.message || 'Неизвестная ошибка'));
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i data-lucide="plus-circle" class="w-4 h-4"></i> <span>${editPostId ? dict[currentLang].saveBtn : dict[currentLang].publishBtn}</span>`;
                lucide.createIcons();
            }
        }
    </script>
