<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Объявление</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-16">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span data-i18n="backBtn">Назад к объявлениям</span>
            </a>

            <!-- Переключатель языка -->
            <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-2.5 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                <option value="ru">🇷🇺 RU</option>
                <option value="en">🇬🇧 EN</option>
                <option value="cnr">🇲🇪 CNR</option>
            </select>
        </div>
    </header>

    <!-- Основной контент страницы -->
    <main class="max-w-6xl mx-auto px-4 pt-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Левая колонка: Карточка объявления -->
            <div id="postContainer" class="lg:col-span-2 bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
                <div class="text-center text-gray-400 py-12" data-i18n="loading">Загрузка...</div>
            </div>

            <!-- Правая колонка: Похожие объявления -->
            <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm h-fit">
                <div class="flex items-center gap-2 font-bold text-gray-900 mb-4">
                    <i data-lucide="sparkles" class="w-5 h-5 text-blue-600"></i>
                    <span data-i18n="similarTitle">Похожие объявления</span>
                </div>
                <div id="similarGrid" class="space-y-3">
                    <div class="text-xs text-gray-400 text-center py-4" data-i18n="loading">Загрузка...</div>
                </div>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjcxNzMsImV4cCI6MjA3MTQ0NDM3M30.17Gx37ZpxkJPNICCISTZHOdbf1bmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dict = {
            ru: {
                backBtn: "Назад к объявлениям", loading: "Загрузка...", free: "Бесплатно",
                description: "ОПИСАНИЕ", contactSeller: "Написать продавцу", similarTitle: "Похожие объявления",
                notFound: "Объявление не найдено", noSimilar: "Нет похожих объявлений", noContacts: "Контакты не указаны",
                cities: { Будва: "Будва", Бар: "Бар", Тиват: "Тиват", Подгорица: "Подгорица", Котор: "Котор", "Херцег-Нови": "Херцег-Нови" },
                categories: { Мебель: "Мебель", Техника: "Техника", Авто: "Авто", Одежда: "Одежда", Разное: "Разное" }
            },
            en: {
                backBtn: "Back to listings", loading: "Loading...", free: "Free",
                description: "DESCRIPTION", contactSeller: "Contact seller", similarTitle: "Similar listings",
                notFound: "Listing not found", noSimilar: "No similar listings found", noContacts: "No contact info",
                cities: { Будва: "Budva", Бар: "Bar", Тиват: "Tivat", Подгорица: "Podgorica", Котор: "Kotor", "Херцег-Нови": "Herceg Novi" },
                categories: { Мебель: "Furniture", Техника: "Electronics", Авто: "Vehicles", Одежда: "Clothing", Разное: "Other" }
            },
            cnr: {
                backBtn: "Nazad na oglase", loading: "Učitavanje...", free: "Besplatno",
                description: "OPIS", contactSeller: "Kontaktiraj prodavca", similarTitle: "Slični oglasi",
                notFound: "Oglas nije pronađen", noSimilar: "Nema sličnih oglasa", noContacts: "Kontakt nije naveden",
                cities: { Будва: "Budva", Бар: "Bar", Тиват: "Tivat", Подгорица: "Podgorica", Котор: "Kotor", "Херцег-Нови": "Herceg Novi" },
                categories: { Мебель: "Namještaj", Техника: "Tehnika", Авто: "Auto", Одежда: "Odjeća", Разное: "Razno" }
            }
        };

        // Берем сохраненный язык из localStorage
        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let currentPost = null;
        let similarPosts = [];

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);

            // Переводим статические элементы UI
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            if (currentPost) renderPostDetails(currentPost);
            if (similarPosts.length > 0) renderSimilarPosts(similarPosts);
        }

        async function fetchPost() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');

            if (!postId) {
                document.getElementById('postContainer').innerHTML = `<div class="text-center text-red-500 py-12">${dict[currentLang].notFound}</div>`;
                return;
            }

            const { data: post, error } = await supabaseClient.from('posts').select('*').eq('id', postId).single();

            if (error || !post) {
                document.getElementById('postContainer').innerHTML = `<div class="text-center text-red-500 py-12">${dict[currentLang].notFound}</div>`;
                return;
            }

            currentPost = post;
            renderPostDetails(post);
            fetchSimilarPosts(post.category, post.id);
        }

        function renderPostDetails(post) {
            const isFree = Number(post.price) === 0;
            const priceTag = isFree 
                ? `<span class="font-bold text-2xl text-emerald-600">${dict[currentLang].free}</span>` 
                : `<span class="font-bold text-2xl text-blue-600">${post.price} €</span>`;
            
            const cityName = dict[currentLang].cities[post.city] || post.city;
            const categoryName = dict[currentLang].categories[post.category] || post.category || 'Razno';
            
            const mainImg = (post.images && post.images.length > 0) ? post.images[0] : (post.image_url || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
            
            // Получаем никнейм из всех возможных названий колонок
            const rawTg = post.telegram || post.telegram_username || post.tg || '';
            const tgUsername = rawTg.replace('@', '').trim();
            const dateStr = post.created_at ? new Date(post.created_at).toLocaleDateString() : '';

            document.getElementById('postContainer').innerHTML = `
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="w-full md:w-1/2 h-72 md:h-96 bg-gray-100 rounded-2xl overflow-hidden">
                        <img src="${mainImg}" class="w-full h-full object-cover" alt="${post.title}">
                    </div>
                    <div class="w-full md:w-1/2 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <span class="bg-blue-50 text-blue-600 text-xs font-semibold px-2.5 py-1 rounded-lg">${categoryName}</span>
                                <span class="text-xs text-gray-400">${dateStr}</span>
                            </div>
                            <h1 class="text-2xl font-bold text-gray-900 mb-2">${post.title}</h1>
                            <div class="flex items-center gap-1 text-gray-500 text-xs mb-4">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                                <span>${cityName}</span>
                            </div>
                            <div class="mb-6">${priceTag}</div>
                            
                            <hr class="border-gray-100 my-4">
                            
                            <div>
                                <h4 class="text-xs font-bold text-gray-400 tracking-wider uppercase mb-2">${dict[currentLang].description}</h4>
                                <p class="text-sm text-gray-600 whitespace-pre-line">${post.description || ''}</p>
                            </div>
                        </div>

                        ${tgUsername ? `
                            <a href="https://t.me/${tgUsername}" target="_blank" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl flex items-center justify-center gap-2 transition-colors shadow-sm">
                                <i data-lucide="send" class="w-4 h-4"></i>
                                <span>${dict[currentLang].contactSeller} (@${tgUsername})</span>
                            </a>
                        ` : `
                            <div class="mt-6 w-full bg-gray-100 text-gray-500 font-medium py-3 rounded-xl text-center text-sm">
                                ${dict[currentLang].noContacts}
                            </div>
                        `}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        async function fetchSimilarPosts(category, currentId) {
            const { data: posts } = await supabaseClient.from('posts').select('*').eq('category', category).neq('id', currentId).limit(4);
            similarPosts = posts || [];
            renderSimilarPosts(similarPosts);
        }

        function renderSimilarPosts(posts) {
            const grid = document.getElementById('similarGrid');
            if (posts.length === 0) {
                grid.innerHTML = `<div class="text-xs text-gray-400 text-center py-4">${dict[currentLang].noSimilar}</div>`;
                return;
            }

            grid.innerHTML = posts.map(post => {
                const img = (post.images && post.images.length > 0) ? post.images[0] : (post.image_url || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
                const cityName = dict[currentLang].cities[post.city] || post.city;
                const isFree = Number(post.price) === 0;

                return `
                    <a href="post.html?id=${post.id}" class="flex items-center gap-3 p-2 rounded-xl hover:bg-gray-50 transition-colors border border-gray-100 group">
                        <img src="${img}" class="w-14 h-14 rounded-lg object-cover" alt="${post.title}">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-semibold text-gray-900 truncate group-hover:text-blue-600">${post.title}</h4>
                            <div class="text-[10px] text-gray-400 mt-0.5">${cityName}</div>
                            <div class="text-xs font-bold text-blue-600 mt-1">${isFree ? dict[currentLang].free : post.price + ' €'}</div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // Инициализация при загрузке
        document.getElementById('langSelect').value = currentLang;
        changeLanguage(currentLang);
        fetchPost();
    </script>
</body>
</html>
