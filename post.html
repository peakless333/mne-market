<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Объявление</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[#f5f6f8] text-gray-900 pb-28 selection:bg-[#009cf0] selection:text-white antialiased">

    <!-- Уведомление -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none flex items-center gap-2">
        Ссылка скопирована в буфер обмена!
    </div>

    <!-- Шапка сайта -->
    <header class="bg-white border-b border-gray-200/80 sticky top-0 z-30 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-gray-600 hover:text-gray-900 font-semibold text-xs transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> <span data-i18n="back">Назад к объявлениям</span>
            </a>
            
            <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-3 py-2 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                <option value="ru">RU</option>
                <option value="en">EN</option>
                <option value="cnr">CNR</option>
            </select>
        </div>
    </header>

    <!-- Основной контент товара -->
    <main class="max-w-6xl mx-auto px-4 pt-6 animate-fade-in">
        <div id="loadingState" class="text-center text-gray-400 py-20 text-sm font-medium" data-i18n="loading">Загрузка объявления...</div>
        
        <div id="postContent" class="grid grid-cols-1 md:grid-cols-3 gap-6 hidden">
            <!-- Левая колонка: Картинки -->
            <div class="md:col-span-2 space-y-3">
                <div class="bg-white rounded-2xl overflow-hidden border border-gray-200/80 shadow-xs p-3.5 relative">
                    <!-- Кнопка Избранного на фото -->
                    <button onclick="toggleCurrentFavorite()" class="absolute top-6 right-6 bg-white/90 hover:bg-white p-2.5 rounded-full transition-all text-gray-700 shadow-sm z-20 cursor-pointer active:scale-90">
                        <i id="favIcon" data-lucide="heart" class="w-5 h-5"></i>
                    </button>

                    <div id="mainImageWrapper" onclick="openFullscreen()" class="relative h-[380px] sm:h-[440px] bg-gray-50 rounded-xl overflow-hidden cursor-zoom-in group flex items-center justify-center">
                        <img id="mainProductImage" src="" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-500" alt="Product">
                        <div class="absolute bottom-3 right-3 bg-black/70 text-white text-[11px] font-medium px-3 py-1.5 rounded-xl backdrop-blur-md flex items-center gap-1.5 shadow-sm">
                            <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> <span data-i18n="zoomText">Нажмите для увеличения</span>
                        </div>
                    </div>
                    <div id="thumbnailsContainer" class="grid grid-cols-5 gap-2 mt-3"></div>
                </div>
            </div>

            <!-- Правая колонка: Информация и контакты -->
            <div class="space-y-4">
                <div class="bg-white rounded-2xl p-6 border border-gray-200/80 shadow-xs space-y-4">
                    <div class="flex items-center justify-between text-xs text-gray-400 font-medium">
                        <span id="postCategoryBadge" class="bg-blue-50 text-[#009cf0] font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider"></span>
                        <div class="flex items-center gap-3">
                            <span id="postViews" class="flex items-center gap-1"><i data-lucide="eye" class="w-3.5 h-3.5"></i> <span id="viewsCount">0</span></span>
                            <span id="postDate"></span>
                        </div>
                    </div>

                    <h1 id="postTitle" class="text-xl font-extrabold text-gray-950 tracking-tight"></h1>
                    
                    <div class="flex items-center gap-1.5 text-xs text-gray-500 font-medium">
                        <i data-lucide="map-pin" class="w-4 h-4 text-gray-400"></i> <span id="postCity"></span>
                    </div>

                    <div id="postPrice" class="text-2xl font-black text-gray-950 pt-2 border-t border-gray-100"></div>

                    <div class="space-y-1 pt-1">
                        <h3 class="text-[11px] font-bold text-gray-400 tracking-wider uppercase" data-i18n="desc">ОПИСАНИЕ</h3>
                        <p id="postDesc" class="text-xs sm:text-sm text-gray-600 whitespace-pre-line leading-relaxed"></p>
                    </div>

                    <div class="space-y-2 pt-3">
                        <!-- Кнопка связи с продавцом -->
                        <a id="postTelegramBtn" href="#" target="_blank" class="w-full bg-[#009cf0] hover:bg-[#0089d1] active:scale-95 text-white font-medium py-3.5 rounded-xl transition-all shadow-sm shadow-blue-500/20 flex items-center justify-center gap-2 text-sm">
                            <i data-lucide="send" class="w-4 h-4"></i> <span data-i18n="contactBtn">Написать продавцу</span>
                        </a>

                        <!-- Кнопка Поделиться в Telegram -->
                        <button onclick="shareToTelegram()" class="w-full bg-sky-50 hover:bg-sky-100 text-sky-700 font-semibold py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 text-xs cursor-pointer active:scale-95">
                            <i data-lucide="share-2" class="w-4 h-4"></i> <span data-i18n="shareBtn">Поделиться в Telegram</span>
                        </button>

                        <!-- Кнопка Копировать ссылку -->
                        <button onclick="copyLink()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 text-xs cursor-pointer active:scale-95">
                            <i data-lucide="copy" class="w-4 h-4"></i> <span data-i18n="copyBtn">Скопировать ссылку</span>
                        </button>
                    </div>
                </div>

                <!-- Похожие -->
                <div class="bg-white rounded-2xl p-5 border border-gray-200/80 shadow-xs space-y-3">
                    <h3 class="font-bold text-sm text-gray-950" data-i18n="similarTitle">Похожие объявления</h3>
                    <div id="similarContainer" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Полноэкранная галерея -->
    <div id="imageModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center backdrop-blur-md select-none">
        <button onclick="closeFullscreen()" class="absolute top-4 right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-2.5 rounded-full transition-all z-50 cursor-pointer">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>

        <div id="imageCounter" class="absolute top-5 left-1/2 -translate-x-1/2 text-white/90 text-xs font-semibold bg-black/40 px-3.5 py-1.5 rounded-full z-50 backdrop-blur-sm">
            1 / 1
        </div>

        <button onclick="prevImage(event)" class="absolute left-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-3 rounded-full transition-all z-50 cursor-pointer hidden md:flex items-center justify-center">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>

        <div class="relative w-full h-full flex items-center justify-center p-4">
            <img id="fullscreenImage" src="" class="max-w-full max-h-full object-contain transition-transform duration-200" alt="Fullscreen view">
        </div>

        <button onclick="nextImage(event)" class="absolute right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-3 rounded-full transition-all z-50 cursor-pointer hidden md:flex items-center justify-center">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>
    </div>

    <script>
        lucide.createIcons();

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dict = {
            ru: {
                back: "Назад к объявлениям", loading: "Загрузка объявления...", free: "Бесплатно",
                price: "Цена", city: "Город", desc: "ОПИСАНИЕ", contactBtn: "Написать продавцу",
                shareBtn: "Поделиться в Telegram", copyBtn: "Скопировать ссылку",
                zoomText: "Нажмите для увеличения",
                similarTitle: "Похожие объявления", noSimilar: "Нет похожих объявлений",
                cities: { budva: "Будва", bar: "Бар", tivat: "Тиват", podgorica: "Подгорица", kotor: "Котор", herceg_novi: "Херцег-Нови" },
                categories: { auto: "Авто", realestate: "Недвижимость", furniture: "Мебель", tech: "Электроника", clothes: "Одежда", other: "Разное" }
            },
            en: {
                back: "Back to listings", loading: "Loading listing...", free: "Free",
                price: "Price", city: "City", desc: "DESCRIPTION", contactBtn: "Contact seller",
                shareBtn: "Share to Telegram", copyBtn: "Copy link",
                zoomText: "Click to zoom",
                similarTitle: "Related listings", noSimilar: "No related listings",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" },
                categories: { auto: "Vehicles", realestate: "Real estate", furniture: "Furniture", tech: "Electronics", clothes: "Clothing", other: "Other" }
            },
            cnr: {
                back: "Nazad na oglase", loading: "Učitavanje oglasa...", free: "Besplatno",
                price: "Cijena", city: "Grad", desc: "OPIS", contactBtn: "Kontaktiraj prodavca",
                shareBtn: "Podijeli na Telegram", copyBtn: "Kopiraj link",
                zoomText: "Klikni za uvećanje",
                similarTitle: "Slični oglasi", noSimilar: "Nema sličnih oglasa",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" },
                categories: { auto: "Auto", realestate: "Nekretnine", furniture: "Namještaj", tech: "Tehnika", clothes: "Odjeća", other: "Razno" }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let currentPost = null;
        let allPosts = [];
        let postImages = [];
        let currentImageIndex = 0;
        let favorites = JSON.parse(localStorage.getItem('mne_favorites') || '[]');

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        async function initPage() {
            document.getElementById('langSelect').value = currentLang;
            
            const { data: postData, error } = await supabaseClient.from('posts').select('*').eq('id', postId).single();
            const { data: allData } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });

            if (error || !postData) {
                document.getElementById('loadingState').innerHTML = `<div class="text-rose-500 font-semibold">Объявление не найдено</div>`;
                return;
            }

            currentPost = postData;
            allPosts = allData || [];

            const newViews = (currentPost.views || 0) + 1;
            await supabaseClient.from('posts').update({ views: newViews }).eq('id', postId);
            currentPost.views = newViews;

            postImages = currentPost.images && currentPost.images.length > 0 ? currentPost.images : [];
            if (postImages.length === 0 && currentPost.image_url) postImages.push(currentPost.image_url);
            if (postImages.length === 0) postImages.push('https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');

            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('postContent').classList.remove('hidden');

            renderPost();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            if (currentPost) renderPost();
        }

        function formatPrice(val) {
            const num = Number(val);
            if (num === 0) return dict[currentLang].free;
            return num.toLocaleString('ru-RU') + ' €';
        }

        function toggleCurrentFavorite() {
            if (!currentPost) return;
            const stringId = String(currentPost.id);
            if (favorites.includes(stringId)) {
                favorites = favorites.filter(id => id !== stringId);
            } else {
                favorites.push(stringId);
            }
            favorites = [...new Set(favorites)];
            localStorage.setItem('mne_favorites', JSON.stringify(favorites));
            updateFavIcon();
        }

        function updateFavIcon() {
            const favIcon = document.getElementById('favIcon');
            const stringId = String(currentPost.id);
            if (favorites.includes(stringId)) {
                favIcon.classList.add('fill-rose-500', 'text-rose-500');
            } else {
                favIcon.classList.remove('fill-rose-500', 'text-rose-500');
            }
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                }, 2000);
            });
        }

        function switchMainImage(index) {
            currentImageIndex = index;
            document.getElementById('mainProductImage').src = postImages[currentImageIndex];
            
            const thumbs = document.querySelectorAll('.thumb-btn');
            thumbs.forEach((btn, idx) => {
                if (idx === currentImageIndex) {
                    btn.classList.remove('border-gray-200');
                    btn.classList.add('border-[#009cf0]', 'ring-2', 'ring-blue-400');
                } else {
                    btn.classList.remove('border-[#009cf0]', 'ring-2', 'ring-blue-400');
                    btn.classList.add('border-gray-200');
                }
            });
        }

        function openFullscreen() {
            const modal = document.getElementById('imageModal');
            document.getElementById('fullscreenImage').src = postImages[currentImageIndex];
            updateCounter();
            modal.classList.remove('hidden');
        }

        function closeFullscreen() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function nextImage(e) {
            if (e) e.stopPropagation();
            currentImageIndex = (currentImageIndex + 1) % postImages.length;
            updateFullscreenView();
        }

        function prevImage(e) {
            if (e) e.stopPropagation();
            currentImageIndex = (currentImageIndex - 1 + postImages.length) % postImages.length;
            updateFullscreenView();
        }

        function updateFullscreenView() {
            document.getElementById('fullscreenImage').src = postImages[currentImageIndex];
            updateCounter();
            switchMainImage(currentImageIndex);
        }

        function updateCounter() {
            document.getElementById('imageCounter').innerText = `${currentImageIndex + 1} / ${postImages.length}`;
        }

        function shareToTelegram() {
            if (!currentPost) return;
            const priceText = formatPrice(currentPost.price);
            const shareText = `🔥 ${currentPost.title}\n💰 ${priceText}\n📍 ${dict[currentLang].cities[currentPost.city] || currentPost.city}\n\nСмотреть объявление: ${window.location.href}`;
            
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(shareText)}`);
            } else {
                window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(shareText)}`, '_blank');
            }
        }

        let touchStartX = 0;
        let touchEndX = 0;
        const modalElement = document.getElementById('imageModal');
        
        modalElement.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        modalElement.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) nextImage();
            if (touchEndX > touchStartX + 50) prevImage();
        });

        function renderPost() {
            if (!currentPost) return;

            document.getElementById('postPrice').innerText = formatPrice(currentPost.price);
            document.getElementById('postCity').innerText = dict[currentLang].cities[currentPost.city] || currentPost.city;
            document.getElementById('postCategoryBadge').innerText = dict[currentLang].categories[currentPost.category] || currentPost.category || 'Other';
            document.getElementById('viewsCount').innerText = currentPost.views || 0;
            document.getElementById('postDate').innerText = new Date(currentPost.created_at).toLocaleDateString();
            document.getElementById('postTitle').innerText = currentPost.title;
            document.getElementById('postDesc').innerText = currentPost.description || '-';
            
            const rawTg = currentPost.telegram || currentPost.contact || '';
            const tgClean = rawTg.replace('@', '');
            document.getElementById('postTelegramBtn').href = `https://t.me/${tgClean}`;

            updateFavIcon();
            document.getElementById('mainProductImage').src = postImages[0];

            const thumbsContainer = document.getElementById('thumbnailsContainer');
            if (postImages.length > 1) {
                thumbsContainer.innerHTML = postImages.map((img, idx) => `
                    <button onclick="switchMainImage(${idx})" class="thumb-btn relative h-16 rounded-xl overflow-hidden border-2 ${idx === 0 ? 'border-[#009cf0] ring-2 ring-blue-400' : 'border-gray-200'} bg-gray-50 transition-all cursor-pointer">
                        <img src="${img}" class="w-full h-full object-cover" alt="Thumb">
                    </button>
                `).join('');
                thumbsContainer.classList.remove('hidden');
            } else {
                thumbsContainer.classList.add('hidden');
            }

            const similar = allPosts.filter(p => p.category === currentPost.category && p.id !== currentPost.id).slice(0, 3);
            const similarContainer = document.getElementById('similarContainer');
            
            if (similar.length > 0) {
                similarContainer.innerHTML = similar.map(p => {
                    const sImg = (p.images && p.images.length > 0) ? p.images[0] : (p.image_url || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
                    const sPrice = formatPrice(p.price);
                    return `
                        <a href="post.html?id=${p.id}" class="bg-white rounded-xl p-2.5 border border-gray-100 hover:border-gray-300 shadow-xs hover:shadow-md transition-all flex items-center gap-3 group">
                            <img src="${sImg}" class="w-14 h-14 rounded-xl object-cover shrink-0 bg-gray-50" alt="Similar">
                            <div class="min-w-0 flex-1">
                                <h4 class="font-semibold text-xs text-gray-900 truncate group-hover:text-[#009cf0] transition-colors">${p.title}</h4>
                                <p class="text-[11px] text-gray-400 mt-0.5">${dict[currentLang].cities[p.city] || p.city}</p>
                                <p class="font-bold text-xs text-gray-950 mt-0.5">${sPrice}</p>
                            </div>
                        </a>
                    `;
                }).join('');
            } else {
                similarContainer.innerHTML = `<p class="text-xs text-gray-400 py-1">${dict[currentLang].noSimilar}</p>`;
            }
            lucide.createIcons();
        }

        initPage();
    </script>
</body>
</html>
