<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Объявление — MNE Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Шапка сайта -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-gray-600 hover:text-gray-900 font-medium text-sm">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> <span data-i18n="back">Назад к объявлениям</span>
            </a>
            
            <div class="flex items-center gap-2">
                <!-- Переключатель языка -->
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-2.5 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="ru">🇷🇺 RU</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="cnr">🇲🇪 CNR</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Основной контент товара -->
    <main class="max-w-6xl mx-auto px-4 pt-6">
        <div id="postContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Загрузка -->
            <div class="col-span-full text-center text-gray-400 py-12" data-i18n="loading">Загрузка объявления...</div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dict = {
            ru: {
                back: "Назад к объявлениям", loading: "Загрузка...", free: "Бесплатно",
                price: "Цена", city: "Город", desc: "ОПИСАНИЕ", contactBtn: "Написать продавцу",
                similarTitle: "Похожие объявления", noSimilar: "Нет похожих объявлений",
                cities: { budva: "Будва", bar: "Бар", tivat: "Тиват", podgorica: "Подгорица", kotor: "Котор", herceg_novi: "Херцег-Нови" },
                categories: { furniture: "Мебель", tech: "Техника", auto: "Авто", clothes: "Одежда", other: "Разное" }
            },
            en: {
                back: "Back to listings", loading: "Loading...", free: "Free",
                price: "Price", city: "City", desc: "DESCRIPTION", contactBtn: "Contact seller",
                similarTitle: "Related listings", noSimilar: "No related listings",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" },
                categories: { furniture: "Furniture", tech: "Electronics", auto: "Vehicles", clothes: "Clothing", other: "Other" }
            },
            cnr: {
                back: "Nazad na oglase", loading: "Učitavanje...", free: "Besplatno",
                price: "Cijena", city: "Grad", desc: "OPIS", contactBtn: "Kontaktiraj prodavca",
                similarTitle: "Slični oglasi", noSimilar: "Nema sličnih oglasa",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" },
                categories: { furniture: "Namještaj", tech: "Tehnika", auto: "Auto", clothes: "Odjeća", other: "Razno" }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let currentPost = null;
        let allPosts = [];

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        async function initPage() {
            document.getElementById('langSelect').value = currentLang;
            
            // Загружаем текущий товар и список для похожих
            const { data: postData, error } = await supabaseClient.from('posts').select('*').eq('id', postId).single();
            const { data: allData } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });

            if (error || !postData) {
                document.getElementById('postContainer').innerHTML = `<div class="col-span-full text-center text-red-500 py-12">Объявление не найдено</div>`;
                return;
            }

            currentPost = postData;
            allPosts = allData || [];
            renderPost();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            if (currentPost) renderPost();
        }

        // Функция переключения главного фото при клике на миниатюру
        function switchMainImage(url) {
            const mainImg = document.getElementById('mainProductImage');
            if (mainImg) mainImg.src = url;
            
            // Подсветка активной миниатюры
            document.querySelectorAll('.thumb-btn').forEach(btn => {
                btn.classList.remove('border-blue-600', 'ring-2', 'ring-blue-500');
                btn.classList.add('border-gray-200');
            });
            event.currentTarget.classList.remove('border-gray-200');
            event.currentTarget.classList.add('border-blue-600', 'ring-2', 'ring-blue-500');
        }

        function renderPost() {
            if (!currentPost) return;

            const isFree = Number(currentPost.price) === 0;
            const priceText = isFree ? dict[currentLang].free : `${currentPost.price} €`;
            const cityName = dict[currentLang].cities[currentPost.city] || currentPost.city;
            const categoryName = dict[currentLang].categories[currentPost.category] || currentPost.category || 'Other';
            const dateStr = new Date(currentPost.created_at).toLocaleDateString();

            // Собираем все картинки
            let images = currentPost.images && currentPost.images.length > 0 ? currentPost.images : [];
            if (images.length === 0 && currentPost.image_url) images.push(currentPost.image_url);
            if (images.length === 0) images.push('https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');

            const mainImage = images[0];

            // Генерируем миниатюры, если картинок больше одной
            let thumbnailsHTML = '';
            if (images.length > 1) {
                thumbnailsHTML = `
                    <div class="grid grid-cols-5 gap-2 mt-3">
                        ${images.map((img, idx) => `
                            <button onclick="switchMainImage('${img}')" class="thumb-btn relative h-16 rounded-xl overflow-hidden border-2 ${idx === 0 ? 'border-blue-600 ring-2 ring-blue-500' : 'border-gray-200'} bg-gray-100 transition-all">
                                <img src="${img}" class="w-full h-full object-cover" alt="Thumb ${idx + 1}">
                            </button>
                        `).join('')}
                    </div>
                `;
            }

            // Похожие объявления
            const similar = allPosts.filter(p => p.category === currentPost.category && p.id !== currentPost.id).slice(0, 3);
            let similarHTML = similar.length > 0 ? similar.map(p => {
                const sImg = (p.images && p.images.length > 0) ? p.images[0] : (p.image_url || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
                const sPrice = Number(p.price) === 0 ? dict[currentLang].free : `${p.price} €`;
                return `
                    <a href="post.html?id=${p.id}" class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm hover:shadow-md transition-all flex items-center gap-3 group">
                        <img src="${sImg}" class="w-16 h-16 rounded-xl object-cover shrink-0" alt="${p.title}">
                        <div class="min-w-0 flex-1">
                            <h4 class="font-semibold text-xs text-gray-900 truncate group-hover:text-blue-600 transition-colors">${p.title}</h4>
                            <p class="text-[11px] text-gray-400 mt-0.5">${dict[currentLang].cities[p.city] || p.city}</p>
                            <p class="font-bold text-xs text-blue-600 mt-1">${sPrice}</p>
                        </div>
                    </a>
                `;
            }).join('') : `<p class="text-xs text-gray-400">${dict[currentLang].noSimilar}</p>`;

            // Собираем HTML страницы товара
            document.getElementById('postContainer').innerHTML = `
                <!-- Левая колонка: Картинки -->
                <div class="md:col-span-2 space-y-3">
                    <div class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm p-3">
                        <div class="relative h-[380px] bg-gray-100 rounded-xl overflow-hidden">
                            <img id="mainProductImage" src="${mainImage}" class="w-full h-full object-contain" alt="${currentPost.title}">
                        </div>
                        ${thumbnailsHTML}
                    </div>
                </div>

                <!-- Правая колонка: Информация и контакты -->
                <div class="space-y-4">
                    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm space-y-4">
                        <div class="flex items-center justify-between text-xs text-gray-400">
                            <span class="bg-blue-50 text-blue-600 font-semibold px-2.5 py-1 rounded-lg uppercase tracking-wider">${categoryName}</span>
                            <span>${dateStr}</span>
                        </div>

                        <h1 class="text-xl font-bold text-gray-900">${currentPost.title}</h1>
                        
                        <div class="flex items-center gap-1.5 text-xs text-gray-500">
                            <i data-lucide="map-pin" class="w-4 h-4 text-gray-400"></i> ${cityName}
                        </div>

                        <div class="text-2xl font-black text-blue-600 pt-2 border-t border-gray-100">
                            ${priceText}
                        </div>

                        <div>
                            <h3 class="text-[11px] font-bold text-gray-400 tracking-wider mb-1">${dict[currentLang].desc}</h3>
                            <p class="text-sm text-gray-600 whitespace-pre-line leading-relaxed">${currentPost.description || '-'}</p>
                        </div>

                        <a href="https://t.me/${currentPost.telegram}" target="_blank" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2">
                            <i data-lucide="send" class="w-4 h-4"></i> <span data-i18n="contactBtn">Написать продавцу</span> (@${currentPost.telegram})
                        </a>
                    </div>

                    <!-- Похожие -->
                    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm space-y-3">
                        <h3 class="font-bold text-sm text-gray-900" data-i18n="similarTitle">Похожие объявления</h3>
                        <div class="space-y-2">
                            ${similarHTML}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        initPage();
    </script>
</body>
</html>
