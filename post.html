<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNE Market — Просмотр товара</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">MNE Market</a>
      <div class="search-bar">
        <input type="text" placeholder="Поиск по объявлениям...">
      </div>
      <div class="header-right">
        <select class="lang-switcher">
          <option value="ru">RU</option>
          <option value="en">EN</option>
        </select>
        <a href="create.html" class="btn-create">+ Разместить</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="post-layout" id="postContainer">
      <p>Загрузка товара...</p>
    </div>
  </main>

  <script src="supabase.js"></script>
  <script>
    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id');
      const container = document.getElementById('postContainer');

      if (!postId) {
        container.innerHTML = '<p>Объявление не найдено.</p>';
        return;
      }

      const { data, error } = await supabase
        .from('ads')
        .select('*')
        .eq('id', postId)
        .single();

      if (error || !data) {
        container.innerHTML = '<p>Товар не найден или удален.</p>';
        return;
      }

      container.innerHTML = `
        <div class="post-gallery">
          <img src="${data.image_url || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800'}" alt="${data.title}">
        </div>
        <div class="post-info">
          <h1>${data.title}</h1>
          <div class="post-price">€${data.price}</div>
          <p><strong>Категория:</strong> ${data.category}</p>
          <p>${data.description || 'Описание отсутствует.'}</p>
          ${data.telegram_id ? `<p><strong>Telegram:</strong> <a href="https://t.me/${data.telegram_id.replace('@','')}" target="_blank">${data.telegram_id}</a></p>` : ''}
          <a href="index.html" class="btn-submit">На главную</a>
        </div>
      `;
    }

    loadPost();
  </script>
</body>
</html>
