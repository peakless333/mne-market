<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Просмотр объявления</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo">AvitoClone</a>
      <div class="header-actions">
        <a href="index.html" class="btn-primary" style="background: #707579;">На главную</a>
      </div>
    </div>
  </header>

  <main class="container-post" id="postContainer">
    <p>Загрузка товара...</p>
  </main>

  <script src="supabase.js"></script>
  <script>
    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const container = document.getElementById('postContainer');

      if (!id) {
        container.innerHTML = '<p>Объявление не найдено.</p>';
        return;
      }

      const { data, error } = await supabase.from('ads').select('*').eq('id', id).single();

      if (error || !data) {
        container.innerHTML = '<p>Товар не существует или был удален.</p>';
        return;
      }

      container.innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;" id="postLayoutGrid">
          <div>
            <img src="${data.image_url || 'https://via.placeholder.com/400x300?text=No+Photo'}" style="width: 100%; border-radius: var(--radius); object-fit: cover;" alt="">
          </div>
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <h1 style="font-size: 26px;">${data.title}</h1>
            <div style="font-size: 32px; font-weight: 800; color: var(--text-main);">${Number(data.price).toLocaleString()} ₽</div>
            <hr style="border: none; border-top: 1px solid var(--border-color);">
            <h3>Описание</h3>
            <p style="white-space: pre-line; color: var(--text-secondary);">${data.description || 'Описание отсутствует'}</p>
            <div style="margin-top: auto; background: #f0f8ff; padding: 16px; border-radius: var(--radius);">
              <strong>Контактное лицо:</strong> ${data.contact_name || 'Продавец'}<br>
              <strong>Телефон / Связь:</strong> ${data.phone || 'Не указан'}
            </div>
          </div>
        </div>
      `;
    }
    loadPost();
  </script>
</body>
</html>
