<html lang="ru">

        Ссылка скопирована в буфер обмена!

    <!-- Шапка сайта -->

        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-gray-600 hover:text-gray-900 font-medium text-sm">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> <span data-i18n="back">Назад к объявлениям</span>
            </a>
            
            <div class="flex items-center gap-2">
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-2.5 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="ru">🇷🇺 RU</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="cnr">🇲🇪 CNR</option>
                </select>
            </div>
        </div>
    </header>

        <div id="postContent" class="grid grid-cols-1 md:grid-cols-3 gap-6 hidden">
            <!-- Левая колонка: Картинки -->
            <div class="md:col-span-2 space-y-3">
                <div class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm p-3 relative">
                    <!-- Кнопка Избранного на фото -->
                    <button onclick="toggleCurrentFavorite()" class="absolute top-6 right-6 bg-white/90 hover:bg-white p-2.5 rounded-full transition-all text-gray-600 shadow-md z-20 cursor-pointer">
                        <i id="favIcon" data-lucide="heart" class="w-5 h-5"></i>
                    </button>

                    <div id="mainImageWrapper" class="relative h-[380px] bg-gray-100 rounded-xl overflow-hidden group">
                        <!-- Само изображение (клик открывает полный экран) -->
                        <img id="mainProductImage" src="" onclick="openFullscreen()" class="w-full h-full object-contain cursor-zoom-in" alt="Product">
                        
                        <!-- Компактные стрелки переключения прямо на превью -->
                        <button id="prevImgBtn" onclick="prevImageInline(event)" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white p-2 rounded-full backdrop-blur-sm transition-all opacity-0 group-hover:opacity-100 cursor-pointer z-20">

                        </button>
                        <button id="nextImgBtn" onclick="nextImageInline(event)" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white p-2 rounded-full backdrop-blur-sm transition-all opacity-0 group-hover:opacity-100 cursor-pointer z-20">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>

                        <div class="absolute bottom-3 right-3 bg-black/70 text-white text-xs px-3 py-1.5 rounded-xl backdrop-blur-md flex items-center gap-1.5 shadow-md pointer-events-none">
                            <i data-lucide="maximize-2" class="w-4 h-4"></i> <span data-i18n="zoomText">Нажмите для увеличения</span>
                        </div>
                    </div>
                    <div id="thumbnailsContainer" class="grid grid-cols-5 gap-2 mt-3"></div>
                </div>
            </div>

            <!-- Правая колонка: Информация и контакты -->
            <div class="space-y-4">
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm space-y-4">
                    <div class="flex items-center justify-between text-xs text-gray-400">
                        <span id="postCategoryBadge" class="bg-blue-50 text-blue-600 font-semibold px-2.5 py-1 rounded-lg uppercase tracking-wider"></span>
                        <div class="flex items-center gap-3">
                            <span id="postViews" class="flex items-center gap-1"><i data-lucide="eye" class="w-3.5 h-3.5"></i> <span id="viewsCount">0</span></span>
                            <span id="postDate"></span>
                        </div>
                    </div>

                    <h1 id="postTitle" class="text-xl font-bold text-gray-900"></h1>
                    
                    <div class="flex items-center gap-1.5 text-xs text-gray-500">

                    </div>

                    <div id="postPrice" class="text-2xl font-black text-blue-600 pt-2 border-t border-gray-100"></div>

                    <div id="attributesContainer" class="hidden border-t border-gray-100 pt-3 space-y-2"></div>

                    <div>
                        <h3 class="text-[11px] font-bold text-gray-400 tracking-wider mb-1" data-i18n="desc">ОПИСАНИЕ</h3>
                        <p id="postDesc" class="text-sm text-gray-600 whitespace-pre-line leading-relaxed"></p>
                    </div>

                    <div class="space-y-2 pt-2">
                        <!-- Кнопка связи с продавцом -->
                        <a id="postTelegramBtn" href="#" target="_blank" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2">
                            <i data-lucide="send" class="w-4 h-4"></i> <span data-i18n="contactBtn">Написать продавцу</span>
                        </a>

                        <!-- Кнопка Поделиться в Telegram -->
                        <button onclick="shareToTelegram()" class="w-full bg-sky-50 hover:bg-sky-100 text-sky-600 font-medium py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 text-xs cursor-pointer">
                            <i data-lucide="share-2" class="w-4 h-4"></i> <span data-i18n="shareBtn">Поделиться в Telegram</span>
                        </button>

                        <!-- Кнопка Копировать ссылку -->
                        <button onclick="copyLink()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 text-xs cursor-pointer">
                            <i data-lucide="copy" class="w-4 h-4"></i> <span data-i18n="copyBtn">Скопировать ссылку</span>
                        </button>
                    </div>
                </div>

                <!-- Похожие -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm space-y-3">
                    <h3 class="font-bold text-sm text-gray-900" data-i18n="similarTitle">Похожие объявления</h3>
                    <div id="similarContainer" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Полноэкранная галерея -->
    <div id="imageModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center backdrop-blur-md select-none">
        <button onclick="closeFullscreen()" class="absolute top-4 right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-2.5 rounded-full transition-all z-50 cursor-pointer">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>

        <div id="imageCounter" class="absolute top-5 left-1/2 -translate-x-1/2 text-white/80 text-sm font-medium bg-black/40 px-3 py-1 rounded-full z-50">
            1 / 1
        </div>

        <button onclick="prevImage(event)" class="absolute left-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-3 rounded-full transition-all z-50 cursor-pointer hidden md:flex items-center justify-center">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>

        <div class="relative w-full h-full flex items-center justify-center p-4">
            <img id="fullscreenImage" src="" class="max-w-full max-h-full object-contain transition-transform duration-200" alt="Fullscreen view">
        </div>

        <button onclick="nextImage(event)" class="absolute right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-3 rounded-full transition-all z-50 cursor-pointer hidden md:flex items-center justify-center">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let currentPost = null;
        let allPosts = [];
        let postImages = [];
        let currentImageIndex = 0;
        let favorites = JSON.parse(localStorage.getItem('mne_favorites') || '[]');

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        async function initPage() {
            document.getElementById('langSelect').value = currentLang;
            changeLanguage(currentLang); // Применяем язык сразу при инициализации
            
            const { data: postData, error } = await supabaseClient.from('posts').select('*').eq('id', postId).single();
            const { data: allData } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });

            if (error || !postData) {
                document.getElementById('loadingState').innerHTML = `<div class="text-red-500">Объявление не найдено</div>`;
                return;
            }

            currentPost = postData;
            allPosts = allData || [];

            const newViews = (currentPost.views || 0) + 1;
            await supabaseClient.from('posts').update({ views: newViews }).eq('id', postId);
            currentPost.views = newViews;

            postImages = currentPost.images && currentPost.images.length > 0 ? currentPost.images : [];
            if (postImages.length === 0 && currentPost.image_url) postImages.push(currentPost.image_url);
            if (postImages.length === 0) postImages.push('https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');

            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('postContent').classList.remove('hidden');

            renderPost();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            if (currentPost) renderPost();
        }

        function formatPrice(val) {
            const num = Number(val);
            if (num === 0) return dict[currentLang].free;
            return num.toLocaleString('ru-RU') + ' €';
        }

        function toggleCurrentFavorite() {
            if (!currentPost) return;
            if (favorites.includes(currentPost.id)) {
                favorites = favorites.filter(id => id !== currentPost.id);
            } else {
                favorites.push(currentPost.id);
            }
            localStorage.setItem('mne_favorites', JSON.stringify(favorites));
            updateFavIcon();
        }

        function updateFavIcon() {
            const favIcon = document.getElementById('favIcon');
            if (favorites.includes(currentPost.id)) {
                favIcon.classList.add('fill-red-500', 'text-red-500');
            } else {
                favIcon.classList.remove('fill-red-500', 'text-red-500');
            }
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 2000);
            });
        }

        function switchMainImage(index) {
            currentImageIndex = index;
            document.getElementById('mainProductImage').src = postImages[currentImageIndex];
            
            const thumbs = document.querySelectorAll('.thumb-btn');
            thumbs.forEach((btn, idx) => {
                if (idx === currentImageIndex) {
                    btn.classList.remove('border-gray-200');
                    btn.classList.add('border-blue-600', 'ring-2', 'ring-blue-500');
                } else {
                    btn.classList.remove('border-blue-600', 'ring-2', 'ring-blue-500');
                    btn.classList.add('border-gray-200');
                }
            });
            updateInlineButtonsVisibility();
        }

        function nextImageInline(e) {
            if (e) e.stopPropagation();
            if (postImages.length <= 1) return;
            currentImageIndex = (currentImageIndex + 1) % postImages.length;
            switchMainImage(currentImageIndex);
        }

        function prevImageInline(e) {
            if (e) e.stopPropagation();
            if (postImages.length <= 1) return;
            currentImageIndex = (currentImageIndex - 1 + postImages.length) % postImages.length;
            switchMainImage(currentImageIndex);
        }

        function updateInlineButtonsVisibility() {
            const prevBtn = document.getElementById('prevImgBtn');
            const nextBtn = document.getElementById('nextImgBtn');
            if (!prevBtn || !nextBtn) return;

            if (postImages.length <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
            }
        }

        function openFullscreen() {
            const modal = document.getElementById('imageModal');
            document.getElementById('fullscreenImage').src = postImages[currentImageIndex];
            updateCounter();
            modal.classList.remove('hidden');
        }

        function closeFullscreen() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function nextImage(e) {
            if (e) e.stopPropagation();
            currentImageIndex = (currentImageIndex + 1) % postImages.length;
            updateFullscreenView();
        }

        function prevImage(e) {
            if (e) e.stopPropagation();
            currentImageIndex = (currentImageIndex - 1 + postImages.length) % postImages.length;
            updateFullscreenView();
        }

        function updateFullscreenView() {
            document.getElementById('fullscreenImage').src = postImages[currentImageIndex];
            updateCounter();
            switchMainImage(currentImageIndex);
        }

        function updateCounter() {
            document.getElementById('imageCounter').innerText = `${currentImageIndex + 1} / ${postImages.length}`;
        }

        function shareToTelegram() {
            if (!currentPost) return;
            const priceText = formatPrice(currentPost.price);
            const shareText = `🔥 ${currentPost.title}\n💰 ${priceText}\n📍 ${dict[currentLang].cities[currentPost.city] || currentPost.city}\n\nСмотреть объявление: ${window.location.href}`;
            
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(shareText)}`);
            } else {
                window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(shareText)}`, '_blank');
            }
        }

        let touchStartX = 0;
        let touchEndX = 0;
        const modalElement = document.getElementById('imageModal');
        
        modalElement.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        modalElement.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) nextImage();
            if (touchEndX > touchStartX + 50) prevImage();
        });

        function renderAttributes() {
            const container = document.getElementById('attributesContainer');
            const attrs = currentPost.attributes;
            const aDict = dict[currentLang].attrs;

            if (!attrs || Object.keys(attrs).length === 0) {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            let html = '';
            
            // Состояние
            if (attrs.condition && aDict.condition.opts[attrs.condition]) {
                html += `
                    <div class="flex justify-between text-xs py-1 border-b border-gray-50">
                        <span class="text-gray-400 font-medium">${aDict.condition.label}</span>
                        <span class="font-semibold text-gray-800">${aDict.condition.opts[attrs.condition]}</span>
                    </div>
                `;
            }

            // Вид услуги
            if (attrs.services_type && aDict.services_type.opts[attrs.services_type]) {
                html += `
                    <div class="flex justify-between text-xs py-1 border-b border-gray-50">
                        <span class="text-gray-400 font-medium">${aDict.services_type.label}</span>
                        <span class="font-semibold text-gray-800">${aDict.services_type.opts[attrs.services_type]}</span>
                    </div>
                `;
            }

            // Тип одежды
            if (attrs.clothes_type && aDict.clothes_type.opts[attrs.clothes_type]) {
                html += `
                    <div class="flex justify-between text-xs py-1 border-b border-gray-50">
                        <span class="text-gray-400 font-medium">${aDict.clothes_type.label}</span>
                        <span class="font-semibold text-gray-800">${aDict.clothes_type.opts[attrs.clothes_type]}</span>
                    </div>
                `;
            }

            // Размер
            if (attrs.size) {
                let sizeLabel = "Размер";
                let sizeVal = attrs.size;
                if (attrs.clothes_type === 'top' && aDict.size_top.opts[attrs.size]) sizeVal = aDict.size_top.opts[attrs.size];
                else if (attrs.clothes_type === 'bottom' && aDict.size_bottom.opts[attrs.size]) sizeVal = aDict.size_bottom.opts[attrs.size];
                else if (attrs.clothes_type === 'shoes' && aDict.size_shoes.opts[attrs.size]) sizeVal = aDict.size_shoes.opts[attrs.size];

                html += `
                    <div class="flex justify-between text-xs py-1 border-b border-gray-50">
                        <span class="text-gray-400 font-medium">${sizeLabel}</span>
                        <span class="font-semibold text-gray-800">${sizeVal}</span>
                    </div>
                `;
            }

            // Вид мебели
            if (attrs.furniture_type && aDict.furniture_type.opts[attrs.furniture_type]) {
                html += `
                    <div class="flex justify-between text-xs py-1 border-b border-gray-50">
                        <span class="text-gray-400 font-medium">${aDict.furniture_type.label}</span>
                        <span class="font-semibold text-gray-800">${aDict.furniture_type.opts[attrs.furniture_type]}</span>
                    </div>
                `;
            }

            // Бренд
            if (attrs.brand) {
                html += `
                    <div class="flex justify-between text-xs py-1 border-b border-gray-50">
                        <span class="text-gray-400 font-medium">${aDict.brand.label}</span>
                        <span class="font-semibold text-gray-800">${attrs.brand}</span>
                    </div>
                `;
            }

            // Год выпуска (Авто)
            if (attrs.year) {
                html += `
                    <div class="flex justify-between text-xs py-1 border-b border-gray-50">
                        <span class="text-gray-400 font-medium">${aDict.year.label}</span>
                        <span class="font-semibold text-gray-800">${attrs.year}</span>
                    </div>
                `;
            }

            // Пробег (Авто)
            if (attrs.mileage) {
                html += `
                    <div class="flex justify-between text-xs py-1 border-b border-gray-50">
                        <span class="text-gray-400 font-medium">${aDict.mileage.label}</span>
                        <span class="font-semibold text-gray-800">${Number(attrs.mileage).toLocaleString('ru-RU')} км</span>
                    </div>
                `;
            }

            if (html !== '') {
                container.innerHTML = html;
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function renderPost() {
            if (!currentPost) return;

            document.getElementById('postPrice').innerText = formatPrice(currentPost.price);
            document.getElementById('postCity').innerText = dict[currentLang].cities[currentPost.city] || currentPost.city;
            document.getElementById('postCategoryBadge').innerText = dict[currentLang].categories[currentPost.category] || currentPost.category || 'Other';
            document.getElementById('viewsCount').innerText = currentPost.views || 0;
            document.getElementById('postDate').innerText = new Date(currentPost.created_at).toLocaleDateString();
            document.getElementById('postTitle').innerText = currentPost.title;
            document.getElementById('postDesc').innerText = currentPost.description || '-';
            
            renderAttributes();

            const tgClean = currentPost.telegram.replace('@', '');
            document.getElementById('postTelegramBtn').href = `https://t.me/${tgClean}`;

            updateFavIcon();
            document.getElementById('mainProductImage').src = postImages[0];
            updateInlineButtonsVisibility();

            const thumbsContainer = document.getElementById('thumbnailsContainer');
            if (postImages.length > 1) {
                thumbsContainer.innerHTML = postImages.map((img, idx) => `
                    <button onclick="switchMainImage(${idx})" class="thumb-btn relative h-16 rounded-xl overflow-hidden border-2 ${idx === 0 ? 'border-blue-600 ring-2 ring-blue-500' : 'border-gray-200'} bg-gray-100 transition-all cursor-pointer">
                        <img src="${img}" class="w-full h-full object-cover" alt="Thumb">
                    </button>
                `).join('');
                thumbsContainer.classList.remove('hidden');
            } else {
                thumbsContainer.classList.add('hidden');
            }

            const similar = allPosts.filter(p => p.category === currentPost.category && p.id !== currentPost.id).slice(0, 3);
            const similarContainer = document.getElementById('similarContainer');
            
            if (similar.length > 0) {
                similarContainer.innerHTML = similar.map(p => {
                    const sImg = (p.images && p.images.length > 0) ? p.images[0] : (p.image_url || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
                    const sPrice = formatPrice(p.price);
                    return `
                        <a href="post.html?id=${p.id}" class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm hover:shadow-md transition-all flex items-center gap-3 group">
                            <img src="${sImg}" class="w-16 h-16 rounded-xl object-cover shrink-0" alt="Similar">
                            <div class="min-w-0 flex-1">
                                <h4 class="font-semibold text-xs text-gray-900 truncate group-hover:text-blue-600 transition-colors">${p.title}</h4>
                                <p class="text-[11px] text-gray-400 mt-0.5">${dict[currentLang].cities[p.city] || p.city}</p>
                                <p class="font-bold text-xs text-blue-600 mt-1">${sPrice}</p>
                            </div>
                        </a>
                    `;
                }).join('');
            } else {
                similarContainer.innerHTML = `<p class="text-xs text-gray-400">${dict[currentLang].noSimilar}</p>`;
            }
            lucide.createIcons();
        }

        initPage();
    </script>
</body>
</html>
