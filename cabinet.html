<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Личный кабинет — MNE Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f5f6f8] text-gray-950 min-h-screen pb-20 antialiased">

    <!-- Уведомления -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none">
        <span id="toastText"></span>
    </div>

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-black text-lg text-gray-950 tracking-tight">
                <span class="text-xl">🇲🇪</span> 
                <span>MNE<span class="text-[#009cf0]">Market</span></span>
            </a>
            <div class="flex items-center gap-2">
                <!-- Переключатель языка -->
                <div class="flex bg-gray-100 p-1 rounded-xl text-xs font-semibold">
                    <button onclick="setLang('ru')" id="langRu" class="px-2.5 py-1.5 rounded-lg transition-all">RU</button>
                    <button onclick="setLang('en')" id="langEn" class="px-2.5 py-1.5 rounded-lg transition-all">EN</button>
                    <button onclick="setLang('me')" id="langMe" class="px-2.5 py-1.5 rounded-lg transition-all">ME</button>
                </div>
                <a href="index.html" id="navHome" class="text-xs font-semibold text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-xl transition-all">
                    На главную
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-6 space-y-6">
        <!-- Блок профиля -->
        <div class="bg-white rounded-3xl p-6 border border-gray-200/80 shadow-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-gradient-to-tr from-blue-500 to-[#009cf0] text-white rounded-2xl flex items-center justify-center text-xl font-black shadow-md shadow-blue-500/20" id="profileInitials">
                    U
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 id="cabinetUsername" class="text-base font-extrabold text-gray-950">Загрузка...</h1>
                        <button onclick="openEditNameModal()" class="text-gray-400 hover:text-[#009cf0] transition-colors p-1 cursor-pointer" title="Изменить имя для вида">
                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <p id="profileSubtitle" class="text-xs text-gray-400 mt-0.5">Управление вашими объявлениями в Черногории</p>
                </div>
            </div>
            <button onclick="logout()" id="logoutBtn" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold px-4 py-2.5 rounded-xl text-xs transition-all cursor-pointer">
                Выйти из аккаунта
            </button>
        </div>

        <h2 id="sectionTitle" class="text-lg font-extrabold text-gray-900">Ваши объявления</h2>

        <!-- Скелетон загрузки -->
        <div id="loadingSkeleton" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
            <div class="bg-white rounded-2xl border border-gray-200/60 overflow-hidden animate-pulse h-60"></div>
            <div class="bg-white rounded-2xl border border-gray-200/60 overflow-hidden animate-pulse h-60"></div>
        </div>

        <!-- Контейнер с объявлениями -->
        <div id="userPostsContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 hidden"></div>

        <!-- Если объявлений нет -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-center space-y-3">
            <div class="bg-gray-100 p-4 rounded-full text-gray-400">
                <i data-lucide="package-open" class="w-8 h-8"></i>
            </div>
            <h3 id="emptyTitle" class="font-bold text-gray-900 text-base">У вас пока нет объявлений</h3>
            <p id="emptyDesc" class="text-xs text-gray-500 max-w-xs">Разместите свой первый товар или услугу на платформе.</p>
            <a href="create.html" id="emptyBtn" class="bg-[#009cf0] hover:bg-[#0089d1] text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition-all shadow-sm">
                Разместить объявление
            </a>
        </div>
    </main>

    <!-- Модалка изменения красивого имени -->
    <div id="editNameModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden items-center justify-center p-4 transition-all">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-gray-950 text-base">Изменить имя профиля</h3>
            <p class="text-xs text-gray-500">Это имя будет отображаться только в вашем личном кабинете для красоты.</p>
            <input type="text" id="newDisplayNameInput" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-xs outline-none focus:border-[#009cf0] focus:bg-white transition-all" placeholder="Введите имя...">
            <div class="flex gap-2 pt-2">
                <button onclick="closeEditNameModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-xl text-xs transition-all cursor-pointer">Отмена</button>
                <button onclick="saveDisplayName()" class="flex-1 bg-[#009cf0] hover:bg-[#0089d1] text-white font-semibold py-2.5 rounded-xl text-xs transition-all cursor-pointer">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const translations = {
            ru: {
                pageTitle: "Личный кабинет — MNE Market",
                navHome: "На главную",
                profileSubtitle: "Управление вашими объявлениями в Черногории",
                logoutBtn: "Выйти из аккаунта",
                sectionTitle: "Ваши объявления",
                emptyTitle: "У вас пока нет объявлений",
                emptyDesc: "Разместите свой первый товар или услугу на платформе.",
                emptyBtn: "Разместить объявление",
                noPhoto: "Нет фото",
                free: "Бесплатно",
                toastLoadError: "Ошибка загрузки объявлений",
                confirmDelete: "Точно удалить это объявление?",
                toastDeleted: "Объявление удалено",
                toastDeleteError: "Не удалось удалить",
                toastNameUpdated: "Имя профиля обновлено"
            },
            en: {
                pageTitle: "Dashboard — MNE Market",
                navHome: "Home",
                profileSubtitle: "Manage your listings in Montenegro",
                logoutBtn: "Log out",
                sectionTitle: "Your Listings",
                emptyTitle: "You don't have any listings yet",
                emptyDesc: "Post your first item or service on the platform.",
                emptyBtn: "Create Listing",
                noPhoto: "No photo",
                free: "Free",
                toastLoadError: "Error loading listings",
                confirmDelete: "Are you sure you want to delete this listing?",
                toastDeleted: "Listing deleted",
                toastDeleteError: "Failed to delete",
                toastNameUpdated: "Profile name updated"
            },
            me: {
                pageTitle: "Korisnički profil — MNE Market",
                navHome: "Početna",
                profileSubtitle: "Upravljajte svojim oglasima u Crnoj Gori",
                logoutBtn: "Odjavite se",
                sectionTitle: "Vaši oglasi",
                emptyTitle: "Još nemate oglasa",
                emptyDesc: "Objavite svoj prvi proizvod ili uslugu na platformi.",
                emptyBtn: "Kreiraj oglas",
                noPhoto: "Nema slike",
                free: "Besplatno",
                toastLoadError: "Greška pri učitavanju oglasa",
                confirmDelete: "Da li ste sigurni da želite da obrišete ovaj oglas?",
                toastDeleted: "Oglas je obrisan",
                toastDeleteError: "Brisanje nije uspjelo",
                toastNameUpdated: "Ime profila je ažurirano"
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            updateLocalization();
            fetchUserPosts();
        }

        function updateLocalization() {
            const t = translations[currentLang];
            document.getElementById('pageTitle').innerText = t.pageTitle;
            document.getElementById('navHome').innerText = t.navHome;
            document.getElementById('profileSubtitle').innerText = t.profileSubtitle;
            document.getElementById('logoutBtn').innerText = t.logoutBtn;
            document.getElementById('sectionTitle').innerText = t.sectionTitle;
            document.getElementById('emptyTitle').innerText = t.emptyTitle;
            document.getElementById('emptyDesc').innerText = t.emptyDesc;
            document.getElementById('emptyBtn').innerText = t.emptyBtn;

            ['ru', 'en', 'me'].forEach(l => {
                const btn = document.getElementById(`lang${l.charAt(0).toUpperCase() + l.slice(1)}`);
                if (l === currentLang) {
                    btn.className = "px-2.5 py-1.5 rounded-lg bg-white text-gray-950 shadow-xs transition-all";
                } else {
                    btn.className = "px-2.5 py-1.5 rounded-lg text-gray-500 hover:text-gray-900 transition-all";
                }
            });
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const currentUser = JSON.parse(localStorage.getItem('mne_logged_user') || 'null');
        if (!currentUser) {
            window.location.href = 'index.html'; 
        } else {
            updateProfileUI();
        }

        function updateProfileUI() {
            const displayName = localStorage.getItem('mne_display_name') || currentUser.username;
            document.getElementById('cabinetUsername').innerText = displayName;
            document.getElementById('profileInitials').innerText = displayName.charAt(0).toUpperCase();
        }

        function openEditNameModal() {
            const currentName = localStorage.getItem('mne_display_name') || currentUser.username;
            document.getElementById('newDisplayNameInput').value = currentName;
            const modal = document.getElementById('editNameModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeEditNameModal() {
            const modal = document.getElementById('editNameModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function saveDisplayName() {
            const newName = document.getElementById('newDisplayNameInput').value.trim();
            if (newName) {
                localStorage.setItem('mne_display_name', newName);
                updateProfileUI();
                showToast(translations[currentLang].toastNameUpdated);
            }
            closeEditNameModal();
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.firstElementChild.innerText = text;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none'), 2000);
        }

        function logout() {
            localStorage.removeItem('mne_logged_user');
            localStorage.removeItem('mne_display_name');
            window.location.href = 'index.html';
        }

        async function fetchUserPosts() {
            const t = translations[currentLang];
            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const currentName = String(currentUser.username || '').toLowerCase().trim();
                const userPosts = (data || []).filter(post => {
                    const postUser = String(post.username || '').toLowerCase().trim();
                    const postToken = String(post.user_token || '').toLowerCase().trim();
                    const postContact = String(post.contact || post.telegram || '').toLowerCase().trim();
                    return postUser === currentName || postToken === currentName || postContact.includes(currentName);
                });

                document.getElementById('loadingSkeleton').classList.add('hidden');
                const container = document.getElementById('userPostsContainer');
                const emptyState = document.getElementById('emptyState');

                if (userPosts.length === 0) {
                    container.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                container.classList.remove('hidden');
                container.classList.add('grid');

                container.innerHTML = userPosts.map(post => {
                    const rawImage = post.image_url || (post.images && post.images[0]);
                    const hasValidImage = rawImage && rawImage.trim() !== '' && !rawImage.includes('images.unsplash.com');
                    const imageBlock = hasValidImage 
                        ? `<img src="${rawImage}" class="w-full h-full object-cover">`
                        : `<div class="w-full h-full bg-blue-50 flex items-center justify-center text-gray-400 text-xs">${t.noPhoto}</div>`;

                    const priceText = post.price ? post.price + ' €' : t.free;

                    return `
                        <div class="bg-white rounded-2xl border border-gray-200/70 overflow-hidden shadow-xs flex flex-col justify-between">
                            <div>
                                <div class="relative aspect-square bg-gray-50 overflow-hidden">
                                    ${imageBlock}
                                    <div class="absolute top-2.5 right-2.5 flex gap-1">
                                        <button onclick="window.location.href='create.html?edit=${post.id}'" class="bg-white/90 hover:bg-[#009cf0] hover:text-white text-gray-700 p-2 rounded-full shadow-sm cursor-pointer">
                                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                        </button>
                                        <button onclick="deletePost('${post.id}')" class="bg-white/90 hover:bg-rose-600 hover:text-white text-rose-600 p-2 rounded-full shadow-sm cursor-pointer">
                                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="p-3">
                                    <span class="font-extrabold text-gray-950 text-sm block">${priceText}</span>
                                    <h3 class="font-medium text-gray-800 text-xs line-clamp-2 mt-1">${post.title}</h3>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                lucide.createIcons();
            } catch (err) {
                console.error(err);
                showToast(t.toastLoadError);
            }
        }

        async function deletePost(id) {
            const t = translations[currentLang];
            if (!confirm(t.confirmDelete)) return;
            try {
                const { error } = await supabaseClient.from('posts').delete().eq('id', id);
                if (error) throw error;
                showToast(t.toastDeleted);
                fetchUserPosts();
            } catch (err) {
                console.error(err);
                showToast(t.toastDeleteError);
            }
        }

        updateLocalization();
        fetchUserPosts();
    </script>
</body>
</html>
