<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Создать объявление — MNE Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f5f6f8] text-gray-950 min-h-screen pb-20 antialiased">

    <!-- Уведомления -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none">
        <span id="toastText"></span>
    </div>

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-black text-lg text-gray-950 tracking-tight">
                <span class="text-xl">🇲🇪</span> 
                <span>MNE<span class="text-[#009cf0]">Market</span></span>
            </a>
            <div class="flex items-center gap-2">
                <!-- Переключатель языка -->
                <div class="flex bg-gray-100 p-1 rounded-xl text-xs font-semibold">
                    <button onclick="setLang('ru')" id="langRu" class="px-2.5 py-1.5 rounded-lg transition-all">RU</button>
                    <button onclick="setLang('en')" id="langEn" class="px-2.5 py-1.5 rounded-lg transition-all">EN</button>
                    <button onclick="setLang('cnr')" id="langCnr" class="px-2.5 py-1.5 rounded-lg transition-all">ME</button>
                </div>
                <a href="index.html" id="navHome" class="text-xs font-semibold text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-xl transition-all">
                    На главную
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-6">
        <div class="bg-white rounded-3xl p-6 md:p-8 border border-gray-200/80 shadow-xs space-y-6">
            <h1 id="mainTitle" class="text-xl font-black text-gray-950">Создать объявление</h1>

            <form id="createForm" onsubmit="handleSubmit(event)" class="space-y-5">
                
                <!-- Название -->
                <div>
                    <label id="labelTitle" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Название товара или услуги</label>
                    <input type="text" id="postTitle" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#009cf0] transition-colors" placeholder="Например: iPhone 13 Pro 128GB">
                </div>

                <!-- Категория -->
                <div>
                    <label id="labelCategory" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Категория</label>
                    <select id="postCategory" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#009cf0] transition-colors cursor-pointer">
                        <option value="tech" id="catTech">Техника</option>
                        <option value="furniture" id="catFurniture">Мебель</option>
                        <option value="kids" id="catKids">Детские товары</option>
                        <option value="property" id="catProperty">Недвижимость</option>
                        <option value="auto" id="catAuto">Автомобили</option>
                        <option value="services" id="catServices">Услуги</option>
                        <option value="jobs" id="catJobs">Работа</option>
                        <option value="clothes" id="catClothes">Одежда и обувь</option>
                        <option value="sport" id="catSport">Спорт и отдых</option>
                        <option value="other" id="catOther">Другое</option>
                    </select>
                </div>

                <!-- Город / Локация -->
                <div>
                    <label id="labelLocation" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Город / Локация</label>
                    <input type="text" id="postLocation" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#009cf0] transition-colors" placeholder="Например: Будва, Подгорица">
                </div>

                <!-- Цена -->
                <div>
                    <label id="labelPrice" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Цена (€)</label>
                    <input type="number" id="postPrice" min="0" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#009cf0] transition-colors" placeholder="Оставьте пустым, если бесплатно">
                </div>

                <!-- Описание -->
                <div>
                    <label id="labelDesc" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Описание</label>
                    <textarea id="postDescription" rows="4" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#009cf0] transition-colors resize-none" placeholder="Расскажите подробнее о вашем товаре или услуге..."></textarea>
                </div>

                <!-- Загрузка фото -->
                <div>
                    <label id="labelImages" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Фотографии (до 5 шт)</label>
                    <div class="flex flex-wrap gap-3" id="imagePreviewsContainer">
                        <label class="w-24 h-24 border-2 border-dashed border-gray-200 hover:border-[#009cf0] rounded-2xl flex flex-col items-center justify-center cursor-pointer text-gray-400 hover:text-[#009cf0] transition-all bg-gray-50">
                            <i data-lucide="camera" class="w-6 h-6"></i>
                            <span id="textAddPhoto" class="text-[10px] font-semibold mt-1">Добавить</span>
                            <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImagesSelect(event)">
                        </label>
                    </div>
                </div>

                <!-- Контактные данные -->
                <div class="border-t border-gray-100 pt-5 space-y-4">
                    <div>
                        <label id="labelTelegram" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Telegram для связи</label>
                        <input type="text" id="postTelegram" oninput="validateForm()" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#009cf0] transition-colors" placeholder="@username">
                    </div>

                    <!-- Кнопка "Другие методы" -->
                    <div>
                        <button type="button" onclick="toggleOtherContact()" id="btnOtherMethods" class="text-xs font-semibold text-[#009cf0] hover:underline flex items-center gap-1 cursor-pointer">
                            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                            <span id="textOtherMethods">Другие методы</span>
                        </button>
                    </div>

                    <!-- Поле Номер телефона (скрытое по умолчанию) -->
                    <div id="phoneContainer" class="hidden">
                        <label id="labelPhone" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Номер телефона</label>
                        <input type="text" id="postPhone" oninput="validateForm()" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#009cf0] transition-colors" placeholder="+382 XX XXX XXX">
                    </div>
                </div>

                <!-- Кнопка публикации -->
                <button type="submit" id="submitBtn" disabled class="w-full bg-gray-300 text-white font-bold py-3.5 rounded-2xl text-sm transition-all shadow-sm flex items-center justify-center gap-2 cursor-not-allowed">
                    <span id="submitBtnText">Опубликовать объявление</span>
                </button>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const translations = {
            ru: {
                pageTitle: "Создать объявление — MNE Market",
                navHome: "На главную",
                mainTitle: "Создать объявление",
                labelTitle: "Название товара или услуги",
                placeholderTitle: "Например: iPhone 13 Pro 128GB",
                labelCategory: "Категория",
                labelLocation: "Город / Локация",
                placeholderLocation: "Например: Будва, Подгорица",
                labelPrice: "Цена (€)",
                placeholderPrice: "Оставьте пустым, если бесплатно",
                labelDesc: "Описание",
                placeholderDesc: "Расскажите подробнее о вашем товаре или услуге...",
                labelImages: "Фотографии (до 5 шт)",
                textAddPhoto: "Добавить",
                labelTelegram: "Telegram для связи",
                textOtherMethods: "Другие методы",
                labelPhone: "Номер телефона",
                submitBtnText: "Опубликовать объявление",
                toastFillContact: "Укажите Telegram или номер телефона",
                toastSuccess: "Объявление успешно опубликовано!",
                toastError: "Ошибка при публикации",
                categories: {
                    "tech": "Техника",
                    "furniture": "Мебель",
                    "kids": "Детские товары",
                    "property": "Недвижимость",
                    "auto": "Автомобили",
                    "services": "Услуги",
                    "jobs": "Работа",
                    "clothes": "Одежда и обувь",
                    "sport": "Спорт и отдых",
                    "other": "Другое"
                }
            },
            en: {
                pageTitle: "Create Listing — MNE Market",
                navHome: "Home",
                mainTitle: "Create Listing",
                labelTitle: "Item or Service Title",
                placeholderTitle: "E.g.: iPhone 13 Pro 128GB",
                labelCategory: "Category",
                labelLocation: "City / Location",
                placeholderLocation: "E.g.: Budva, Podgorica",
                labelPrice: "Price (€)",
                placeholderPrice: "Leave empty if free",
                labelDesc: "Description",
                placeholderDesc: "Tell more about your item or service...",
                labelImages: "Photos (up to 5)",
                textAddPhoto: "Add",
                labelTelegram: "Telegram for contact",
                textOtherMethods: "Other methods",
                labelPhone: "Phone number",
                submitBtnText: "Publish listing",
                toastFillContact: "Please provide Telegram or phone number",
                toastSuccess: "Listing published successfully!",
                toastError: "Error publishing listing",
                categories: {
                    "tech": "Tech",
                    "furniture": "Furniture",
                    "kids": "Kids",
                    "property": "Property",
                    "auto": "Cars",
                    "services": "Services",
                    "jobs": "Jobs",
                    "clothes": "Clothes",
                    "sport": "Sport",
                    "other": "Other"
                }
            },
            cnr: {
                pageTitle: "Kreiraj oglas — MNE Market",
                navHome: "Početna",
                mainTitle: "Kreiraj oglas",
                labelTitle: "Naziv proizvoda ili usluge",
                placeholderTitle: "Na primjer: iPhone 13 Pro 128GB",
                labelCategory: "Kategorija",
                labelLocation: "Grad / Lokacija",
                placeholderLocation: "Na primjer: Budva, Podgorica",
                labelPrice: "Cijena (€)",
                placeholderPrice: "Ostavite prazno ako je besplatno",
                labelDesc: "Opis",
                placeholderDesc: "Opišite detaljnije vaš proizvod ili uslugu...",
                labelImages: "Fotografije (do 5 kom)",
                textAddPhoto: "Dodaj",
                labelTelegram: "Telegram za kontakt",
                textOtherMethods: "Ostale metode",
                labelPhone: "Broj telefona",
                submitBtnText: "Objavi oglas",
                toastFillContact: "Unesite Telegram ili broj telefona",
                toastSuccess: "Oglas je uspješno objavljen!",
                toastError: "Greška prilikom objavljivanja",
                categories: {
                    "tech": "Tehnika",
                    "furniture": "Namještaj",
                    "kids": "Za djecu",
                    "property": "Nekretnine",
                    "auto": "Automobili",
                    "services": "Usluge",
                    "jobs": "Poslovi",
                    "clothes": "Odjeća i obuća",
                    "sport": "Sport i rekreacija",
                    "other": "Ostalo"
                }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        if (currentLang === 'me') {
            currentLang = 'cnr';
            localStorage.setItem('mne_lang', 'cnr');
        }

        let uploadedImages = [];

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            updateLocalization();
        }

        function updateLocalization() {
            const t = translations[currentLang] || translations.ru;
            document.getElementById('pageTitle').innerText = t.pageTitle;
            document.getElementById('navHome').innerText = t.navHome;
            document.getElementById('mainTitle').innerText = t.mainTitle;
            document.getElementById('labelTitle').innerText = t.labelTitle;
            document.getElementById('postTitle').placeholder = t.placeholderTitle;
            document.getElementById('labelCategory').innerText = t.labelCategory;
            document.getElementById('labelLocation').innerText = t.labelLocation;
            document.getElementById('postLocation').placeholder = t.placeholderLocation;
            document.getElementById('labelPrice').innerText = t.labelPrice;
            document.getElementById('postPrice').placeholder = t.placeholderPrice;
            document.getElementById('labelDesc').innerText = t.labelDesc;
            document.getElementById('postDescription').placeholder = t.placeholderDesc;
            document.getElementById('labelImages').innerText = t.labelImages;
            document.getElementById('textAddPhoto').innerText = t.textAddPhoto;
            document.getElementById('labelTelegram').innerText = t.labelTelegram;
            document.getElementById('textOtherMethods').innerText = t.textOtherMethods;
            document.getElementById('labelPhone').innerText = t.labelPhone;
            document.getElementById('submitBtnText').innerText = t.submitBtnText;

            // Обновление категорий в селекте
            const categorySelect = document.getElementById('postCategory');
            Array.from(categorySelect.options).forEach(option => {
                if (t.categories[option.value]) {
                    option.innerText = t.categories[option.value];
                }
            });

            ['ru', 'en', 'cnr'].forEach(l => {
                const btnId = l === 'cnr' ? 'langCnr' : `lang${l.charAt(0).toUpperCase() + l.slice(1)}`;
                const btn = document.getElementById(btnId);
                if (btn) {
                    if (l === currentLang) {
                        btn.className = "px-2.5 py-1.5 rounded-lg bg-white text-gray-950 shadow-xs transition-all";
                    } else {
                        btn.className = "px-2.5 py-1.5 rounded-lg text-gray-500 hover:text-gray-900 transition-all";
                    }
                }
            });
        }

        function toggleOtherContact() {
            const phoneContainer = document.getElementById('phoneContainer');
            phoneContainer.classList.toggle('hidden');
        }

        function validateForm() {
            const telegramVal = document.getElementById('postTelegram').value.trim();
            const phoneVal = document.getElementById('postPhone').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            if (telegramVal !== '' || phoneVal !== '') {
                submitBtn.disabled = false;
                submitBtn.className = "w-full bg-[#009cf0] hover:bg-[#0089d1] text-white font-bold py-3.5 rounded-2xl text-sm transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer";
            } else {
                submitBtn.disabled = true;
                submitBtn.className = "w-full bg-gray-300 text-white font-bold py-3.5 rounded-2xl text-sm transition-all shadow-sm flex items-center justify-center gap-2 cursor-not-allowed";
            }
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.firstElementChild.innerText = text;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none'), 2000);
        }

        function handleImagesSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                if (uploadedImages.length >= 5) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImages.push(e.target.result);
                    renderImagePreviews();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewsContainer');
            const t = translations[currentLang] || translations.ru;
            
            let html = `
                <label class="w-24 h-24 border-2 border-dashed border-gray-200 hover:border-[#009cf0] rounded-2xl flex flex-col items-center justify-center cursor-pointer text-gray-400 hover:text-[#009cf0] transition-all bg-gray-50">
                    <i data-lucide="camera" class="w-6 h-6"></i>
                    <span class="text-[10px] font-semibold mt-1">${t.textAddPhoto}</span>
                    <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImagesSelect(event)">
                </label>
            `;

            uploadedImages.forEach((imgSrc, index) => {
                html += `
                    <div class="relative w-24 h-24 rounded-2xl overflow-hidden border border-gray-200 group">
                        <img src="${imgSrc}" class="w-full h-full object-cover">
                        <button type="button" onclick="removeImage(${index})" class="absolute top-1 right-1 bg-black/60 hover:bg-rose-600 text-white p-1 rounded-full transition-colors cursor-pointer">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            lucide.createIcons();
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderImagePreviews();
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const currentUser = JSON.parse(localStorage.getItem('mne_logged_user') || 'null');

        async function handleSubmit(event) {
            event.preventDefault();
            const t = translations[currentLang] || translations.ru;

            const telegramVal = document.getElementById('postTelegram').value.trim();
            const phoneVal = document.getElementById('postPhone').value.trim();

            if (!telegramVal && !phoneVal) {
                showToast(t.toastFillContact);
                return;
            }

            const title = document.getElementById('postTitle').value.trim();
            const category = document.getElementById('postCategory').value;
            const location = document.getElementById('postLocation').value.trim();
            const price = document.getElementById('postPrice').value.trim();
            const description = document.getElementById('postDescription').value.trim();

            const postData = {
                title: title,
                category: category,
                location: location,
                price: price ? Number(price) : null,
                description: description,
                telegram: telegramVal,
                phone: phoneVal,
                contact: telegramVal || phoneVal,
                images: uploadedImages,
                image_url: uploadedImages[0] || '',
                username: currentUser ? currentUser.username : 'Guest',
                user_token: currentUser ? currentUser.username : 'Guest',
                created_at: new Date().toISOString()
            };

            try {
                const { error } = await supabaseClient.from('posts').insert([postData]);
                if (error) throw error;
                showToast(t.toastSuccess);
                setTimeout(() => {
                    window.location.href = 'cabinet.html';
                }, 1000);
            } catch (err) {
                console.error(err);
                showToast(t.toastError);
            }
        }

        // Инициализация при загрузке
        updateLocalization();
        renderImagePreviews();
    </script>
</body>
</html>
