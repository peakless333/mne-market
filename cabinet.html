<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Личный кабинет — MNE Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f5f6f8] text-gray-950 min-h-screen pb-20 antialiased">

    <!-- Уведомления -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none">
        <span id="toastText"></span>
    </div>

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-black text-lg text-gray-950 tracking-tight">
                <span class="text-xl">🇲🇪</span> 
                <span>MNE<span class="text-[#009cf0]">Market</span></span>
            </a>
            <div class="flex items-center gap-2">
                <!-- Переключатель языка -->
                <div class="flex bg-gray-100 p-1 rounded-xl text-xs font-semibold">
                    <button onclick="setLang('ru')" id="langRu" class="px-2.5 py-1.5 rounded-lg transition-all">RU</button>
                    <button onclick="setLang('en')" id="langEn" class="px-2.5 py-1.5 rounded-lg transition-all">EN</button>
                    <button onclick="setLang('cnr')" id="langCnr" class="px-2.5 py-1.5 rounded-lg transition-all">ME</button>
                </div>
                <a href="index.html" id="navHome" class="text-xs font-semibold text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-xl transition-all">
                    На главную
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">
        <!-- Блок профиля -->
        <div class="bg-white rounded-3xl p-6 md:p-8 border border-gray-200/80 shadow-xs flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4 text-center md:text-left">
                <div class="w-16 h-16 rounded-2xl bg-blue-50 text-[#009cf0] font-black text-2xl flex items-center justify-center shadow-inner" id="userAvatarLetter">
                    U
                </div>
                <div>
                    <h1 id="userNameDisplay" class="text-xl font-black text-gray-950">Пользователь</h1>
                    <p id="userSubTitle" class="text-xs text-gray-400 mt-0.5">Управление вашими объявлениями</p>
                </div>
            </div>
            <a href="create.html" id="btnCreateNew" class="w-full md:w-auto bg-[#009cf0] hover:bg-[#0089d1] text-white font-bold px-5 py-3 rounded-2xl text-xs transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span id="textCreateNew">Создать объявление</span>
            </a>
        </div>

        <!-- Список объявлений -->
        <div class="space-y-4">
            <h2 id="sectionTitleMyPosts" class="text-sm font-bold text-gray-500 uppercase tracking-wider px-1">Мои объявления</h2>
            
            <div id="loadingState" class="text-center text-gray-400 py-12 text-xs" data-i18n="loading">Загрузка...</div>
            
            <div id="myPostsContainer" class="grid grid-cols-1 gap-3 hidden">
                <!-- Сюда динамически рендерятся объявления пользователя -->
            </div>

            <div id="emptyState" class="hidden bg-white rounded-3xl p-10 border border-gray-200/80 text-center space-y-3">
                <div class="w-12 h-12 rounded-2xl bg-gray-100 text-gray-400 flex items-center justify-center mx-auto">
                    <i data-lucide="package-open" class="w-6 h-6"></i>
                </div>
                <h3 id="emptyTitle" class="font-bold text-gray-900 text-sm">У вас пока нет объявлений</h3>
                <p id="emptySubtitle" class="text-xs text-gray-500">Создайте первое объявление, чтобы оно появилось здесь</p>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const translations = {
            ru: {
                pageTitle: "Личный кабинет — MNE Market",
                navHome: "На главную",
                userSubTitle: "Управление вашими объявлениями",
                textCreateNew: "Создать объявление",
                sectionTitleMyPosts: "Мои объявления",
                loading: "Загрузка...",
                emptyTitle: "У вас пока нет объявлений",
                emptySubtitle: "Создайте первое объявление, чтобы оно появилось здесь",
                btnDelete: "Удалить",
                toastDeleted: "Объявление удалено",
                toastError: "Ошибка при удалении",
                free: "Бесплатно",
                negotiable: "Договорная",
                cities: { budva: "Будва", bar: "Бар", tivat: "Тиват", podgorica: "Подгорица", kotor: "Котор", herceg_novi: "Херцег-Нови" }
            },
            en: {
                pageTitle: "Dashboard — MNE Market",
                navHome: "Home",
                userSubTitle: "Manage your listings",
                textCreateNew: "Create listing",
                sectionTitleMyPosts: "My listings",
                loading: "Loading...",
                emptyTitle: "You have no listings yet",
                emptySubtitle: "Create your first listing to see it here",
                btnDelete: "Delete",
                toastDeleted: "Listing deleted",
                toastError: "Error deleting listing",
                free: "Free",
                negotiable: "Negotiable",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" }
            },
            cnr: {
                pageTitle: "Nalog — MNE Market",
                navHome: "Početna",
                userSubTitle: "Upravljanje vašim oglasima",
                textCreateNew: "Kreiraj oglas",
                sectionTitleMyPosts: "Moji oglasi",
                loading: "Učitavanje...",
                emptyTitle: "Još nemate oglasa",
                emptySubtitle: "Kreirajte svoj prvi oglas da bi se pojavio ovdje",
                btnDelete: "Obriši",
                toastDeleted: "Oglas je obrisan",
                toastError: "Greška prilikom brisanja",
                free: "Besplatno",
                negotiable: "Dogovor",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        if (currentLang === 'me') {
            currentLang = 'cnr';
            localStorage.setItem('mne_lang', 'cnr');
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            updateLocalization();
            loadUserPosts();
        }

        function updateLocalization() {
            const t = translations[currentLang] || translations.ru;
            document.getElementById('pageTitle').innerText = t.pageTitle;
            document.getElementById('navHome').innerText = t.navHome;
            document.getElementById('userSubTitle').innerText = t.userSubTitle;
            document.getElementById('textCreateNew').innerText = t.textCreateNew;
            document.getElementById('sectionTitleMyPosts').innerText = t.sectionTitleMyPosts;
            document.getElementById('emptyTitle').innerText = t.emptyTitle;
            document.getElementById('emptySubtitle').innerText = t.emptySubtitle;

            ['ru', 'en', 'cnr'].forEach(l => {
                const btnId = l === 'cnr' ? 'langCnr' : `lang${l.charAt(0).toUpperCase() + l.slice(1)}`;
                const btn = document.getElementById(btnId);
                if (btn) {
                    if (l === currentLang) {
                        btn.className = "px-2.5 py-1.5 rounded-lg bg-white text-gray-950 shadow-xs transition-all";
                    } else {
                        btn.className = "px-2.5 py-1.5 rounded-lg text-gray-500 hover:text-gray-900 transition-all";
                    }
                }
            });
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.firstElementChild.innerText = text;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none'), 2000);
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const currentUser = JSON.parse(localStorage.getItem('mne_logged_user') || 'null');
        
        if (currentUser && currentUser.username) {
            document.getElementById('userNameDisplay').innerText = currentUser.username;
            document.getElementById('userAvatarLetter').innerText = currentUser.username.charAt(0).toUpperCase();
        } else {
            document.getElementById('userNameDisplay').innerText = "Guest User";
            document.getElementById('userAvatarLetter').innerText = "G";
        }

        async function loadUserPosts() {
            const t = translations[currentLang] || translations.ru;
            const loadingState = document.getElementById('loadingState');
            const myPostsContainer = document.getElementById('myPostsContainer');
            const emptyState = document.getElementById('emptyState');

            loadingState.classList.remove('hidden');
            myPostsContainer.classList.add('hidden');
            emptyState.classList.add('hidden');

            const token = currentUser ? currentUser.username : 'Guest';

            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .or(`username.eq.${token},user_token.eq.${token}`)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                loadingState.classList.add('hidden');

                if (!data || data.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                myPostsContainer.classList.remove('hidden');
                myPostsContainer.innerHTML = data.map(post => {
                    const cleanImages = (post.images || []).filter(i => i && typeof i === 'string' && !i.includes('images.unsplash.com/photo-1555041469') && !i.startsWith('data:image/svg+xml'));
                    const imgUrl = cleanImages.length > 0 ? cleanImages[0] : ((post.image_url && !post.image_url.includes('images.unsplash.com/photo-1555041469') && !post.image_url.startsWith('data:image/svg+xml')) ? post.image_url : '');
                    
                    let priceStr = t.free;
                    if (post.price_negotiable) priceStr = t.negotiable;
                    else if (post.price !== null && post.price !== undefined && post.price !== '') {
                        const num = Number(post.price);
                        priceStr = num === 0 ? t.free : num.toLocaleString('ru-RU') + ' €';
                    }

                    const cityStr = t.cities[post.location] || post.location || '';

                    return `
                        <div class="bg-white rounded-2xl p-4 border border-gray-200/80 shadow-xs flex items-center justify-between gap-4">
                            <div class="flex items-center gap-3.5 min-w-0">
                                <a href="post.html?id=${post.id}" class="w-16 h-16 rounded-xl bg-gray-100 overflow-hidden shrink-0 border border-gray-100 flex items-center justify-center">
                                    ${imgUrl ? `<img src="${imgUrl}" class="w-full h-full object-cover">` : `<div class="text-[#009cf0]"><i data-lucide="camera" class="w-5 h-5"></i></div>`}
                                </a>
                                <div class="min-w-0">
                                    <a href="post.html?id=${post.id}" class="font-bold text-sm text-gray-950 truncate block hover:text-[#009cf0] transition-colors">${post.title}</a>
                                    <p class="text-xs font-bold text-[#009cf0] mt-0.5">${priceStr}</p>
                                    <p class="text-[11px] text-gray-400 mt-0.5 truncate">${cityStr}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <button onclick="deletePost('${post.id}')" class="bg-gray-100 hover:bg-rose-50 text-gray-500 hover:text-rose-600 p-2.5 rounded-xl transition-colors cursor-pointer" title="${t.btnDelete}">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                lucide.createIcons();

            } catch (err) {
                console.error(err);
                loadingState.innerHTML = `<div class="text-rose-500">Ошибка загрузки объявлений</div>`;
            }
        }

        async function deletePost(postId) {
            const t = translations[currentLang] || translations.ru;
            try {
                const { error } = await supabaseClient.from('posts').delete().eq('id', postId);
                if (error) throw error;
                showToast(t.toastDeleted);
                loadUserPosts();
            } catch (err) {
                console.error(err);
                showToast(t.toastError);
            }
        }

        // Инициализация
        updateLocalization();
        loadUserPosts();
    </script>
</body>
</html>
