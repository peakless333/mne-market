<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — MNE Market</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-bold text-lg tracking-tight text-gray-950">
                <span class="text-xl">🇲🇪</span> MNE<span class="text-blue-600">Market</span>
            </a>
            <a href="index.html" class="text-xs font-semibold text-gray-600 hover:text-blue-600 transition-colors flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> На главную
            </a>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-6xl mx-auto px-4 pt-6 space-y-6">
        <h1 class="text-xl font-extrabold text-gray-950">Мои объявления</h1>
        
        <div id="myPostsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-16 text-gray-400 text-sm">Загрузка...</div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const citiesMap = {
            budva: "Будва", bar: "Бар", tivat: "Тиват", podgorica: "Подгорица", kotor: "Котор", herceg_novi: "Херцег-Нови"
        };

        let userToken = localStorage.getItem('mne_user_token');

        async function fetchMyPosts() {
            const container = document.getElementById('myPostsContainer');
            if (!userToken) {
                container.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400 text-sm">У вас пока нет объявлений</div>`;
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .eq('user_token', userToken)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                if (!data || !data.length) {
                    container.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400 text-sm">Вы еще ничего не разместили</div>`;
                    return;
                }

                container.innerHTML = data.map(post => {
                    const imageUrl = post.image_url || (post.images && post.images[0]) || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500';
                    const cityName = citiesMap[post.city] || post.city;

                    return `
                        <div onclick="window.location.href='view.html?id=${post.id}'" class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col cursor-pointer hover:shadow-md transition-all relative group">
                            <div class="h-48 bg-gray-100 relative overflow-hidden">
                                <img src="${imageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${post.title}">
                                <button onclick="event.stopPropagation(); deletePost('${post.id}')" class="absolute top-2 right-2 bg-white/90 hover:bg-red-600 hover:text-white text-red-500 p-1.5 rounded-full shadow-md transition-all">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                            <div class="p-4 flex flex-col flex-1 justify-between space-y-3">
                                <div>
                                    <div class="text-base font-extrabold text-gray-950">${post.price} €</div>
                                    <div class="text-xs font-medium text-gray-700 line-clamp-1 mt-1">${post.title}</div>
                                </div>
                                <div class="flex items-center gap-1 text-gray-400 text-xs">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0"></i>
                                    <span class="line-clamp-1">${cityName}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                lucide.createIcons();
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400 text-sm">Ошибка загрузки</div>`;
            }
        }

        async function deletePost(id) {
            if (!confirm('Удалить это объявление?')) return;
            try {
                const { error } = await supabaseClient.from('posts').delete().eq('id', id);
                if (error) throw error;
                fetchMyPosts();
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        fetchMyPosts();
    </script>
</body>
</html>
