<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Доска объявлений Черногория</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🇲🇪</span>
                <span class="font-bold text-lg tracking-tight text-gray-900">MNE Market</span>
            </div>
            
            <div class="flex items-center gap-2">
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-2.5 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="ru">🇷🇺 RU</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="cnr">🇲🇪 CNR</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-2xl mx-auto px-4 pt-4 space-y-6">
        
        <!-- Фильтры поиска и категории -->
        <div class="space-y-3">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5"></i>
                <input type="text" id="searchInput" oninput="filterPosts()" placeholder="Поиск товаров..." class="w-full bg-white border border-gray-200 rounded-2xl pl-10 pr-4 py-3 text-sm outline-none focus:border-blue-500 transition-all shadow-sm">
            </div>

            <!-- Города -->
            <select id="cityFilter" onchange="filterPosts()" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer shadow-sm">
                <!-- Заполняется динамически -->
            </select>

            <!-- Категории (чипсы) -->
            <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="categoriesContainer">
                <button onclick="setCategory('all')" class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white shrink-0 transition-all cursor-pointer" data-cat="all" data-i18n="cat_all">Все</button>
                <button onclick="setCategory('furniture')" class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 shrink-0 transition-all cursor-pointer" data-cat="furniture" data-i18n="cat_furniture">Мебель</button>
                <button onclick="setCategory('tech')" class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 shrink-0 transition-all cursor-pointer" data-cat="tech" data-i18n="cat_tech">Техника</button>
                <button onclick="setCategory('auto')" class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 shrink-0 transition-all cursor-pointer" data-cat="auto" data-i18n="cat_auto">Авто</button>
                <button onclick="setCategory('clothes')" class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 shrink-0 transition-all cursor-pointer" data-cat="clothes" data-i18n="cat_clothes">Одежда</button>
                <button onclick="setCategory('other')" class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 shrink-0 transition-all cursor-pointer" data-cat="other" data-i18n="cat_other">Разное</button>
            </div>
        </div>

        <!-- Секция товаров -->
        <div>
            <h2 class="text-base font-bold text-gray-900 mb-3" data-i18n="recommendations">Рекомендации для вас</h2>
            <div id="postsContainer" class="grid grid-cols-2 gap-3">
                <!-- Карточки загружаются динамически -->
            </div>
        </div>
    </main>

    <!-- Нижняя навигация -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2.5 z-30">
        <div class="max-w-2xl mx-auto px-6 flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center text-blue-600 gap-1">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium" data-i18n="nav_home">Главная</span>
            </a>
            <a href="create.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition-colors gap-1">
                <i data-lucide="plus-circle" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium" data-i18n="nav_create">Создать</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition-colors gap-1">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium" data-i18n="nav_profile">Профиль</span>
            </a>
        </div>
    </nav>

    <script>
        lucide.createIcons();

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dict = {
            ru: {
                recommendations: "Рекомендации для вас",
                search_ph: "Поиск товаров...",
                nav_home: "Главная", nav_create: "Создать", nav_profile: "Профиль",
                cat_all: "Все", cat_furniture: "Мебель", cat_tech: "Техника", cat_auto: "Авто", cat_clothes: "Одежда", cat_other: "Разное",
                all_cities: "Все города",
                cities: { budva: "Будва", bar: "Бар", tivat: "Тиват", podgorica: "Подгорица", kotor: "Котор", herceg_novi: "Херцег-Нови" }
            },
            en: {
                recommendations: "Recommended for you",
                search_ph: "Search items...",
                nav_home: "Home", nav_create: "Create", nav_profile: "Profile",
                cat_all: "All", cat_furniture: "Furniture", cat_tech: "Electronics", cat_auto: "Vehicles", cat_clothes: "Clothing", cat_other: "Other",
                all_cities: "All cities",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotori: "Kotor", herceg_novi: "Herceg Novi" }
            },
            cnr: {
                recommendations: "Preporuke za vas",
                search_ph: "Pretraži oglase...",
                nav_home: "Početna", nav_create: "Kreiraj", nav_profile: "Profil",
                cat_all: "Sve", cat_furniture: "Namještaj", cat_tech: "Tehnika", cat_auto: "Auto", cat_clothes: "Odjeća", cat_other: "Razno",
                all_cities: "Svi gradovi",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let activeCategory = 'all';
        let allPosts = [];
        let userToken = localStorage.getItem('mne_user_token');

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            document.getElementById('searchInput').placeholder = dict[lang].search_ph;

            // Обновляем список городов в селекте с сохранением выбранного значения
            const citySelect = document.getElementById('cityFilter');
            const currentCityValue = citySelect.value || 'all';
            const citiesObj = dict[lang].cities;
            
            let html = `<option value="all">${dict[lang].all_cities}</option>`;
            for (const [code, name] of Object.entries(citiesObj)) {
                html += `<option value="${code}" ${code === currentCityValue ? 'selected' : ''}>${name}</option>`;
            }
            citySelect.innerHTML = html;

            renderPosts(allPosts);
        }

        document.getElementById('langSelect').value = currentLang;
        changeLanguage(currentLang);

        async function fetchPosts() {
            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allPosts = data || [];
                filterPosts();
            } catch (err) {
                console.error(err);
                document.getElementById('postsContainer').innerHTML = `<p class="col-span-2 text-center text-xs text-gray-400 py-6">Ошибка загрузки объявлений</p>`;
            }
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white shrink-0 transition-all cursor-pointer";
                } else {
                    btn.className = "cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 shrink-0 transition-all cursor-pointer";
                }
            });
            filterPosts();
        }

        function filterPosts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedCity = document.getElementById('cityFilter').value;

            const filtered = allPosts.filter(post => {
                const matchesCategory = activeCategory === 'all' || post.category === activeCategory;
                const matchesSearch = !query || (post.title && post.title.toLowerCase().includes(query)) || (post.description && post.description.toLowerCase().includes(query));
                const matchesCity = selectedCity === 'all' || post.city === selectedCity;
                return matchesCategory && matchesSearch && matchesCity;
            });

            renderPosts(filtered);
        }

        function getCityTitle(cityCode) {
            if (!cityCode) return "";
            const cities = dict[currentLang].cities;
            return cities[cityCode.toLowerCase()] || cityCode;
        }

        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            if (!posts.length) {
                container.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400 text-xs">Объявлений пока нет</div>`;
                return;
            }

            container.innerHTML = posts.map(post => {
                const imageUrl = post.image_url || (post.images && post.images[0]) || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500';
                const cityName = getCityTitle(post.city);
                const isMyPost = userToken && post.user_token === userToken;

                return `
                    <div onclick="window.location.href='view.html?id=${post.id}'" class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col cursor-pointer hover:shadow-md transition-all relative group">
                        <div class="h-40 bg-gray-100 relative overflow-hidden">
                            <img src="${imageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${post.title}">
                            <div class="absolute top-2 left-2 flex gap-1">
                                <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-md shadow-sm">NEW</span>
                            </div>
                            ${isMyPost ? `
                                <button onclick="event.stopPropagation(); deletePost('${post.id}')" class="absolute top-2 right-2 bg-white/90 hover:bg-red-600 hover:text-white text-red-500 p-1.5 rounded-full shadow-md transition-all">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            ` : ''}
                        </div>
                        <div class="p-3 flex flex-col flex-1 justify-between space-y-2">
                            <div>
                                <div class="text-base font-extrabold text-gray-900">${post.price} €</div>
                                <div class="text-xs font-medium text-gray-700 line-clamp-1 mt-0.5">${post.title}</div>
                            </div>
                            ${cityName ? `
                                <div class="flex items-center gap-1 text-gray-400 text-[11px]">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                                    <span>${cityName}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function deletePost(id) {
            if (!confirm('Удалить это объявление?')) return;
            try {
                const { error } = await supabaseClient.from('posts').delete().eq('id', id);
                if (error) throw error;
                allPosts = allPosts.filter(p => p.id != id);
                filterPosts();
            } catch (err) {
                alert('Ошибка при удалении: ' + err.message);
            }
        }

        fetchPosts();
    </script>
</body>
</html>
