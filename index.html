<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная страница</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Логотип</a>
      <div class="search-bar">
        <input type="text" placeholder="Поиск по объявлениям...">
      </div>
      <div class="header-right">
        <select class="lang-switcher">
          <option value="ru">RU</option>
          <option value="en">EN</option>
        </select>
        <a href="create.html" class="btn-create">+ Разместить</a>
      </div>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title">Категории</h2>
    <div class="categories-grid">
      <a href="#" class="category-card">
        <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400" alt="Мебель">
        <h3>Мебель</h3>
      </a>
      <a href="#" class="category-card">
        <img src="https://images.unsplash.com/photo-1526738549149-8e07eca6c147?w=400" alt="Электроника">
        <h3>Электроника</h3>
      </a>
    </div>

    <h2 class="section-title">Свежие объявления</h2>
    <div class="products-grid">
      <a href="post.html" class="product-card">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="Товар">
        <div>
          <h3>Беспроводные наушники</h3>
          <p style="color: #0066ff; font-weight: 700; margin-top: 8px;">$50</p>
        </div>
      </a>
    </div>
  </main>

</body>
</html>
