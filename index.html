<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Доска объявлений в Черногории</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f5f6f8] text-gray-900 pb-28 selection:bg-[#009cf0] selection:text-white antialiased">

    <!-- Тост-уведомление -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none flex items-center gap-2">
        Ссылка скопирована в буфер обмена!
    </div>

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200/80 sticky top-0 z-30 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <a href="index.html" class="flex items-center gap-2 font-black text-base sm:text-lg tracking-tight text-gray-950">
                <span class="bg-[#009cf0] text-white p-1.5 rounded-xl shadow-xs text-xs">🇲🇪</span> MNE Market
            </a>
            
            <div class="flex items-center gap-2">
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-3 py-2 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                    <option value="cnr">CNR</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Поиск и фильтры городов -->
    <div class="bg-white border-b border-gray-200/85 pb-4 pt-4 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 space-y-3">
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="searchInput" oninput="filterPosts()" placeholder="Поиск по объявлениям..." class="w-full bg-gray-50 border border-gray-200/85 rounded-xl pl-10 pr-4 py-3 text-xs sm:text-sm outline-none focus:border-[#009cf0] focus:bg-white transition-all text-gray-900 placeholder:text-gray-400">
                </div>
                <button onclick="filterPosts()" class="bg-[#009cf0] hover:bg-[#0089d1] active:scale-95 text-white px-5 rounded-xl font-medium text-xs sm:text-sm transition-all shadow-sm shadow-blue-500/20 cursor-pointer flex items-center gap-1.5 shrink-0">
                    <span data-i18n="searchBtn">Найти</span>
                </button>
            </div>

            <!-- Города -->
            <div id="citiesContainer" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-1">
                <!-- Заполняется динамически -->
            </div>
        </div>
    </div>

    <!-- Категории -->
    <div class="max-w-6xl mx-auto px-4 pt-5 pb-2">
        <div id="categoriesContainer" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2">
            <!-- Заполняется динамически -->
        </div>
    </div>

    <!-- Основная лента -->
    <main class="max-w-6xl mx-auto px-4 pt-2 space-y-8">
        <div>
            <div class="flex items-center justify-between mb-4">
                <h2 id="feedTitle" class="text-base sm:text-lg font-extrabold text-gray-950 tracking-tight" data-i18n="feedTitle">Все объявления</h2>
                <span id="postsCount" class="text-xs font-bold text-gray-400 bg-gray-200/70 px-2.5 py-1 rounded-lg">0</span>
            </div>

            <!-- Скелетоны при загрузке -->
            <div id="skeletonsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div class="bg-white rounded-2xl p-3 border border-gray-200/80 space-y-3 animate-pulse">
                    <div class="w-full h-44 bg-gray-200 rounded-xl"></div>
                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                </div>
                <div class="bg-white rounded-2xl p-3 border border-gray-200/80 space-y-3 animate-pulse hidden sm:block">
                    <div class="w-full h-44 bg-gray-200 rounded-xl"></div>
                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                </div>
                <div class="bg-white rounded-2xl p-3 border border-gray-200/80 space-y-3 animate-pulse hidden md:block">
                    <div class="w-full h-44 bg-gray-200 rounded-xl"></div>
                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                </div>
                <div class="bg-white rounded-2xl p-3 border border-gray-200/80 space-y-3 animate-pulse hidden lg:block">
                    <div class="w-full h-44 bg-gray-200 rounded-xl"></div>
                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                </div>
            </div>

            <!-- Сетка объявлений -->
            <div id="postsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 animate-fade-in"></div>
        </div>

        <!-- Блок: Вы недавно смотрели (История) -->
        <section id="recentSection" class="hidden pt-4 border-t border-gray-200/80">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-extrabold text-gray-950 tracking-tight" data-i18n="recentTitle">Вы недавно смотрели</h3>
                <button onclick="clearHistory()" class="text-xs font-semibold text-gray-400 hover:text-rose-600 transition-colors" data-i18n="clearHistory">Очистить историю</button>
            </div>
            <div id="recentGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </section>
    </main>

    <!-- Нижняя навигация -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-gray-200/80 py-2.5 px-6 z-40 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-around">
            <a href="index.html" class="flex flex-col items-center gap-1 text-[#009cf0]">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold" data-i18n="nav_home">Главная</span>
            </a>
            <a href="create.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-[#009cf0] transition-colors">
                <i data-lucide="plus-circle" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium" data-i18n="nav_add">Подать</span>
            </a>
            <a href="favorites.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-[#009cf0] transition-colors">
                <i data-lucide="heart" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium" data-i18n="nav_fav">Избранное</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-[#009cf0] transition-colors">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium" data-i18n="nav_profile">Профиль</span>
            </a>
        </div>
    </nav>

    <script>
        lucide.createIcons();

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dict = {
            ru: {
                searchBtn: "Найти", feedTitle: "Все объявления", recentTitle: "Вы недавно смотрели", clearHistory: "Очистить историю",
                nav_home: "Главная", nav_add: "Подать", nav_fav: "Избранное", nav_profile: "Профиль",
                allCities: "Все города", allCats: "Все категории", free: "Бесплатно", noPosts: "Объявления не найдены",
                urgently: "Срочно", bargaining: "Торг",
                cities: { all: "Все города", budva: "Будва", bar: "Бар", tivat: "Тиват", podgorica: "Подгорица", kotor: "Котор", herceg_novi: "Херцег-Нови" },
                categories: { all: "Все категории", auto: "Авто", realestate: "Недвижимость", furniture: "Мебель", tech: "Электроника", clothes: "Одежда", other: "Разное" }
            },
            en: {
                searchBtn: "Search", feedTitle: "All listings", recentTitle: "Recently viewed", clearHistory: "Clear history",
                nav_home: "Home", nav_add: "Post", nav_fav: "Favorites", nav_profile: "Profile",
                allCities: "All cities", allCats: "All categories", free: "Free", noPosts: "No listings found",
                urgently: "Urgent", bargaining: "Negotiable",
                cities: { all: "All cities", budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" },
                categories: { all: "All categories", auto: "Vehicles", realestate: "Real estate", furniture: "Furniture", tech: "Electronics", clothes: "Clothing", other: "Other" }
            },
            cnr: {
                searchBtn: "Traži", feedTitle: "Svi oglasi", recentTitle: "Nedavno pregledano", clearHistory: "Obriši istoriju",
                nav_home: "Početna", nav_add: "Objavi", nav_fav: "Omiljeno", nav_profile: "Profil",
                allCities: "Svi gradovi", allCats: "Sve kategorije", free: "Besplatno", noPosts: "Nema oglasa",
                urgently: "Hitno", bargaining: "Dogovor",
                cities: { all: "Svi gradovi", budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" },
                categories: { all: "Sve kategorije", auto: "Auto", realestate: "Nekretnine", furniture: "Namještaj", tech: "Tehnika", clothes: "Odjeća", other: "Razno" }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let currentCity = 'all';
        let currentCategory = 'all';
        let allPosts = [];
        let favorites = JSON.parse(localStorage.getItem('mne_favorites') || '[]');
        let viewedHistory = JSON.parse(localStorage.getItem('mne_viewed') || '[]');
        
        // Хранилище текущего индекса слайдера для карточек в ленте: { postId: imageIndex }
        let cardImageIndices = {};

        async function initApp() {
            document.getElementById('langSelect').value = currentLang;
            renderFilters();

            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            document.getElementById('skeletonsGrid').classList.add('hidden');

            if (error) {
                console.error(error);
                document.getElementById('postsGrid.innerHTML').innerHTML = `<div class="col-span-full text-center text-rose-500 py-10 font-medium">Ошибка загрузки данных</div>`;
                return;
            }

            allPosts = data || [];
            filterPosts();
            renderRecentHistory();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            document.getElementById('searchInput').placeholder = lang === 'en' ? 'Search listings...' : (lang === 'cnr' ? 'Pretraži oglase...' : 'Поиск по объявлениям...');

            renderFilters();
            filterPosts();
            renderRecentHistory();
        }

        function renderFilters() {
            // Города
            const citiesContainer = document.getElementById('citiesContainer');
            const citiesObj = dict[currentLang].cities;
            citiesContainer.innerHTML = Object.keys(citiesObj).map(code => `
                <button onclick="setCity('${code}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer ${currentCity === code ? 'bg-[#009cf0] text-white shadow-sm shadow-blue-500/20' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}">
                    ${citiesObj[code]}
                </button>
            `).join('');

            // Категории
            const catsContainer = document.getElementById('categoriesContainer');
            const catsObj = dict[currentLang].categories;
            catsContainer.innerHTML = Object.keys(catsObj).map(code => `
                <button onclick="setCategory('${code}')" class="px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer ${currentCategory === code ? 'bg-gray-900 text-white shadow-sm' : 'bg-white hover:bg-gray-100 text-gray-700 border border-gray-200/80'}">
                    ${catsObj[code]}
                </button>
            `).join('');
        }

        function setCity(cityCode) {
            currentCity = cityCode;
            renderFilters();
            filterPosts();
        }

        function setCategory(catCode) {
            currentCategory = catCode;
            renderFilters();
            filterPosts();
        }

        function filterPosts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = allPosts.filter(post => {
                const matchesCity = currentCity === 'all' || post.city === currentCity;
                const matchesCat = currentCategory === 'all' || post.category === currentCategory;
                const matchesSearch = !query || post.title.toLowerCase().includes(query) || (post.description && post.description.toLowerCase().includes(query));
                return matchesCity && matchesCat && matchesSearch;
            });

            renderPostsGrid(filtered);
        }

        function renderPostsGrid(posts) {
            const grid = document.getElementById('postsGrid');
            document.getElementById('postsCount').innerText = posts.length;

            if (posts.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-16 text-sm font-medium">${dict[currentLang].noPosts}</div>`;
                return;
            }

            grid.innerHTML = posts.map(post => {
                const isFav = favorites.includes(String(post.id));
                const images = (post.images && post.images.length > 0) ? post.images : (post.image_url ? [post.image_url] : ['https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500']);
                
                if (cardImageIndices[post.id] === undefined) {
                    cardImageIndices[post.id] = 0;
                }
                const activeImgIdx = cardImageIndices[post.id];
                const currentImgUrl = images[activeImgIdx];

                const priceText = Number(post.price) === 0 ? dict[currentLang].free : Number(post.price).toLocaleString('ru-RU') + ' €';
                const cityText = dict[currentLang].cities[post.city] || post.city;

                // Быстрая связь (WhatsApp, Viber, Telegram)
                let contactButtonsHtml = '';
                const cleanTg = (post.telegram || post.contact || '').replace('@', '');
                if (cleanTg) {
                    contactButtonsHtml += `<a href="https://t.me/${cleanTg}" target="_blank" onclick="event.stopPropagation()" class="bg-blue-50 hover:bg-blue-100 text-[#009cf0] p-2 rounded-xl transition-colors cursor-pointer" title="Telegram"><i data-lucide="send" class="w-3.5 h-3.5"></i></a>`;
                }
                if (post.whatsapp) {
                    contactButtonsHtml += `<a href="https://wa.me/${post.whatsapp}" target="_blank" onclick="event.stopPropagation()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-600 p-2 rounded-xl transition-colors cursor-pointer" title="WhatsApp"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i></a>`;
                }
                if (post.viber) {
                    contactButtonsHtml += `<a href="viber://chat?number=${post.viber}" target="_blank" onclick="event.stopPropagation()" class="bg-purple-50 hover:bg-purple-100 text-purple-600 p-2 rounded-xl transition-colors cursor-pointer" title="Viber"><i data-lucide="phone-call" class="w-3.5 h-3.5"></i></a>`;
                }

                // Бэджики (Срочно / Торг)
                let badgesHtml = '';
                if (post.is_urgent) {
                    badgesHtml += `<span class="bg-rose-500 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-md shadow-xs">${dict[currentLang].urgently}</span>`;
                }
                if (post.is_bargain) {
                    badgesHtml += `<span class="bg-amber-500 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-md shadow-xs">${dict[currentLang].bargaining}</span>`;
                }

                return `
                    <div onclick="openPost('${post.id}')" class="bg-white rounded-2xl p-3 border border-gray-200/85 hover:border-gray-300 shadow-xs hover:shadow-md transition-all duration-200 flex flex-col justify-between group cursor-pointer relative">
                        <div>
                            <!-- Слайдер изображений в ленте -->
                            <div class="relative h-44 rounded-xl overflow-hidden bg-gray-100 mb-3">
                                <img src="${currentImgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="Post">
                                
                                <!-- Кнопка Избранного -->
                                <button onclick="toggleFavorite(event, '${post.id}')" class="absolute top-2.5 right-2.5 bg-white/90 hover:bg-white p-2 rounded-full text-gray-700 shadow-sm transition-all z-10">
                                    <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-rose-500 text-rose-500' : ''}"></i>
                                </button>

                                <!-- Бэджики -->
                                <div class="absolute top-2.5 left-2.5 flex flex-col gap-1 z-10">
                                    ${badgesHtml}
                                </div>

                                <!-- Стрелки слайдера, если фото больше 1 -->
                                ${images.length > 1 ? `
                                    <button onclick="prevCardImage(event, '${post.id}', ${images.length})" class="absolute left-1.5 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-1 rounded-full transition-all z-10">
                                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="nextCardImage(event, '${post.id}', ${images.length})" class="absolute right-1.5 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-1 rounded-full transition-all z-10">
                                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                    </button>
                                    
                                    <!-- Точки пагинации -->
                                    <div class="absolute bottom-2 left-1/2 -translate-x-1/2 flex items-center gap-1 z-10">
                                        ${images.map((_, i) => `<span class="w-1.5 h-1.5 rounded-full ${i === activeImgIdx ? 'bg-white scale-125' : 'bg-white/50'}"></span>`).join('')}
                                    </div>
                                ` : ''}
                            </div>

                            <h3 class="font-bold text-xs sm:text-sm text-gray-950 line-clamp-2 group-hover:text-[#009cf0] transition-colors">${post.title}</h3>
                            <p class="text-xs font-semibold text-gray-950 mt-1">${priceText}</p>
                        </div>

                        <div class="pt-3 mt-3 border-t border-gray-100 flex items-center justify-between">
                            <span class="text-[11px] text-gray-400 font-medium flex items-center gap-1">
                                <i data-lucide="map-pin" class="w-3 h-3"></i> ${cityText}
                            </span>
                            <div class="flex items-center gap-1">
                                ${contactButtonsHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function nextCardImage(e, postId, total) {
            e.stopPropagation();
            if (cardImageIndices[postId] === undefined) cardImageIndices[postId] = 0;
            cardImageIndices[postId] = (cardImageIndices[postId] + 1) % total;
            filterPosts();
        }

        function prevCardImage(e, postId, total) {
            e.stopPropagation();
            if (cardImageIndices[postId] === undefined) cardImageIndices[postId] = 0;
            cardImageIndices[postId] = (cardImageIndices[postId] - 1 + total) % total;
            filterPosts();
        }

        function openPost(id) {
            // Добавляем в историю просмотров
            if (!viewedHistory.includes(id)) {
                viewedHistory.unshift(id);
                if (viewedHistory.length > 8) viewedHistory.pop(); // храним до 8 штук
                localStorage.setItem('mne_viewed', JSON.stringify(viewedHistory));
            }
            window.location.href = `post.html?id=${id}`;
        }

        function toggleFavorite(e, id) {
            e.stopPropagation();
            const stringId = String(id);
            if (favorites.includes(stringId)) {
                favorites = favorites.filter(fav => fav !== stringId);
            } else {
                favorites.push(stringId);
            }
            favorites = [...new Set(favorites)];
            localStorage.setItem('mne_favorites', JSON.stringify(favorites));
            filterPosts();
            renderRecentHistory();
        }

        function renderRecentHistory() {
            const section = document.getElementById('recentSection');
            const grid = document.getElementById('recentGrid');
            
            if (viewedHistory.length === 0 || allPosts.length === 0) {
                section.classList.add('hidden');
                return;
            }

            const recentPosts = viewedHistory.map(id => allPosts.find(p => String(p.id) === String(id))).filter(Boolean);

            if (recentPosts.length === 0) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            grid.innerHTML = recentPosts.map(post => {
                const isFav = favorites.includes(String(post.id));
                const imgUrl = (post.images && post.images.length > 0) ? post.images[0] : (post.image_url || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
                const priceText = Number(post.price) === 0 ? dict[currentLang].free : Number(post.price).toLocaleString('ru-RU') + ' €';
                const cityText = dict[currentLang].cities[post.city] || post.city;

                return `
                    <div onclick="openPost('${post.id}')" class="bg-white rounded-2xl p-3 border border-gray-200/85 hover:border-gray-300 shadow-xs hover:shadow-md transition-all flex flex-col justify-between group cursor-pointer relative">
                        <div>
                            <div class="relative h-40 rounded-xl overflow-hidden bg-gray-100 mb-3">
                                <img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="Recent">
                                <button onclick="toggleFavorite(event, '${post.id}')" class="absolute top-2.5 right-2.5 bg-white/90 hover:bg-white p-2 rounded-full text-gray-700 shadow-sm transition-all z-10">
                                    <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-rose-500 text-rose-500' : ''}"></i>
                                </button>
                            </div>
                            <h3 class="font-bold text-xs sm:text-sm text-gray-950 line-clamp-2 group-hover:text-[#009cf0] transition-colors">${post.title}</h3>
                            <p class="text-xs font-semibold text-gray-950 mt-1">${priceText}</p>
                        </div>
                        <div class="pt-2 mt-2 border-t border-gray-100 flex items-center justify-between text-[11px] text-gray-400">
                            <span><i data-lucide="map-pin" class="w-3 h-3 inline"></i> ${cityText}</span>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function clearHistory() {
            viewedHistory = [];
            localStorage.removeItem('mne_viewed');
            document.getElementById('recentSection').classList.add('hidden');
        }

        initApp();
    </script>
</body>
</html>
