<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Доска объявлений Черногория</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- Шапка -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-2 font-bold text-lg tracking-tight text-gray-950 shrink-0">
                <span class="text-xl">🇲🇪</span> MNE<span class="text-blue-600">Market</span>
            </a>
            
            <div class="flex-1 max-w-xl relative flex items-center">
                <input type="text" id="searchInput" oninput="filterPosts()" placeholder="Поиск товаров..." class="w-full bg-gray-100 border border-transparent rounded-xl pl-4 pr-10 py-2 text-sm outline-none focus:bg-white focus:border-blue-500 transition-all">
                <button onclick="filterPosts()" class="absolute right-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-xs font-medium transition-all cursor-pointer" data-i18n="search_btn">Найти</button>
            </div>

            <div class="flex items-center gap-3 shrink-0">
                <a href="profile.html" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-700 transition-all relative">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span id="profileBadge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">1</span>
                </a>
                
                <a href="favorites.html" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-700 transition-all">
                    <i data-lucide="heart" class="w-4 h-4"></i>
                </a>

                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-2.5 py-2 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                    <option value="cnr">CNR</option>
                </select>

                <a href="create.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> <span data-i18n="create_btn">Разместить</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-6xl mx-auto px-4 pt-6 space-y-6">
        
        <!-- Плитки категорий -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
            <div onclick="setCategory('auto')" class="cat-card bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:border-blue-500 cursor-pointer transition-all flex flex-col justify-between h-28 group" data-cat="auto">
                <span class="text-xs font-bold text-gray-800" data-i18n="cat_auto">Авто</span>
                <span class="text-2xl self-end group-hover:scale-110 transition-transform">🚗</span>
            </div>
            <div onclick="setCategory('realestate')" class="cat-card bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:border-blue-500 cursor-pointer transition-all flex flex-col justify-between h-28 group" data-cat="realestate">
                <span class="text-xs font-bold text-gray-800" data-i18n="cat_realestate">Недвижимость</span>
                <span class="text-2xl self-end group-hover:scale-110 transition-transform">🏢</span>
            </div>
            <div onclick="setCategory('furniture')" class="cat-card bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:border-blue-500 cursor-pointer transition-all flex flex-col justify-between h-28 group" data-cat="furniture">
                <span class="text-xs font-bold text-gray-800" data-i18n="cat_furniture">Мебель</span>
                <span class="text-2xl self-end group-hover:scale-110 transition-transform">🛋️</span>
            </div>
            <div onclick="setCategory('tech')" class="cat-card bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:border-blue-500 cursor-pointer transition-all flex flex-col justify-between h-28 group" data-cat="tech">
                <span class="text-xs font-bold text-gray-800" data-i18n="cat_tech">Электроника</span>
                <span class="text-2xl self-end group-hover:scale-110 transition-transform">📱</span>
            </div>
            <div onclick="setCategory('clothes')" class="cat-card bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:border-blue-500 cursor-pointer transition-all flex flex-col justify-between h-28 group" data-cat="clothes">
                <span class="text-xs font-bold text-gray-800" data-i18n="cat_clothes">Одежда</span>
                <span class="text-2xl self-end group-hover:scale-110 transition-transform">👕</span>
            </div>
            <div onclick="setCategory('other')" class="cat-card bg-white p-4 rounded-2xl border border-gray-200 shadow-sm hover:border-blue-500 cursor-pointer transition-all flex flex-col justify-between h-28 group" data-cat="other">
                <span class="text-xs font-bold text-gray-800" data-i18n="cat_other">Разное</span>
                <span class="text-2xl self-end group-hover:scale-110 transition-transform">📦</span>
            </div>
        </div>

        <!-- Фильтры городов и сортировка -->
        <div class="bg-white p-3 rounded-2xl border border-gray-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-1 overflow-x-auto pb-1 md:pb-0" id="cityButtonsContainer">
                <button onclick="setCity('all')" class="city-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-gray-900 text-white shrink-0 transition-all cursor-pointer" data-city="all" data-i18n="all_cities">Все города</button>
                <button onclick="setCity('budva')" class="city-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 shrink-0 transition-all cursor-pointer" data-city="budva" data-i18n="city_budva">Будва</button>
                <button onclick="setCity('bar')" class="city-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 shrink-0 transition-all cursor-pointer" data-city="bar" data-i18n="city_bar">Бар</button>
                <button onclick="setCity('tivat')" class="city-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 shrink-0 transition-all cursor-pointer" data-city="tivat" data-i18n="city_tivat">Тиват</button>
                <button onclick="setCity('podgorica')" class="city-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 shrink-0 transition-all cursor-pointer" data-city="podgorica" data-i18n="city_podgorica">Подгорица</button>
                <button onclick="setCity('kotor')" class="city-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 shrink-0 transition-all cursor-pointer" data-city="kotor" data-i18n="city_kotor">Котор</button>
                <button onclick="setCity('herceg_novi')" class="city-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 shrink-0 transition-all cursor-pointer" data-city="herceg_novi" data-i18n="city_herceg_novi">Херцег-Нови</button>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleFreeFilter()" id="freeBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all cursor-pointer flex items-center gap-1.5">
                    <i data-lucide="gift" class="w-3.5 h-3.5"></i> <span data-i18n="free_filter">Бесплатно</span>
                </button>
                <select id="sortSelect" onchange="filterPosts()" class="bg-gray-100 border-none rounded-xl px-3 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="new" data-i18n="sort_new">Сначала новые</option>
                    <option value="cheap" data-i18n="sort_cheap">Сначала дешевле</option>
                    <option value="expensive" data-i18n="sort_expensive">Сначала дороже</option>
                </select>
            </div>
        </div>

        <!-- Секция товаров -->
        <div class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-gray-900" data-i18n="recommendations">Рекомендации для вас</h2>
                <span id="resultsCount" class="text-xs font-medium text-gray-400">Найдено: 0</span>
            </div>

            <div id="postsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Карточки загружаются динамически -->
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dict = {
            ru: {
                search_btn: "Найти", create_btn: "Разместить", search_ph: "Поиск товаров...",
                recommendations: "Рекомендации для вас",
                cat_auto: "Авто", cat_realestate: "Недвижимость", cat_furniture: "Мебель", cat_tech: "Электроника", cat_clothes: "Одежда", cat_other: "Разное",
                all_cities: "Все города", city_budva: "Будва", city_bar: "Бар", city_tivat: "Тиват", city_podgorica: "Подгорица", city_kotor: "Котор", city_herceg_novi: "Херцег-Нови",
                free_filter: "Бесплатно", sort_new: "Сначала новые", sort_cheap: "Сначала дешевле", sort_expensive: "Сначала дороже",
                found: "Найдено: ", no_posts: "Объявлений пока нет", delete_confirm: "Удалить это объявление?",
                cities: { budva: "Будва", bar: "Бар", tivat: "Тиват", podgorica: "Подгорица", kotor: "Котор", herceg_novi: "Херцег-Нови" }
            },
            en: {
                search_btn: "Search", create_btn: "Post ad", search_ph: "Search items...",
                recommendations: "Recommended for you",
                cat_auto: "Vehicles", cat_realestate: "Real Estate", cat_furniture: "Furniture", cat_tech: "Electronics", cat_clothes: "Clothing", cat_other: "Other",
                all_cities: "All cities", city_budva: "Budva", city_bar: "Bar", city_tivat: "Tivat", city_podgorica: "Podgorica", city_kotor: "Kotor", city_herceg_novi: "Herceg Novi",
                free_filter: "Free", sort_new: "Newest first", sort_cheap: "Cheapest first", sort_expensive: "Most expensive first",
                found: "Found: ", no_posts: "No listings found", delete_confirm: "Delete this listing?",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" }
            },
            cnr: {
                search_btn: "Traži", create_btn: "Objavi", search_ph: "Pretraži oglase...",
                recommendations: "Preporuke za vas",
                cat_auto: "Auto", cat_realestate: "Nekretnine", cat_furniture: "Namještaj", cat_tech: "Tehnika", cat_clothes: "Odjeća", cat_other: "Razno",
                all_cities: "Svi gradovi", city_budva: "Budva", city_bar: "Bar", city_tivat: "Tivat", city_podgorica: "Podgorica", city_kotor: "Kotor", city_herceg_novi: "Herceg Novi",
                free_filter: "Besplatno", sort_new: "Najnovije", sort_cheap: "Najjeftinije", sort_expensive: "Najskuplje",
                found: "Pronađeno: ", no_posts: "Nema oglasa", delete_confirm: "Obriši ovaj oglas?",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let activeCategory = 'all';
        let activeCity = 'all';
        let onlyFree = false;
        let allPosts = [];
        let userToken = localStorage.getItem('mne_user_token');

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            document.getElementById('searchInput').placeholder = dict[lang].search_ph;
            renderPosts(allPosts);
        }

        document.getElementById('langSelect').value = currentLang;
        changeLanguage(currentLang);

        async function fetchPosts() {
            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allPosts = data || [];
                filterPosts();
            } catch (err) {
                console.error(err);
                document.getElementById('postsContainer').innerHTML = `<p class="col-span-full text-center text-xs text-gray-400 py-6">Ошибка загрузки</p>`;
            }
        }

        function setCategory(cat) {
            activeCategory = (activeCategory === cat) ? 'all' : cat;
            document.querySelectorAll('.cat-card').forEach(card => {
                if (card.getAttribute('data-cat') === activeCategory) {
                    card.classList.add('border-blue-500', 'ring-2', 'ring-blue-100');
                } else {
                    card.classList.remove('border-blue-500', 'ring-2', 'ring-blue-100');
                }
            });
            filterPosts();
        }

        function setCity(city) {
            activeCity = city;
            document.querySelectorAll('.city-btn').forEach(btn => {
                if (btn.getAttribute('data-city') === city) {
                    btn.className = "city-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-gray-900 text-white shrink-0 transition-all cursor-pointer";
                } else {
                    btn.className = "city-btn px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-100 shrink-0 transition-all cursor-pointer";
                }
            });
            filterPosts();
        }

        function toggleFreeFilter() {
            onlyFree = !onlyFree;
            const btn = document.getElementById('freeBtn');
            if (onlyFree) {
                btn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white transition-all cursor-pointer flex items-center gap-1.5 shadow-sm";
            } else {
                btn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all cursor-pointer flex items-center gap-1.5";
            }
            filterPosts();
        }

        function filterPosts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortMode = document.getElementById('sortSelect').value;

            let filtered = allPosts.filter(post => {
                const matchesCat = activeCategory === 'all' || post.category === activeCategory;
                const matchesCity = activeCity === 'all' || post.city === activeCity;
                const matchesFree = !onlyFree || Number(post.price) === 0;
                const matchesSearch = !query || (post.title && post.title.toLowerCase().includes(query)) || (post.description && post.description.toLowerCase().includes(query));
                return matchesCat && matchesCity && matchesFree && matchesSearch;
            });

            if (sortMode === 'cheap') {
                filtered.sort((a, b) => Number(a.price) - Number(b.price));
            } else if (sortMode === 'expensive') {
                filtered.sort((a, b) => Number(b.price) - Number(a.price));
            }

            document.getElementById('resultsCount').innerText = dict[currentLang].found + filtered.length;
            renderPosts(filtered);
        }

        function getCityTitle(cityCode) {
            if (!cityCode) return "";
            const cities = dict[currentLang].cities;
            return cities[cityCode.toLowerCase()] || cityCode;
        }

        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            if (!posts.length) {
                container.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400 text-sm">${dict[currentLang].no_posts}</div>`;
                return;
            }

            container.innerHTML = posts.map(post => {
                const imageUrl = post.image_url || (post.images && post.images[0]) || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500';
                const cityName = getCityTitle(post.city);
                const isMyPost = userToken && post.user_token === userToken;

                return `
                    <div onclick="window.location.href='view.html?id=${post.id}'" class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col cursor-pointer hover:shadow-md transition-all relative group">
                        <div class="h-48 bg-gray-100 relative overflow-hidden">
                            <img src="${imageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${post.title}">
                            <div class="absolute top-2 left-2 flex gap-1">
                                <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-md shadow-sm">NEW</span>
                            </div>
                            ${isMyPost ? `
                                <button onclick="event.stopPropagation(); deletePost('${post.id}')" class="absolute top-2 right-2 bg-white/90 hover:bg-red-600 hover:text-white text-red-500 p-1.5 rounded-full shadow-md transition-all">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            ` : ''}
                        </div>
                        <div class="p-4 flex flex-col flex-1 justify-between space-y-3">
                            <div>
                                <div class="text-base font-extrabold text-gray-950">${post.price} €</div>
                                <div class="text-xs font-medium text-gray-700 line-clamp-1 mt-1">${post.title}</div>
                            </div>
                            <div class="flex items-center gap-1 text-gray-400 text-xs">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0"></i>
                                <span class="line-clamp-1">${cityName || (currentLang === 'en' ? 'Montenegro' : 'Черногория')}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function deletePost(id) {
            if (!confirm(dict[currentLang].delete_confirm)) return;
            try {
                const { error } = await supabaseClient.from('posts').delete().eq('id', id);
                if (error) throw error;
                allPosts = allPosts.filter(p => p.id != id);
                filterPosts();
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        fetchPosts();
    </script>
</body>
</html>
