<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Доска объявлений Черногории</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Шапка сайта -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <span class="text-2xl">🇲🇪</span>
                <h1 class="font-bold text-xl text-gray-900 tracking-tight">MNE Market</h1>
            </a>
            
            <div class="flex items-center gap-2">
                <select id="langSelect" class="bg-gray-100 border-none rounded-xl px-2.5 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="ru">🇷🇺 RU</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="cnr">🇲🇪 CNR</option>
                </select>

                <button id="openModalBtn" class="bg-blue-600 text-white font-medium text-sm px-4 py-1.5 rounded-xl flex items-center gap-1.5 hover:bg-blue-700 shadow-sm transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i> <span data-i18n="sellBtn">Продать</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-6xl mx-auto px-4 pt-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-900" data-i18n="mainTitle">Свежие объявления</h2>
                <p class="text-xs text-gray-500" data-i18n="mainSubtitle">Покупки и продажи по всей Черногории</p>
            </div>
            
            <select id="cityFilter" class="bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none shadow-sm cursor-pointer">
                <option value="ALL" data-i18n="allCities">Все города</option>
                <option value="Будва">Будва</option>
                <option value="Бар">Бар</option>
                <option value="Тиват">Тиват</option>
                <option value="Подгорица">Подгорица</option>
                <option value="Котор">Котор</option>
                <option value="Херцег-Нови">Херцег-Нови</option>
            </select>
        </div>

        <!-- Категории -->
        <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-6 no-scrollbar" id="categoryTabs">
            <button data-cat="ALL" class="cat-btn bg-blue-600 text-white text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap shadow-sm transition-all" data-i18n="catAll">Всё</button>
            <button data-cat="Мебель" class="cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all" data-i18n="catFurniture">🪑 Мебель</button>
            <button data-cat="Техника" class="cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all" data-i18n="catTech">💻 Техника</button>
            <button data-cat="Авто" class="cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all" data-i18n="catAuto">🚗 Авто</button>
            <button data-cat="Одежда" class="cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all" data-i18n="catClothes">👕 Одежда</button>
            <button data-cat="Разное" class="cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all" data-i18n="catOther">📦 Разное</button>
        </div>

        <!-- Сетка товаров -->
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center text-gray-400 py-12" data-i18n="loading">Загрузка объявлений...</div>
        </div>
    </main>

    <!-- Модалка создания -->
    <div id="addModal" class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center hidden backdrop-blur-sm transition-all">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg text-gray-900" data-i18n="modalTitle">Новое объявление</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <form id="addPostForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formTitle">Название товара</label>
                    <input type="text" id="postTitle" required minlength="3" maxlength="60" placeholder="Например: Диван IKEA" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formPrice">Цена (€)</label>
                        <input type="number" id="postPrice" min="0" max="1000000" placeholder="0 = Бесплатно" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formCity">Город</label>
                        <select id="postCity" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="Будва">Будва</option>
                            <option value="Бар">Бар</option>
                            <option value="Тиват">Тиват</option>
                            <option value="Подгорица">Подгорица</option>
                            <option value="Котор">Котор</option>
                            <option value="Херцег-Нови">Херцег-Нови</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formCat">Категория</label>
                        <select id="postCategory" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="Мебель">Мебель</option>
                            <option value="Техника">Техника</option>
                            <option value="Авто">Авто</option>
                            <option value="Одежда">Одежда</option>
                            <option value="Разное">Разное</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formTg">Telegram Ник</label>
                        <input type="text" id="postTg" required placeholder="@username" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <!-- Загрузка фото с предпросмотром -->
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Фотографии (до 5 шт)</label>
                    <input type="file" id="postFiles" multiple accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                    
                    <div id="imagePreviewContainer" class="grid grid-cols-5 gap-2 mt-3 hidden"></div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formDesc">Описание</label>
                    <textarea id="postDesc" rows="3" minlength="5" placeholder="Опишите состояние товара..." class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-medium py-3 rounded-xl hover:bg-blue-700 transition-colors shadow-sm mt-2 flex items-center justify-center gap-2">
                    <span data-i18n="formSubmit">Опубликовать</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const translations = {
            ru: { sellBtn: "Продать", mainTitle: "Свежие объявления", mainSubtitle: "Покупки и продажи по всей Черногории", allCities: "Все города", catAll: "Всё", catFurniture: "🪑 Мебель", catTech: "💻 Техника", catAuto: "🚗 Авто", catClothes: "👕 Одежда", catOther: "📦 Разное", loading: "Загрузка...", noPosts: "В этой категории пока нет объявлений", free: "Бесплатно", modalTitle: "Новое объявление", formTitle: "Название", formPrice: "Цена (€)", formCity: "Город", formCat: "Категория", formTg: "Telegram Ник", formDesc: "Описание", formSubmit: "Опубликовать", badWordsAlert: "Запрещённые слова в тексте!", successAlert: "Успешно создано!" },
            en: { sellBtn: "Sell", mainTitle: "Recent Listings", mainSubtitle: "Buy and sell across Montenegro", allCities: "All cities", catAll: "All", catFurniture: "🪑 Furniture", catTech: "💻 Tech", catAuto: "🚗 Auto", catClothes: "👕 Clothes", catOther: "📦 Other", loading: "Loading...", noPosts: "No listings here yet", free: "Free", modalTitle: "New Listing", formTitle: "Title", formPrice: "Price (€)", formCity: "City", formCat: "Category", formTg: "Telegram Username", formDesc: "Description", formSubmit: "Publish", badWordsAlert: "Contains prohibited words!", successAlert: "Successfully created!" },
            cnr: { sellBtn: "Prodaj", mainTitle: "Novi oglasi", mainSubtitle: "Kupovina i prodaja širom Crne Gore", allCities: "Svi gradovi", catAll: "Sve", catFurniture: "🪑 Namještaj", catTech: "💻 Tehnika", catAuto: "🚗 Auto", catClothes: "👕 Odjeća", catOther: "📦 Razno", loading: "Učitavanje...", noPosts: "Nema oglasa", free: "Besplatno", modalTitle: "Novi oglas", formTitle: "Naziv", formPrice: "Cijena (€)", formCity: "Grad", formCat: "Kategorija", formTg: "Telegram Korisničko ime", formDesc: "Opis", formSubmit: "Objavi", badWordsAlert: "Sadrži zabranjene riječi!", successAlert: "Uspješno kreirano!" }
        };

        let currentLang = 'ru';
        let allPosts = [];
        let activeCategory = 'ALL';
        let activeCity = 'ALL';
        let selectedFiles = [];

        const BANNED_WORDS = ['хуй', 'пизда', 'пенис', 'член', 'залупа', 'ебать', 'сука', 'блят', 'satan', 'penis', 'dick', 'fuck', 'kurac', 'pizda'];

        const productsGrid = document.getElementById('productsGrid');
        const addModal = document.getElementById('addModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const addPostForm = document.getElementById('addPostForm');
        const cityFilter = document.getElementById('cityFilter');
        const langSelect = document.getElementById('langSelect');
        const postFilesInput = document.getElementById('postFiles');
        const previewContainer = document.getElementById('imagePreviewContainer');

        openModalBtn.addEventListener('click', () => addModal.classList.remove('hidden'));
        closeModalBtn.addEventListener('click', () => addModal.classList.add('hidden'));

        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            updateInterfaceLanguage();
            applyFilters();
        });

        // Управление предпросмотром фото
        postFilesInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            selectedFiles = [...selectedFiles, ...files].slice(0, 5);
            renderPreviews();
            postFilesInput.value = '';
        });

        function renderPreviews() {
            if (selectedFiles.length === 0) {
                previewContainer.classList.add('hidden');
                previewContainer.innerHTML = '';
                return;
            }

            previewContainer.classList.remove('hidden');
            previewContainer.innerHTML = selectedFiles.map((file, index) => {
                const objectUrl = URL.createObjectURL(file);
                return `
                    <div class="relative group h-14 rounded-lg overflow-hidden border border-gray-200 bg-gray-100">
                        <img src="${objectUrl}" class="w-full h-full object-cover">
                        <button type="button" onclick="removeSelectedFile(${index})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-0.5 hover:bg-red-600 shadow transition-all">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        window.removeSelectedFile = function(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
        };

        function updateInterfaceLanguage() {
            const lang = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (lang[key]) el.innerText = lang[key];
            });
        }

        async function loadPosts() {
            const { data: posts, error } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
            if (error) {
                productsGrid.innerHTML = `<div class="col-span-full text-center text-red-500 py-8">Ошибка загрузки</div>`;
                return;
            }
            allPosts = posts || [];
            applyFilters();
        }

        function applyFilters() {
            let filtered = allPosts;
            if (activeCategory !== 'ALL') filtered = filtered.filter(p => p.category === activeCategory);
            if (activeCity !== 'ALL') filtered = filtered.filter(p => p.city === activeCity);
            renderPosts(filtered);
        }

        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-btn').forEach(b => b.className = 'cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all');
                e.target.className = 'cat-btn bg-blue-600 text-white text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap shadow-sm transition-all';
                activeCategory = e.target.getAttribute('data-cat');
                applyFilters();
            });
        });

        cityFilter.addEventListener('change', (e) => {
            activeCity = e.target.value;
            applyFilters();
        });

        function renderPosts(posts) {
            const lang = translations[currentLang];
            if (!posts || posts.length === 0) {
                productsGrid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12">${lang.noPosts}</div>`;
                return;
            }

            productsGrid.innerHTML = posts.map(post => {
                const isFree = Number(post.price) === 0;
                const priceTag = isFree ? `<span class="font-bold text-sm text-emerald-600">${lang.free}</span>` : `<span class="font-bold text-sm text-blue-600">${post.price} €</span>`;
                const imgList = post.images && post.images.length > 0 ? post.images : [post.image_url || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500'];
                const img = imgList[0];

                return `
                    <a href="post.html?id=${post.id}" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition-all duration-200 group">
                        <div>
                            <div class="relative h-44 bg-gray-100 overflow-hidden">
                                <img src="${img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${post.title}">
                                <span class="absolute top-2 right-2 bg-black/60 text-white text-[10px] font-medium px-2 py-0.5 rounded-lg backdrop-blur-md">${post.city}</span>
                                ${isFree ? `<span class="absolute top-2 left-2 bg-emerald-500 text-white font-medium text-[10px] px-2 py-0.5 rounded-lg shadow-sm">${lang.free}</span>` : ''}
                            </div>
                            <div class="p-3">
                                <div class="text-[10px] text-blue-600 font-semibold uppercase tracking-wider mb-1">${post.category || 'Разное'}</div>
                                <h3 class="font-semibold text-sm text-gray-900 line-clamp-1 group-hover:text-blue-600 transition-colors">${post.title}</h3>
                                <p class="text-xs text-gray-500 mt-1 line-clamp-2">${post.description || ''}</p>
                            </div>
                        </div>
                        <div class="p-3 pt-0 flex items-center justify-between mt-2">
                            ${priceTag}
                            <span class="bg-blue-50 text-blue-600 p-2 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </span>
                        </div>
                    </a>
                `;
            }).join('');
            lucide.createIcons();
        }

        function isContentClean(text) {
            const cleanText = text.toLowerCase();
            if (BANNED_WORDS.some(w => cleanText.includes(w))) return false;
            if (/(.)\1{4,}/.test(cleanText)) return false;
            return true;
        }

        async function uploadFiles(files) {
            const uploadedUrls = [];
            for (const file of files) {
                const fileExt = file.name.split('.').pop();
                const fileName = `${Math.random().toString(36).substring(2)}_${Date.now()}.${fileExt}`;
                const { data, error } = await supabaseClient.storage.from('post-images').upload(fileName, file);
                if (!error) {
                    const { data: publicUrlData } = supabaseClient.storage.from('post-images').getPublicUrl(fileName);
                    uploadedUrls.push(publicUrlData.publicUrl);
                }
            }
            return uploadedUrls;
        }

        addPostForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const lang = translations[currentLang];
            const submitBtn = document.getElementById('submitBtn');

            const title = document.getElementById('postTitle').value.trim();
            const description = document.getElementById('postDesc').value.trim();

            if (!isContentClean(title) || !isContentClean(description)) {
                alert(lang.badWordsAlert);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Загрузка фото...";

            let imageUrls = [];
            if (selectedFiles.length > 0) {
                imageUrls = await uploadFiles(selectedFiles);
            }

            if (imageUrls.length === 0) {
                imageUrls = ['https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500'];
            }

            const newPost = {
                title: title,
                price: Number(document.getElementById('postPrice').value) || 0,
                city: document.getElementById('postCity').value,
                category: document.getElementById('postCategory').value,
                image_url: imageUrls[0],
                images: imageUrls,
                telegram_handle: document.getElementById('postTg').value.replace('@', ''),
                description: description
            };

            const { data, error } = await supabaseClient.from('posts').insert([newPost]);

            submitBtn.disabled = false;
            submitBtn.innerText = lang.formSubmit;

            if (error) {
                alert('Ошибка: ' + error.message);
            } else {
                alert(lang.successAlert);
                addPostForm.reset();
                selectedFiles = [];
                renderPreviews();
                addModal.classList.add('hidden');
                loadPosts();
            }
        });

        loadPosts();

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
