<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Доска объявлений в Черногории</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24 selection:bg-blue-500 selection:text-white">

    <!-- Toast уведомление -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none flex items-center gap-2">
        <span id="toastText">Уведомление</span>
    </div>

    <!-- Шапка сайта -->
    <header class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-30 transition-all">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <a href="index.html" class="flex items-center gap-2 font-black text-lg text-gray-950 shrink-0 tracking-tight">
                <span class="text-xl">🇲🇪</span> MNE Market
            </a>

            <!-- Поиск -->
            <div class="flex-1 max-w-md relative">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="searchInput" oninput="handleSearchInput(event)" placeholder="Поиск товаров..." class="w-full bg-gray-100/80 border border-transparent focus:border-blue-500 focus:bg-white rounded-xl pl-10 pr-4 py-2 text-sm outline-none transition-all">
            </div>

            <!-- Правая часть: Мои объявления, Избранное, Язык, Создать -->
            <div class="flex items-center gap-2 shrink-0">
                <!-- Кнопка "Мои объявления" -->
                <button onclick="toggleMyPostsFilter()" id="myPostsHeaderBtn" title="Мои объявления" class="relative flex items-center justify-center w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition-all cursor-pointer">
                    <i data-lucide="user" class="w-4 h-4 text-gray-700"></i>
                    <span id="myPostsCountBadge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-bold hidden shadow-sm">0</span>
                </button>

                <!-- Избранное -->
                <button onclick="toggleFavoritesFilter()" id="favoritesHeaderBtn" title="Избранное" class="relative flex items-center justify-center w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition-all cursor-pointer">
                    <i data-lucide="heart" class="w-4 h-4 text-rose-500"></i>
                    <span id="favoritesCountBadge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-bold hidden shadow-sm">0</span>
                </button>

                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-2 py-2 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                    <option value="cnr">CNR</option>
                </select>

                <a href="create.html" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-medium px-3.5 py-2 rounded-xl text-xs sm:text-sm transition-all shadow-sm shadow-blue-500/20 flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i> <span data-i18n="postAd">Post ad</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-5xl mx-auto px-4 pt-5 space-y-4">

        <!-- Режим "Мои объявления" (Баннер-подсказка при активном фильтре) -->
        <div id="myPostsBanner" class="hidden bg-blue-50 border border-blue-100 rounded-2xl p-4 flex items-center justify-between text-blue-900">
            <div class="flex items-center gap-2.5">
                <i data-lucide="shield-check" class="w-5 h-5 text-blue-600 shrink-0"></i>
                <div>
                    <h4 class="text-xs font-bold" data-i18n="myPostsModeTitle">Управление вашими объявлениями</h4>
                    <p class="text-[11px] text-blue-700" data-i18n="myPostsModeDesc">Здесь отображаются только созданные вами товары с этого устройства/Telegram аккаунта.</p>
                </div>
            </div>
            <button onclick="toggleMyPostsFilter()" class="text-xs font-bold text-blue-600 hover:text-blue-800 underline cursor-pointer shrink-0" data-i18n="closeMode">Закрыть</button>
        </div>

        <!-- Фильтры (Города и Категории) -->
        <div class="bg-white rounded-2xl p-4 border border-gray-100/80 shadow-sm space-y-3.5">
            <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none" id="citiesContainer">
                <button onclick="setCity('all')" class="city-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-blue-600 text-white shadow-sm shadow-blue-500/20" data-city="all" data-i18n="allCities">Все города</button>
                <button onclick="setCity('budva')" class="city-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-city="budva">Будва</button>
                <button onclick="setCity('bar')" class="city-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-city="bar">Бар</button>
                <button onclick="setCity('tivat')" class="city-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-city="tivat">Тиват</button>
                <button onclick="setCity('podgorica')" class="city-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-city="podgorica">Подгорица</button>
                <button onclick="setCity('kotor')" class="city-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-city="kotor">Котор</button>
                <button onclick="setCity('herceg_novi')" class="city-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-city="herceg_novi">Херцег-Нови</button>
            </div>

            <hr class="border-gray-100">

            <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none" id="categoriesContainer">
                    <button onclick="setCategory('all')" class="cat-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-900 text-white shadow-sm" data-cat="all" data-i18n="cat_all">Все</button>
                    <button onclick="setCategory('furniture')" class="cat-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-cat="furniture" data-i18n="cat_furniture">Мебель</button>
                    <button onclick="setCategory('tech')" class="cat-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-cat="tech" data-i18n="cat_tech">Техника</button>
                    <button onclick="setCategory('auto')" class="cat-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-cat="auto" data-i18n="cat_auto">Авто</button>
                    <button onclick="setCategory('clothes')" class="cat-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-cat="clothes" data-i18n="cat_clothes">Одежда</button>
                    <button onclick="setCategory('other')" class="cat-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600" data-cat="other" data-i18n="cat_other">Разное</button>
                </div>

                <div class="flex items-center justify-between md:justify-end gap-2 shrink-0">
                    <button id="freeFilterBtn" onclick="toggleFreeFilter()" class="text-xs font-semibold text-gray-600 bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-xl transition-all cursor-pointer flex items-center gap-1">
                        <i data-lucide="gift" class="w-3.5 h-3.5 text-emerald-600"></i> <span data-i18n="freeOnly">Бесплатно</span>
                    </button>

                    <button id="resetFiltersBtn" onclick="resetAllFilters()" class="hidden text-xs font-semibold text-rose-600 hover:bg-rose-50 px-3 py-2 rounded-xl transition-all cursor-pointer flex items-center gap-1">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i> <span data-i18n="resetFilters">Сбросить</span>
                    </button>
                    
                    <select id="sortSelect" onchange="renderPosts()" class="bg-gray-100 hover:bg-gray-200 border-none rounded-xl px-3 py-2 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                        <option value="newest" data-i18n="sort_newest">Сначала новые</option>
                        <option value="cheap" data-i18n="sort_cheap">Сначала дешевле</option>
                        <option value="expensive" data-i18n="sort_expensive">Сначала дороже</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between px-1">
            <span id="resultsCountText" class="text-xs font-medium text-gray-400"></span>
        </div>

        <!-- Список объявлений -->
        <div id="postsContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>

        <!-- Заглушка -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-center space-y-3">
            <div class="bg-gray-100 p-4 rounded-full text-gray-400">
                <i data-lucide="search-x" class="w-8 h-8"></i>
            </div>
            <h3 class="font-bold text-gray-900 text-base" data-i18n="emptyTitle">Ничего не найдено</h3>
            <p class="text-xs text-gray-500 max-w-xs" data-i18n="emptyDesc">Попробуйте изменить параметры поиска или сбросить фильтры.</p>
            <button onclick="resetAllFilters()" class="bg-gray-900 hover:bg-gray-800 text-white px-4 py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer shadow-sm">
                <span data-i18n="resetFilters">Сбросить фильтры</span>
            </button>
        </div>
    </main>

    <!-- Скрипты приложения -->
    <script>
        lucide.createIcons();

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Инициализация идентификатора пользователя (user_token или telegram_id)
        let userToken = localStorage.getItem('mne_user_token');
        if (!userToken) {
            userToken = 'user_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('mne_user_token', userToken);
        }

        // Если открыто в Telegram, приоритет отдаем реальному telegram_id
        const tgUserId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : null;

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dict = {
            ru: {
                postAd: "Подать", searchPh: "Поиск товаров...", allCities: "Все города",
                cat_all: "Все", cat_furniture: "Мебель", cat_tech: "Техника", cat_auto: "Авто", cat_clothes: "Одежда", cat_other: "Разное",
                sort_newest: "Сначала новые", sort_cheap: "Сначала дешевле", sort_expensive: "Сначала дороже",
                resetFilters: "Сбросить", freeOnly: "Бесплатно", emptyTitle: "Ничего не найдено", emptyDesc: "Попробуйте изменить параметры поиска или сбросить фильтры.",
                free: "Бесплатно", newBadge: "NEW", deletePost: "Удалить", confirmDelete: "Только что удалено",
                addedToFav: "Добавлено в избранное ❤️", removedFromFav: "Удалено из избранного",
                myPostsModeTitle: "Управление вашими объявлениями", myPostsModeDesc: "Здесь отображаются только созданные вами товары.", closeMode: "Закрыть",
                foundCount: (n) => `Найдено объявлений: ${n}`,
                cities: { budva: "Будва", bar: "Бар", tivat: "Тиват", podgorica: "Подгорица", kotor: "Котор", herceg_novi: "Херцег-Нови" }
            },
            en: {
                postAd: "Post", searchPh: "Search items...", allCities: "All cities",
                cat_all: "All", cat_furniture: "Furniture", cat_tech: "Electronics", cat_auto: "Vehicles", cat_clothes: "Clothing", cat_other: "Other",
                sort_newest: "Newest first", sort_cheap: "Cheapest first", sort_expensive: "Most expensive",
                resetFilters: "Reset", freeOnly: "Free", emptyTitle: "No items found", emptyDesc: "Try changing your search parameters or reset filters.",
                free: "Free", newBadge: "NEW", deletePost: "Delete", confirmDelete: "Deleted",
                addedToFav: "Added to favorites ❤️", removedFromFav: "Removed from favorites",
                myPostsModeTitle: "Manage your listings", myPostsModeDesc: "Only listings created by you are displayed here.", closeMode: "Close",
                foundCount: (n) => `Items found: ${n}`,
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" }
            },
            cnr: {
                postAd: "Objavi", searchPh: "Pretraga artikala...", allCities: "Svi gradovi",
                cat_all: "Sve", cat_furniture: "Namještaj", cat_tech: "Tehnika", cat_auto: "Auto", cat_clothes: "Odjeća", cat_other: "Razno",
                sort_newest: "Najnovije", sort_cheap: "Najjeftinije", sort_expensive: "Najskuplje",
                resetFilters: "Resetuj", freeOnly: "Besplatno", emptyTitle: "Nema rezultata", emptyDesc: "Pokušajte da promijenite parametre pretrage ili resetujte filtere.",
                free: "Besplatno", newBadge: "NOVO", deletePost: "Obriši", confirmDelete: "Obrisano",
                addedToFav: "Dodato u omiljene ❤️", removedFromFav: "Uklonjeno iz omiljenih",
                myPostsModeTitle: "Upravljanje vašim oglasima", myPostsModeDesc: "Ovdje se prikazuju samo vaši oglasi.", closeMode: "Zatvori",
                foundCount: (n) => `Pronađeno oglasa: ${n}`,
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let posts = [];
        let selectedCity = 'all';
        let selectedCategory = 'all';
        let searchQuery = '';
        let showOnlyFavorites = false;
        let showOnlyMyPosts = false;
        let showOnlyFree = false;
        
        let rawFavorites = JSON.parse(localStorage.getItem('mne_favorites') || '[]');
        let favorites = [...new Set(rawFavorites.map(id => String(id)))];
        localStorage.setItem('mne_favorites', JSON.stringify(favorites));

        // Локальный список созданных пользователем ID объявлений (на случай отсутствия колонки user_id в базе)
        let myLocalPostIds = JSON.parse(localStorage.getItem('mne_my_posts') || '[]');

        let searchTimeout = null;
        let toastTimeout = null;

        function showToast(text) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            toastText.innerText = text;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 1500);
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            document.getElementById('searchInput').placeholder = dict[lang].searchPh;
            document.querySelector('[data-city="all"]').innerText = dict[lang].allCities;

            const citiesObj = dict[lang].cities;
            for (const [code, name] of Object.entries(citiesObj)) {
                const btn = document.querySelector(`[data-city="${code}"]`);
                if (btn) btn.innerText = name;
            }

            renderPosts();
        }

        document.getElementById('langSelect').value = currentLang;
        changeLanguage(currentLang);

        function updateBadges() {
            const favBadge = document.getElementById('favoritesCountBadge');
            if (favorites.length > 0) {
                favBadge.innerText = favorites.length;
                favBadge.classList.remove('hidden');
            } else {
                favBadge.classList.add('hidden');
            }

            const myBadge = document.getElementById('myPostsCountBadge');
            const myCount = posts.filter(p => isMyPost(p)).length;
            if (myCount > 0) {
                myBadge.innerText = myCount;
                myBadge.classList.remove('hidden');
            } else {
                myBadge.classList.add('hidden');
            }
        }

        function isMyPost(post) {
            const postIdStr = String(post.id);
            if (myLocalPostIds.includes(postIdStr)) return true;
            if (tgUserId && String(post.telegram_id) === tgUserId) return true;
            if (post.user_token && post.user_token === userToken) return true;
            return false;
        }

        function toggleFavorite(e, id) {
            e.stopPropagation();
            const stringId = String(id);
            const index = favorites.indexOf(stringId);
            
            if (index > -1) {
                favorites.splice(index, 1);
                showToast(dict[currentLang].removedFromFav);
            } else {
                favorites.push(stringId);
                showToast(dict[currentLang].addedToFav);
            }
            
            favorites = [...new Set(favorites)];
            localStorage.setItem('mne_favorites', JSON.stringify(favorites));
            
            updateBadges();
            renderPosts();
        }

        function toggleMyPostsFilter() {
            showOnlyMyPosts = !showOnlyMyPosts;
            const btn = document.getElementById('myPostsHeaderBtn');
            const banner = document.getElementById('myPostsBanner');

            if (showOnlyMyPosts) {
                btn.classList.add('bg-blue-50', 'border', 'border-blue-200');
                banner.classList.remove('hidden');
                banner.classList.add('flex');
            } else {
                btn.classList.remove('bg-blue-50', 'border', 'border-blue-200');
                banner.classList.add('hidden');
                banner.classList.remove('flex');
            }
            checkResetButtonVisibility();
            renderPosts();
        }

        function toggleFavoritesFilter() {
            showOnlyFavorites = !showOnlyFavorites;
            const btn = document.getElementById('favoritesHeaderBtn');
            if (showOnlyFavorites) {
                btn.classList.add('bg-rose-50', 'border', 'border-rose-200');
            } else {
                btn.classList.remove('bg-rose-50', 'border', 'border-rose-200');
            }
            checkResetButtonVisibility();
            renderPosts();
        }

        function toggleFreeFilter() {
            showOnlyFree = !showOnlyFree;
            const btn = document.getElementById('freeFilterBtn');
            if (showOnlyFree) {
                btn.classList.add('bg-emerald-50', 'border', 'border-emerald-200', 'text-emerald-700');
            } else {
                btn.classList.remove('bg-emerald-50', 'border', 'border-emerald-200', 'text-emerald-700');
            }
            checkResetButtonVisibility();
            renderPosts();
        }

        async function deletePost(e, id) {
            e.stopPropagation();
            if (!confirm(dict[currentLang].deletePost + '?')) return;

            try {
                const { error } = await supabaseClient.from('posts').delete().eq('id', id);
                if (error) throw error;

                posts = posts.filter(p => p.id !== id);
                myLocalPostIds = myLocalPostIds.filter(item => String(item) !== String(id));
                localStorage.setItem('mne_my_posts', JSON.stringify(myLocalPostIds));

                showToast(dict[currentLang].confirmDelete);
                updateBadges();
                renderPosts();
            } catch (err) {
                console.error('Ошибка удаления:', err);
                showToast('Ошибка удаления');
            }
        }

        function setCity(city) {
            selectedCity = city;
            document.querySelectorAll('.city-btn').forEach(btn => {
                if (btn.getAttribute('data-city') === city) {
                    btn.className = "city-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-blue-600 text-white shadow-sm shadow-blue-500/20";
                } else {
                    btn.className = "city-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600";
                }
            });
            checkResetButtonVisibility();
            renderPosts();
        }

        function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-900 text-white shadow-sm";
                } else {
                    btn.className = "cat-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600";
                }
            });
            checkResetButtonVisibility();
            renderPosts();
        }

        function handleSearchInput(e) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = e.target.value.toLowerCase().trim();
                checkResetButtonVisibility();
                renderPosts();
            }, 250);
        }

        function checkResetButtonVisibility() {
            const resetBtn = document.getElementById('resetFiltersBtn');
            if (selectedCity !== 'all' || selectedCategory !== 'all' || searchQuery !== '' || showOnlyFavorites || showOnlyMyPosts || showOnlyFree) {
                resetBtn.classList.remove('hidden');
                resetBtn.classList.add('flex');
            } else {
                resetBtn.classList.add('hidden');
                resetBtn.classList.remove('flex');
            }
        }

        function resetAllFilters() {
            selectedCity = 'all';
            selectedCategory = 'all';
            searchQuery = '';
            showOnlyFavorites = false;
            showOnlyMyPosts = false;
            showOnlyFree = false;
            document.getElementById('searchInput').value = '';
            document.getElementById('favoritesHeaderBtn').classList.remove('bg-rose-50', 'border', 'border-rose-200');
            document.getElementById('myPostsHeaderBtn').classList.remove('bg-blue-50', 'border', 'border-blue-200');
            document.getElementById('myPostsBanner').classList.add('hidden');
            document.getElementById('freeFilterBtn').classList.remove('bg-emerald-50', 'border', 'border-emerald-200', 'text-emerald-700');
            setCity('all');
            setCategory('all');
            checkResetButtonVisibility();
            renderPosts();
        }

        async function fetchPosts() {
            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                posts = data || [];
                updateBadges();
                renderPosts();
            } catch (err) {
                console.error('Ошибка загрузки объявлений:', err);
            }
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const emptyState = document.getElementById('emptyState');
            const sortBy = document.getElementById('sortSelect').value;
            const countText = document.getElementById('resultsCountText');

            let filtered = posts.filter(post => {
                const postIdStr = String(post.id);
                if (selectedCity !== 'all' && post.city !== selectedCity) return false;
                if (selectedCategory !== 'all' && post.category !== selectedCategory) return false;
                if (showOnlyFavorites && !favorites.includes(postIdStr)) return false;
                if (showOnlyMyPosts && !isMyPost(post)) return false;
                if (showOnlyFree && Number(post.price || 0) > 0) return false;
                if (searchQuery && !post.title.toLowerCase().includes(searchQuery) && !post.description.toLowerCase().includes(searchQuery)) return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'cheap') return (a.price || 0) - (b.price || 0);
                if (sortBy === 'expensive') return (b.price || 0) - (a.price || 0);
                return new Date(b.created_at || 0) - new Date(a.created_at || 0);
            });

            countText.innerText = dict[currentLang].foundCount(filtered.length);

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            const citiesMap = dict[currentLang].cities;
            const now = new Date();

            container.innerHTML = filtered.map(post => {
                const postIdStr = String(post.id);
                const isFav = favorites.includes(postIdStr);
                const isMine = isMyPost(post);
                const cityName = citiesMap[post.city] || post.city;
                const priceText = post.price > 0 ? `${post.price} €` : dict[currentLang].free;
                const imageUrl = post.image_url || (post.images && post.images[0]) || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500';
                const isNew = post.created_at && (now - new Date(post.created_at) < 48 * 3600 * 1000);

                return `
                    <div onclick="window.location.href='post.html?id=${post.id}'" class="bg-white rounded-2xl border border-gray-100 hover:border-gray-200 overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-0.5 transition-all duration-200 cursor-pointer flex flex-col group relative">
                        <div class="relative aspect-square bg-gray-100 overflow-hidden">
                            <img src="${imageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${post.title}">
                            
                            <div class="absolute top-2.5 left-2.5 flex flex-col gap-1">
                                <span class="bg-black/60 backdrop-blur-md text-white text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider">
                                    ${dict[currentLang]['cat_' + post.category] || post.category}
                                </span>
                                ${isNew ? `<span class="bg-blue-600 text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded-md shadow-sm w-fit">${dict[currentLang].newBadge}</span>` : ''}
                                ${isMine ? `<span class="bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-md shadow-sm w-fit">Мое</span>` : ''}
                            </div>

                            <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5">
                                ${isMine ? `
                                    <button onclick="deletePost(event, '${post.id}')" title="${dict[currentLang].deletePost}" class="bg-white/90 hover:bg-rose-600 hover:text-white text-rose-600 p-2 rounded-full backdrop-blur-sm transition-all cursor-pointer shadow-sm active:scale-90">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                ` : ''}
                                <button onclick="toggleFavorite(event, '${post.id}')" class="bg-white/90 hover:bg-white p-2 rounded-full backdrop-blur-sm transition-all cursor-pointer shadow-sm active:scale-90">
                                    <svg class="w-4 h-4 ${isFav ? 'text-rose-500 fill-rose-500' : 'text-gray-600'}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                </button>
                            </div>
                        </div>

                        <div class="p-3.5 flex flex-col flex-1 justify-between gap-3">
                            <div>
                                <h3 class="font-bold text-gray-900 text-sm line-clamp-1 group-hover:text-blue-600 transition-colors">${post.title}</h3>
                                <div class="flex items-center gap-1 text-[11px] text-gray-400 mt-1">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i> <span>${cityName}</span>
                                </div>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="font-black text-gray-900 text-sm sm:text-base">${priceText}</span>
                                <span class="text-[11px] text-gray-400 flex items-center gap-1"><i data-lucide="eye" class="w-3 h-3"></i> ${post.views || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        fetchPosts();
    </script>
</body>
</html>
