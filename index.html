<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Доска объявлений в Черногории</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Шапка сайта -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-2 font-bold text-lg text-blue-600">
                <span>🇲🇪</span> MNE Market
            </a>

            <!-- Поиск по сайту -->
            <div class="flex-1 max-w-md relative hidden sm:block">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="searchInput" oninput="filterPosts()" placeholder="Поиск товаров..." class="w-full bg-gray-100 rounded-xl pl-9 pr-4 py-2 text-xs outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
            
            <div class="flex items-center gap-3">
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-2.5 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="ru">🇷🇺 RU</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="cnr">🇲🇪 CNR</option>
                </select>

                <a href="create.html" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs px-4 py-2 rounded-xl transition-all shadow-sm flex items-center gap-1.5 shrink-0">
                    <i data-lucide="plus" class="w-4 h-4"></i> <span data-i18n="createBtn">Подать объявление</span>
                </a>
            </div>
        </div>
        <!-- Мобильный поиск -->
        <div class="px-4 pb-3 sm:hidden">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="searchInputMob" oninput="filterPosts()" placeholder="Поиск товаров..." class="w-full bg-gray-100 rounded-xl pl-9 pr-4 py-2 text-xs outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-6xl mx-auto px-4 pt-6 space-y-6">
        
        <!-- Панель фильтров и сортировки -->
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-4">
            <!-- Города -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar" id="cityFilters">
                <button onclick="setCity('all')" class="city-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-blue-600 text-white transition-all shrink-0 cursor-pointer" data-i18n="allCities">Все города</button>
                <button onclick="setCity('budva')" data-city="budva" class="city-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer">Будва</button>
                <button onclick="setCity('bar')" data-city="bar" class="city-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer">Бар</button>
                <button onclick="setCity('tivat')" data-city="tivat" class="city-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer">Тиват</button>
                <button onclick="setCity('podgorica')" data-city="podgorica" class="city-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer">Подгорица</button>
                <button onclick="setCity('kotor')" data-city="kotor" class="city-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer">Котор</button>
                <button onclick="setCity('herceg_novi')" data-city="herceg_novi" class="city-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer">Херцег-Нови</button>
            </div>

            <!-- Категории, тип цены и сортировка -->
            <div class="flex flex-col md:flex-row items-center justify-between gap-3 pt-2 border-t border-gray-100">
                <!-- Категории -->
                <div class="flex items-center gap-1.5 overflow-x-auto w-full pb-1">
                    <button onclick="setCategory('all')" class="cat-btn px-3 py-1 rounded-lg text-xs font-semibold bg-gray-900 text-white transition-all shrink-0 cursor-pointer" data-i18n="allCategories">Все</button>
                    <button onclick="setCategory('furniture')" class="cat-btn px-3 py-1 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer" data-i18n="catFurniture">Мебель</button>
                    <button onclick="setCategory('tech')" class="cat-btn px-3 py-1 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer" data-i18n="catTech">Техника</button>
                    <button onclick="setCategory('auto')" class="cat-btn px-3 py-1 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer" data-i18n="catAuto">Авто</button>
                    <button onclick="setCategory('clothes')" class="cat-btn px-3 py-1 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer" data-i18n="catClothes">Одежда</button>
                    <button onclick="setCategory('other')" class="cat-btn px-3 py-1 rounded-lg text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all shrink-0 cursor-pointer" data-i18n="catOther">Разное</button>
                </div>

                <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                    <!-- Фильтр по типу цены -->
                    <select id="priceTypeSelect" onchange="filterPosts()" class="bg-gray-100 border-none rounded-xl px-3 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                        <option value="all" data-i18n="priceAll">Все цены</option>
                        <option value="paid" data-i18n="pricePaid">Платные</option>
                        <option value="free" data-i18n="priceFree">Бесплатные</option>
                    </select>

                    <!-- Сортировка -->
                    <select id="sortSelect" onchange="filterPosts()" class="bg-gray-100 border-none rounded-xl px-3 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                        <option value="newest" data-i18n="sortNew">Сначала новые</option>
                        <option value="cheap" data-i18n="sortCheap">Сначала дешевле</option>
                        <option value="expensive" data-i18n="sortExpensive">Сначала дороже</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Сетка объявлений -->
        <div id="postsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="col-span-full text-center text-gray-400 py-12" data-i18n="loading">Загрузка объявлений...</div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dict = {
            ru: {
                createBtn: "Подать объявление", loading: "Загрузка...", free: "Бесплатно",
                allCities: "Все города", allCategories: "Все",
                catFurniture: "Мебель", catTech: "Техника", catAuto: "Авто", catClothes: "Одежда", catOther: "Разное",
                priceAll: "Все цены", pricePaid: "Платные", priceFree: "Бесплатные",
                sortNew: "Сначала новые", sortCheap: "Сначала дешевле", sortExpensive: "Сначала дороже",
                noPosts: "Объявлений пока нет",
                cities: { budva: "Будва", bar: "Бар", tivat: "Тиват", podgorica: "Подгорица", kotor: "Котор", herceg_novi: "Херцег-Нови" },
                categories: { furniture: "Мебель", tech: "Техника", auto: "Авто", clothes: "Одежда", other: "Разное" }
            },
            en: {
                createBtn: "Post ad", loading: "Loading...", free: "Free",
                allCities: "All cities", allCategories: "All",
                catFurniture: "Furniture", catTech: "Electronics", catAuto: "Vehicles", catClothes: "Clothing", catOther: "Other",
                priceAll: "All prices", pricePaid: "Paid", priceFree: "Free",
                sortNew: "Newest first", sortCheap: "Lowest price", sortExpensive: "Highest price",
                noPosts: "No listings found",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" },
                categories: { furniture: "Furniture", tech: "Electronics", auto: "Vehicles", clothes: "Clothing", other: "Other" }
            },
            cnr: {
                createBtn: "Postavi oglas", loading: "Učitavanje...", free: "Besplatno",
                allCities: "Svi gradovi", allCategories: "Sve",
                catFurniture: "Namještaj", catTech: "Tehnika", catAuto: "Auto", catClothes: "Odjeća", catOther: "Razno",
                priceAll: "Sve cijene", pricePaid: "Se plaća", priceFree: "Besplatno",
                sortNew: "Najnovije", sortCheap: "Najjeftinije", sortExpensive: "Najskuplje",
                noPosts: "Nema oglasa",
                cities: { budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" },
                categories: { furniture: "Namještaj", tech: "Tehnika", auto: "Auto", clothes: "Odjeća", other: "Razno" }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let allPosts = [];
        let selectedCity = 'all';
        let selectedCategory = 'all';
        let favorites = JSON.parse(localStorage.getItem('mne_favorites') || '[]');

        async function initPage() {
            document.getElementById('langSelect').value = currentLang;
            updateCityButtonLabels();
            
            const { data, error } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error(error);
                return;
            }

            allPosts = data || [];
            filterPosts();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            updateCityButtonLabels();
            filterPosts();
        }

        function updateCityButtonLabels() {
            document.querySelectorAll('.city-btn[data-city]').forEach(btn => {
                const cityKey = btn.getAttribute('data-city');
                if (dict[currentLang].cities[cityKey]) {
                    btn.innerText = dict[currentLang].cities[cityKey];
                }
            });
        }

        function setCity(city) {
            selectedCity = city;
            document.querySelectorAll('.city-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-600');
            });
            event.currentTarget.classList.remove('bg-gray-100', 'text-gray-600');
            event.currentTarget.classList.add('bg-blue-600', 'text-white');
            filterPosts();
        }

        function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-gray-900', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-600');
            });
            event.currentTarget.classList.remove('bg-gray-100', 'text-gray-600');
            event.currentTarget.classList.add('bg-gray-900', 'text-white');
            filterPosts();
        }

        function toggleFavorite(event, postId) {
            event.preventDefault();
            event.stopPropagation();
            
            if (favorites.includes(postId)) {
                favorites = favorites.filter(id => id !== postId);
            } else {
                favorites.push(postId);
            }
            localStorage.setItem('mne_favorites', JSON.stringify(favorites));
            filterPosts();
        }

        function formatPrice(val) {
            const num = Number(val);
            if (num === 0) return dict[currentLang].free;
            return num.toLocaleString('ru-RU') + ' €';
        }

        function filterPosts() {
            const searchQuery = (document.getElementById('searchInput').value || document.getElementById('searchInputMob').value).toLowerCase();
            const sortType = document.getElementById('sortSelect').value;
            const priceType = document.getElementById('priceTypeSelect').value;

            let filtered = allPosts.filter(p => {
                const matchCity = selectedCity === 'all' || p.city === selectedCity;
                const matchCategory = selectedCategory === 'all' || p.category === selectedCategory;
                const matchSearch = !searchQuery || p.title.toLowerCase().includes(searchQuery) || (p.description && p.description.toLowerCase().includes(searchQuery));
                
                let matchPrice = true;
                const pNum = Number(p.price);
                if (priceType === 'paid') matchPrice = pNum > 0;
                if (priceType === 'free') matchPrice = pNum === 0;

                return matchCity && matchCategory && matchSearch && matchPrice;
            });

            filtered.sort((a, b) => {
                if (sortType === 'newest') return new Date(b.created_at) - new Date(a.created_at);
                if (sortType === 'cheap') return Number(a.price) - Number(b.price);
                if (sortType === 'expensive') return Number(b.price) - Number(a.price);
            });

            renderPosts(filtered);
        }

        function renderPosts(posts) {
            const container = document.getElementById('postsGrid');

            if (posts.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12">${dict[currentLang].noPosts}</div>`;
                return;
            }

            container.innerHTML = posts.map(p => {
                const img = (p.images && p.images.length > 0) ? p.images[0] : (p.image_url || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
                const priceText = formatPrice(p.price);
                const cityName = dict[currentLang].cities[p.city] || p.city;
                const categoryName = dict[currentLang].categories[p.category] || p.category || 'Other';
                const isFav = favorites.includes(p.id);

                return `
                    <a href="post.html?id=${p.id}" class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition-all flex flex-col group relative">
                        <div class="relative h-44 bg-gray-100 overflow-hidden">
                            <img src="${img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${p.title}">
                            <span class="absolute top-2 left-2 bg-black/60 text-white text-[10px] font-medium px-2 py-0.5 rounded-lg backdrop-blur-md uppercase tracking-wider">${categoryName}</span>
                            <button onclick="toggleFavorite(event, '${p.id}')" class="absolute top-2 right-2 bg-white/80 hover:bg-white p-2 rounded-full transition-all text-gray-600 shadow-sm cursor-pointer">
                                <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-red-500 text-red-500' : ''}"></i>
                            </button>
                        </div>
                        <div class="p-3.5 flex flex-col flex-1 justify-between gap-2">
                            <div>
                                <h3 class="font-semibold text-xs text-gray-900 line-clamp-2 group-hover:text-blue-600 transition-colors">${p.title}</h3>
                                <p class="text-[11px] text-gray-400 mt-0.5 flex items-center gap-1">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i> ${cityName}
                                </p>
                            </div>
                            <div class="font-black text-sm text-blue-600 pt-1 border-t border-gray-50 flex items-center justify-between">
                                <span>${priceText}</span>
                                <span class="text-[10px] text-gray-300 font-normal flex items-center gap-1"><i data-lucide="eye" class="w-3 h-3"></i> ${p.views || 0}</span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
            lucide.createIcons();
        }

        initPage();
    </script>
</body>
</html>
