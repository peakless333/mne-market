        function checkCityScroll() {
            const container = document.getElementById('citiesContainer');
            const leftBtn = document.getElementById('scrollLeftBtn');
            const rightBtn = document.getElementById('scrollRightBtn');
            if (!container || !leftBtn || !rightBtn) return;
            
            if (container.scrollLeft > 10) {
                leftBtn.style.opacity = '1';
                leftBtn.style.pointerEvents = 'auto';
            } else {
                leftBtn.style.opacity = '0';
                leftBtn.style.pointerEvents = 'none';
            }

            const isEnd = container.scrollLeft + container.clientWidth >= container.scrollWidth - 10;
            if (isEnd) {
                rightBtn.style.opacity = '0';
                rightBtn.style.pointerEvents = 'none';
            } else {
                rightBtn.style.opacity = '1';
                rightBtn.style.pointerEvents = 'auto';
            }
        }

            const postToken = String(post.user_token || '').toLowerCase().trim();
            const postContact = String(post.contact || post.telegram || '').toLowerCase().trim();

            return (
                (postUser && postUser === currentName) ||
                (postToken && postToken === currentName) ||
                (postContact && postContact.includes('peakless333')) ||
                (postContact && postContact.includes(currentName))
            );
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('authUsername').value.trim().toLowerCase();
            const password = document.getElementById('authPassword').value.trim();
            const submitBtn = document.getElementById('authSubmitBtn');
            submitBtn.disabled = true;

            try {
                if (authMode === 'register') {
                    const { data: existing, error: checkError } = await supabaseClient
                        .from('accounts')
                        .select('*')
                        .eq('username', username);

                    if (checkError && checkError.code !== 'PGRST116') {
                        console.warn("Table accounts check error:", checkError);
                    }

                    if (existing && existing.length > 0) {
                        showToast(dict[currentLang].toastUserExists);
                        submitBtn.disabled = false;
                        return;
                    }

                    const { error: regError } = await supabaseClient
                        .from('accounts')
                        .insert([{ username, password }]);

                    if (regError) throw regError;

                    currentUser = { username };
                    localStorage.setItem('mne_logged_user', JSON.stringify(currentUser));
                    showToast(dict[currentLang].toastRegSuccess);
                } else {
                    const { data: found, error: loginError } = await supabaseClient
                        .from('accounts')
                        .select('*')
                        .eq('username', username);

                    if (loginError) throw loginError;

                    if (!found || found.length === 0) {
                        showToast(dict[currentLang].toastUserNotFound);
                        submitBtn.disabled = false;
                        return;
                    }

                    const account = found[0];
                    if (account.password !== password) {
                        showToast(dict[currentLang].toastWrongPassword);
                        submitBtn.disabled = false;
                        return;
                    }

                    currentUser = { username };
                    localStorage.setItem('mne_logged_user', JSON.stringify(currentUser));
                    showToast(dict[currentLang].toastLoginSuccess);
                }

                closeProfileModal();
                updateBadges();
                renderPosts();
            } catch (err) {
                console.error(err);
                showToast("Ошибка авторизации. Проверьте подключение к базе данных.");
            } finally {
                submitBtn.disabled = false;
            }
        }

            const container = document.getElementById('dynamicCategoryFilters');
            const a = dict[currentLang].attrs;

            if (selectedCategory === 'all') {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            let html = '<div class="flex flex-wrap items-center gap-3 text-xs">';

            if (selectedCategory === 'clothes') {
                html += renderSelectFilter('condition', a.condition.label, a.condition.opts);
                html += renderSelectFilter('clothing_type', a.clothing_type.label, a.clothing_type.opts);

                const cType = categoryFiltersState['clothing_type'];
                if (cType === 'top' || cType === 'bottom') {
                    html += renderSelectFilter('size', a.size_top_bottom.label, a.size_top_bottom.opts);
                } else if (cType === 'shoes') {
                    html += renderSelectFilter('size', a.size_shoes.label, a.size_shoes.opts);
                }
            } else if (selectedCategory === 'tech') {
                html += renderSelectFilter('condition', a.condition.label, a.condition.opts);
            } else if (selectedCategory === 'furniture') {
                html += renderSelectFilter('furniture_type', a.furniture_type.label, a.furniture_type.opts);
                html += renderSelectFilter('condition', a.condition.label, a.condition.opts);
            } else if (selectedCategory === 'auto') {
                html += renderSelectFilter('condition', a.condition.label, a.condition.opts);
            } else {
                html += renderSelectFilter('condition', a.condition.label, a.condition.opts);
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function renderSelectFilter(key, label, opts) {
            const currentVal = categoryFiltersState[key] || 'all';
            let optionsHtml = '';
            for (const [val, name] of Object.entries(opts)) {
                optionsHtml += `<option value="${val}" ${currentVal === val ? 'selected' : ''}>${name}</option>`;
            }

            return `
                <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-xl px-3 py-1.5">
                    <span class="font-bold text-gray-500 uppercase text-[10px]">${label}:</span>
                    <select onchange="handleAttrFilterChange('${key}', this.value)" class="bg-transparent font-semibold text-gray-800 outline-none cursor-pointer">
                        ${optionsHtml}
                    </select>
                </div>
            `;
        }

        function handleAttrFilterChange(key, value) {
            if (key === 'clothing_type') {
                delete categoryFiltersState['size'];
            }

            if (value === 'all') {
                delete categoryFiltersState[key];
            } else {
                categoryFiltersState[key] = value;
            }
            renderDynamicCategoryFilters();
            checkResetButtonVisibility();
            renderPosts();
        }

        function handleSearchInput(e) {
            const val = e.target.value;
            searchQuery = val.toLowerCase().trim();
            const clearBtn = document.getElementById('clearSearchBtn');
            if (val.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                checkResetButtonVisibility();
                renderPosts();
            }, 200);
        }

        function performSearchClick() {
            checkResetButtonVisibility();
            renderPosts();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            checkResetButtonVisibility();
            renderPosts();
        }

        function checkResetButtonVisibility() {
            const resetBtn = document.getElementById('resetFiltersBtn');
            const hasActiveAttrFilters = Object.keys(categoryFiltersState).length > 0;
            if (selectedCity !== 'all' || selectedCategory !== 'all' || hasActiveAttrFilters || searchQuery !== '' || showOnlyFavorites || showOnlyMyPosts || showOnlyFree) {
                resetBtn.classList.remove('hidden');
                resetBtn.classList.add('flex');
            } else {
                resetBtn.classList.add('hidden');
                resetBtn.classList.remove('flex');
            }
        }

        function resetAllFilters() {
            selectedCity = 'all';
            selectedCategory = 'all';
            categoryFiltersState = {};
            searchQuery = '';
            showOnlyFavorites = false;
            showOnlyMyPosts = false;
            showOnlyFree = false;
            const input = document.getElementById('searchInput');
            input.value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            document.getElementById('favoritesHeaderBtn').classList.remove('bg-rose-50', 'border', 'border-rose-200');
            document.getElementById('myPostsHeaderBtn').classList.remove('bg-blue-50', 'border', 'border-blue-200');
            document.getElementById('myPostsBanner').classList.add('hidden');
            document.getElementById('freeFilterBtn').classList.remove('bg-emerald-50', 'border', 'border-emerald-200', 'text-emerald-700');
            
            document.querySelectorAll('.category-tile').forEach(tile => {
                tile.classList.remove('ring-2', 'ring-[#009cf0]', 'bg-blue-50/50');
            });

            renderDynamicCategoryFilters();
            setCity('all');
            checkResetButtonVisibility();
            renderPosts();
        }

        async function fetchPosts() {
            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                posts = data || [];
                
                document.getElementById('loadingSkeleton').classList.add('hidden');
                const container = document.getElementById('postsContainer');
                container.classList.remove('hidden');
                container.classList.add('grid');

                updateBadges();
                renderPosts();
            } catch (err) {
                console.error(err);
                document.getElementById('loadingSkeleton').innerHTML = '<div class="col-span-full text-center text-xs text-rose-500 py-10">Ошибка загрузки базы данных.</div>';
            }
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const emptyState = document.getElementById('emptyState');
            const sortBy = document.getElementById('sortSelect').value;
            const countText = document.getElementById('resultsCountText');

            let filtered = posts.filter(post => {
                const postIdStr = String(post.id);
                if (selectedCity !== 'all' && post.city !== selectedCity) return false;
                if (selectedCategory !== 'all' && post.category !== selectedCategory) return false;
                
                if (selectedCategory !== 'all') {
                    const postAttrs = post.attributes || {};
                    for (const [key, val] of Object.entries(categoryFiltersState)) {
                        if (postAttrs[key] !== val) return false;
                    }
                }

                if (showOnlyFavorites && !favorites.includes(postIdStr)) return false;
                if (showOnlyMyPosts && !isMyPost(post)) return false;
                if (showOnlyFree && Number(post.price || 0) > 0) return false;
                if (searchQuery && !post.title.toLowerCase().includes(searchQuery) && !(post.description && post.description.toLowerCase().includes(searchQuery))) return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'cheap') return (a.price || 0) - (b.price || 0);
                if (sortBy === 'expensive') return (b.price || 0) - (a.price || 0);
                return new Date(b.created_at || 0) - new Date(a.created_at || 0);
            });

            countText.innerText = dict[currentLang].foundCount(filtered.length);

            if (filtered.length === 0) {
                container.innerHTML = '';
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.classList.remove('hidden');

            const citiesMap = dict[currentLang].cities;
            const now = new Date();

            container.innerHTML = filtered.map(post => {
                const postIdStr = String(post.id);
                const isFav = favorites.includes(postIdStr);
                const isMine = isMyPost(post);
                const cityName = citiesMap[post.city] || post.city;
                const priceText = post.price > 0 ? `${post.price} €` : dict[currentLang].free;
                
                let rawImage = post.image_url || (post.images && post.images[0]);
                const hasValidImage = rawImage && rawImage.trim() !== '' && !rawImage.includes('images.unsplash.com') && !rawImage.startsWith('data:image/svg+xml');

                const imageBlock = hasValidImage 
                    ? `<img src="${rawImage}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${post.title}">`
                    : `<div class="w-full h-full bg-gradient-to-br from-blue-500/10 via-indigo-500/10 to-purple-500/10 flex flex-col items-center justify-center text-gray-400 group-hover:scale-105 transition-transform duration-500">
                           <div class="w-12 h-12 rounded-2xl bg-white/80 shadow-sm flex items-center justify-center text-[#009cf0] mb-1">
                               <i data-lucide="briefcase" class="w-6 h-6"></i>
                           </div>
                           <span class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">${dict[currentLang].noPhoto}</span>
                       </div>`;
                
                const isNew = post.created_at && (now - new Date(post.created_at) < 48 * 3600 * 1000);

                return `
                    <div onclick="window.location.href='post.html?id=${post.id}'" class="bg-white rounded-2xl border border-gray-200/70 hover:border-gray-300 overflow-hidden shadow-xs hover:shadow-lg transition-all duration-200 cursor-pointer flex flex-col group relative animate-fade-in">
                        <div class="relative aspect-square bg-gray-50 overflow-hidden flex items-center justify-center">
                            ${imageBlock}
                            
                            <div class="absolute top-2.5 left-2.5 flex flex-col gap-1 pointer-events-none">
                                ${isNew ? `<span class="bg-[#009cf0] text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded-md shadow-sm w-fit">${dict[currentLang].newBadge}</span>` : ''}
                                ${isMine ? `<span class="bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-md shadow-sm w-fit">${dict[currentLang].myBadgeText}</span>` : ''}
                            </div>

                            <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5 z-10">
                                ${isMine ? `
                                    <button onclick="openEditModal(event, '${post.id}')" title="${dict[currentLang].editPost}" class="bg-white/90 hover:bg-[#009cf0] hover:text-white text-gray-700 p-2 rounded-full backdrop-blur-sm transition-all cursor-pointer shadow-sm active:scale-90">
                                        <i data-lucide="pencil" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="openDeleteModal(event, '${post.id}')" title="${dict[currentLang].deletePost}" class="bg-white/90 hover:bg-rose-600 hover:text-white text-rose-600 p-2 rounded-full backdrop-blur-sm transition-all cursor-pointer shadow-sm active:scale-90">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                ` : ''}
                                <button onclick="toggleFavorite(event, '${post.id}')" class="bg-white/90 hover:bg-white p-2 rounded-full backdrop-blur-sm transition-all cursor-pointer shadow-sm active:scale-90">
                                    <svg class="w-4 h-4 ${isFav ? 'text-rose-500 fill-rose-500' : 'text-gray-600'}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                </button>
                            </div>
                        </div>

                        <div class="p-3.5 flex flex-col flex-1 justify-between gap-3">
                            <div>
                                <span class="font-extrabold text-gray-950 text-base block group-hover:text-[#009cf0] transition-colors">${priceText}</span>
                                <h3 class="font-medium text-gray-800 text-xs sm:text-sm line-clamp-2 mt-1">${post.title}</h3>
                            </div>
                            <div class="space-y-1">
                                <div class="flex items-center gap-1 text-[11px] text-gray-400">
                                    <i data-lucide="map-pin" class="w-3 h-3 shrink-0"></i>
                                    <span class="truncate">${cityName}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        fetchPosts();

        const header = document.querySelector('header');
        const scrollThreshold = 50;

        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop <= 10) {
                header.style.transform = 'translateY(0)';
            } else if (scrollTop > scrollThreshold) {
                header.style.transform = 'translateY(-100%)';
            }
        }, { passive: true });
    </script>
</body>
</html>
