<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Доска объявлений в Черногории</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[#f5f6f8] text-gray-900 pb-28 selection:bg-[#009cf0] selection:text-white antialiased">

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none flex items-center gap-2">
        <span id="toastText"></span>
    </div>

    <!-- Модалка удаления -->
    <div id="deleteModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden items-center justify-center p-4 transition-all">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 animate-fade-in">
            <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center mx-auto">
                <i data-lucide="trash-2" class="w-6 h-6"></i>
            </div>
            <div class="text-center space-y-1">
                <h3 class="font-bold text-gray-950 text-base" data-i18n="modalDeleteTitle"></h3>
                <p class="text-xs text-gray-500" data-i18n="modalDeleteDesc"></p>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeDeleteModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-2xl text-xs transition-all cursor-pointer" data-i18n="cancelBtn"></button>
                <button id="confirmDeleteBtn" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-2xl text-xs transition-all shadow-sm shadow-rose-500/20 cursor-pointer" data-i18n="deleteBtn"></button>
            </div>
        </div>
    </div>

    <!-- Модалка авторизации / регистрации (Строгая проверка) -->
    <div id="authModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4 transition-all">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-5 animate-fade-in">
            <div class="flex items-center justify-between pb-2 border-b border-gray-100">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🇲🇪</span>
                    <h3 class="font-bold text-gray-950 text-base" data-i18n="authModalTitle">Требуется регистрация</h3>
                </div>
            </div>
            <div class="space-y-3">
                <p class="text-xs text-gray-500 leading-relaxed" data-i18n="authModalDesc">Чтобы разместить объявление и управлять им, пожалуйста, укажите ваш Email или Telegram.</p>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="authIdentifierLabel">Email или @telegram</label>
                    <input type="text" id="authInput" placeholder="user@example.com или @username" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-[#009cf0] focus:bg-white transition-all">
                </div>
            </div>
            <div class="pt-2">
                <button onclick="submitAuth()" class="w-full bg-[#009cf0] hover:bg-[#0089d1] text-white font-semibold py-3.5 rounded-2xl text-xs transition-all shadow-sm cursor-pointer" data-i18n="authSubmitBtn">Продолжить</button>
            </div>
        </div>
    </div>

    <!-- Модалка личного кабинета -->
    <div id="profileModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden items-center justify-center p-4 transition-all">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-5 animate-fade-in">
            <div class="flex items-center justify-between pb-2 border-b border-gray-100">
                <div class="flex items-center gap-2">
                    <div class="w-9 h-9 bg-blue-50 text-[#009cf0] rounded-xl flex items-center justify-center font-bold">👤</div>
                    <div>
                        <h3 class="font-bold text-gray-950 text-sm" data-i18n="profileModalTitle">Личный кабинет</h3>
                        <p id="profileUserSub" class="text-[11px] text-gray-400 truncate max-w-[180px]"></p>
                    </div>
                </div>
                <button onclick="closeProfileModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-xl cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-3">
                <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100 space-y-2">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-gray-500" data-i18n="profileActiveAds">Ваших объявлений:</span>
                        <span id="profileAdsCount" class="font-bold text-gray-900">0</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-gray-500" data-i18n="profileTokenLabel">Идентификатор:</span>
                        <span id="profileTokenShort" class="font-mono text-[10px] text-gray-600 bg-gray-200/60 px-2 py-0.5 rounded"></span>
                    </div>
                </div>
                <button onclick="logoutAccount()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold py-3 rounded-xl text-xs transition-all cursor-pointer flex items-center justify-center gap-2">
                    <i data-lucide="log-out" class="w-4 h-4"></i> <span data-i18n="logoutBtn">Выйти из аккаунта</span>
                </button>
            </div>
            <div class="pt-2">
                <button onclick="closeProfileModal()" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-semibold py-3 rounded-2xl text-xs transition-all cursor-pointer" data-i18n="closeBtn">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Модалка редактирования -->
    <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden items-center justify-center p-4 transition-all overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 animate-fade-in my-auto max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-2 border-b border-gray-100">
                <h3 class="font-bold text-gray-950 text-base" data-i18n="modalEditTitle">Редактировать объявление</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-xl cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="editForm" onsubmit="submitEditPost(event)" class="space-y-4">
                <input type="hidden" id="editPostId">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="nameLabel">Название</label>
                    <input type="text" id="editTitle" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-[#009cf0] focus:bg-white transition-all">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="categoryLabel">Категория</label>
                        <select id="editCategory" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-[#009cf0] focus:bg-white transition-all cursor-pointer">
                            <option value="auto" data-i18n="cat_auto">Авто</option>
                            <option value="realestate" data-i18n="cat_realestate">Недвижимость</option>
                            <option value="furniture" data-i18n="cat_furniture">Мебель</option>
                            <option value="tech" data-i18n="cat_tech">Электроника</option>
                            <option value="clothes" data-i18n="cat_clothes">Одежда</option>
                            <option value="other" data-i18n="cat_other">Разное</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="cityLabel">Город</label>
                        <select id="editCity" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-[#009cf0] focus:bg-white transition-all cursor-pointer">
                            <option value="budva">Будва</option>
                            <option value="bar">Бар</option>
                            <option value="tivat">Тиват</option>
                            <option value="podgorica">Подгорица</option>
                            <option value="kotor">Котор</option>
                            <option value="herceg_novi">Херцег-Нови</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="priceLabel">Цена (€)</label>
                    <input type="number" id="editPrice" required min="0" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-[#009cf0] focus:bg-white transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="descLabel">Описание</label>
                    <textarea id="editDesc" rows="4" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm outline-none focus:border-[#009cf0] focus:bg-white transition-all resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1" data-i18n="tgLabel">Telegram для связи</label>
                    <input type="text" id="editTelegram" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-[#009cf0] focus:bg-white transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2" data-i18n="photosLabel">Фотографии (до 5 шт.)</label>
                    <input type="file" id="editImageInput" accept="image/*" multiple class="hidden" onchange="handleEditImageSelection(event)">
                    <div id="editImagePreviewsContainer" class="grid grid-cols-5 gap-2 mb-2"></div>
                    <button type="button" onclick="document.getElementById('editImageInput').click()" class="w-full border-2 border-dashed border-gray-200 hover:border-[#009cf0] bg-gray-50 hover:bg-blue-50/50 rounded-2xl p-4 text-center transition-all cursor-pointer flex items-center justify-center gap-2">
                        <i data-lucide="image-plus" class="w-5 h-5 text-gray-400"></i>
                        <span class="text-xs font-semibold text-gray-600" data-i18n="addPhotoBtn">Добавить фото</span>
                    </button>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-2xl text-xs transition-all cursor-pointer" data-i18n="cancelBtn"></button>
                    <button type="submit" id="submitEditBtn" class="flex-1 bg-[#009cf0] hover:bg-[#0089d1] text-white font-semibold py-3 rounded-2xl text-xs transition-all shadow-sm cursor-pointer" data-i18n="saveBtn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <header class="bg-white border-b border-gray-200/80 sticky top-0 z-35 transition-transform duration-300 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-2 sm:gap-3">
            <a href="index.html" class="flex items-center gap-2 font-black text-lg text-gray-950 shrink-0 tracking-tight group">
                <span class="text-xl group-hover:scale-110 transition-transform">🇲🇪</span> 
                <span class="hidden sm:inline text-gray-900">MNE<span class="text-[#009cf0]">Market</span></span>
            </a>
            <div class="flex-1 max-w-xl relative flex items-center min-w-[120px] sm:min-w-[200px]">
                <div class="relative w-full flex items-center bg-gray-100 hover:bg-gray-200/60 focus-within:bg-white focus-within:ring-2 focus-within:ring-[#009cf0] border border-transparent rounded-xl transition-all">
                    <input type="text" id="searchInput" oninput="handleSearchInput(event)" placeholder="" class="w-full bg-transparent pl-3 sm:pl-4 pr-8 sm:pr-10 py-2 text-xs sm:text-sm outline-none text-gray-900 placeholder:text-gray-400">
                    <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 text-gray-400 hover:text-gray-600 cursor-pointer">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <button onclick="performSearchClick()" class="ml-2 bg-[#009cf0] hover:bg-[#0089d1] text-white font-medium px-4 py-2 rounded-xl text-sm transition-all shadow-sm shrink-0 cursor-pointer hidden md:block" data-i18n="searchBtn"></button>
            </div>
            <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <button onclick="toggleMyPostsFilter()" id="myPostsHeaderBtn" class="relative flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition-all cursor-pointer">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span id="myPostsCountBadge" class="absolute -top-1 -right-1 bg-[#009cf0] text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-bold hidden shadow-sm animate-fade-in">0</span>
                </button>
                <button onclick="toggleFavoritesFilter()" id="favoritesHeaderBtn" class="relative flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition-all cursor-pointer">
                    <i data-lucide="heart" class="w-4 h-4 text-rose-500"></i>
                    <span id="favoritesCountBadge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-bold hidden shadow-sm animate-fade-in">0</span>
                </button>
                <button onclick="openProfileOrAuth()" id="profileHeaderBtn" class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition-all cursor-pointer" title="Личный кабинет">
                    <i data-lucide="shield" class="w-4 h-4"></i>
                </button>
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-1.5 sm:px-2 py-2 text-[11px] sm:text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                    <option value="cnr">CNR</option>
                </select>
                <button onclick="checkAuthBeforeCreate(event)" class="bg-[#009cf0] hover:bg-[#0089d1] active:scale-95 text-white font-medium px-2.5 sm:px-4 py-2 rounded-xl text-[11px] sm:text-sm transition-all shadow-sm shadow-blue-500/20 flex items-center gap-1 shrink-0 cursor-pointer">
                    <i data-lucide="plus" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i> <span data-i18n="postAd">Разместить</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-6 space-y-5">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
            <div onclick="setCategory(event, 'auto')" class="category-tile bg-white hover:bg-blue-50/40 border border-gray-200/80 hover:border-blue-300 rounded-2xl p-3.5 transition-all cursor-pointer flex flex-col justify-between h-28 group relative overflow-hidden shadow-xs">
                <span class="text-xs font-bold text-gray-900 group-hover:text-[#009cf0] transition-colors" data-i18n="cat_auto"></span>
                <div class="self-end text-2xl group-hover:scale-110 transition-transform">🚗</div>
            </div>
            <div onclick="setCategory(event, 'realestate')" class="category-tile bg-white hover:bg-blue-50/40 border border-gray-200/80 hover:border-blue-300 rounded-2xl p-3.5 transition-all cursor-pointer flex flex-col justify-between h-28 group relative overflow-hidden shadow-xs">
                <span class="text-xs font-bold text-gray-900 group-hover:text-[#009cf0] transition-colors" data-i18n="cat_realestate"></span>
                <div class="self-end text-2xl group-hover:scale-110 transition-transform">🏢</div>
            </div>
            <div onclick="setCategory(event, 'furniture')" class="category-tile bg-white hover:bg-blue-50/40 border border-gray-200/80 hover:border-blue-300 rounded-2xl p-3.5 transition-all cursor-pointer flex flex-col justify-between h-28 group relative overflow-hidden shadow-xs">
                <span class="text-xs font-bold text-gray-900 group-hover:text-[#009cf0] transition-colors" data-i18n="cat_furniture"></span>
                <div class="self-end text-2xl group-hover:scale-110 transition-transform">🛋️</div>
            </div>
            <div onclick="setCategory(event, 'tech')" class="category-tile bg-white hover:bg-blue-50/40 border border-gray-200/80 hover:border-blue-300 rounded-2xl p-3.5 transition-all cursor-pointer flex flex-col justify-between h-28 group relative overflow-hidden shadow-xs">
                <span class="text-xs font-bold text-gray-900 group-hover:text-[#009cf0] transition-colors" data-i18n="cat_tech"></span>
                <div class="self-end text-2xl group-hover:scale-110 transition-transform">📱</div>
            </div>
            <div onclick="setCategory(event, 'clothes')" class="category-tile bg-white hover:bg-blue-50/40 border border-gray-200/80 hover:border-blue-300 rounded-2xl p-3.5 transition-all cursor-pointer flex flex-col justify-between h-28 group relative overflow-hidden shadow-xs">
                <span class="text-xs font-bold text-gray-900 group-hover:text-[#009cf0] transition-colors" data-i18n="cat_clothes"></span>
                <div class="self-end text-2xl group-hover:scale-110 transition-transform">👕</div>
            </div>
            <div onclick="setCategory(event, 'other')" class="category-tile bg-white hover:bg-blue-50/40 border border-gray-200/80 hover:border-blue-300 rounded-2xl p-3.5 transition-all cursor-pointer flex flex-col justify-between h-28 group relative overflow-hidden shadow-xs">
                <span class="text-xs font-bold text-gray-900 group-hover:text-[#009cf0] transition-colors" data-i18n="cat_other"></span>
                <div class="self-end text-2xl group-hover:scale-110 transition-transform">📦</div>
            </div>
        </div>

        <div id="myPostsBanner" class="hidden bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200/70 rounded-2xl p-4 items-center justify-between text-blue-950 shadow-sm animate-fade-in">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#009cf0] text-white rounded-xl flex items-center justify-center shrink-0 shadow-sm">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
                <div>
                    <h4 class="text-xs font-bold" data-i18n="myPostsModeTitle"></h4>
                    <p class="text-[11px] text-blue-700 mt-0.5" data-i18n="myPostsModeDesc"></p>
                </div>
            </div>
            <button onclick="toggleMyPostsFilter()" class="bg-white hover:bg-blue-50 text-blue-700 text-xs font-bold px-3.5 py-2 rounded-xl border border-blue-200 shadow-xs transition-all cursor-pointer" data-i18n="closeMode"></button>
        </div>

        <div class="bg-white rounded-2xl p-3.5 sm:p-4 border border-gray-200/80 shadow-xs space-y-3">
            <div class="relative flex items-center">
                <button id="scrollLeftBtn" onclick="scrollCitiesLeft()" class="absolute left-0 z-10 bg-gradient-to-r from-white via-white to-white/60 pr-5 pl-1.5 h-full flex items-center text-gray-600 hover:text-gray-900 cursor-pointer transition-opacity opacity-0 pointer-events-none">
                    <div class="bg-gray-100 hover:bg-gray-200 shadow-sm rounded-full p-1.5 flex items-center justify-center">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </div>
                </button>
                <div id="citiesContainer" onscroll="checkCityScroll()" class="flex items-center gap-1.5 overflow-x-auto scrollbar-none px-1 w-full py-0.5 scroll-smooth">
                    <button onclick="setCity('all')" class="city-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-900 text-white shadow-xs shrink-0" data-city="all" data-i18n="allCities"></button>
                    <button onclick="setCity('budva')" class="city-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 shrink-0" data-city="budva">Будва</button>
                    <button onclick="setCity('bar')" class="city-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 shrink-0" data-city="bar">Бар</button>
                    <button onclick="setCity('tivat')" class="city-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 shrink-0" data-city="tivat">Тиват</button>
                    <button onclick="setCity('podgorica')" class="city-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 shrink-0" data-city="podgorica">Подгорица</button>
                    <button onclick="setCity('kotor')" class="city-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 shrink-0" data-city="kotor">Котор</button>
                    <button onclick="setCity('herceg_novi')" class="city-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 shrink-0" data-city="herceg_novi">Херцег-Нови</button>
                </div>
                <button id="scrollRightBtn" onclick="scrollCitiesRight()" class="absolute right-0 z-10 bg-gradient-to-l from-white via-white to-white/60 pl-5 pr-1.5 h-full flex items-center text-gray-600 hover:text-gray-900 cursor-pointer transition-opacity">
                    <div class="bg-gray-100 hover:bg-gray-200 shadow-sm rounded-full p-1.5 flex items-center justify-center">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </div>
                </button>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                <div class="flex items-center gap-2">
                    <button id="freeFilterBtn" onclick="toggleFreeFilter()" class="text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-xl transition-all cursor-pointer flex items-center gap-1.5 shrink-0">
                        <i data-lucide="gift" class="w-3.5 h-3.5 text-emerald-600"></i> <span data-i18n="freeOnly"></span>
                    </button>

        async function submitEditPost(event) {
            event.preventDefault();
            const id = document.getElementById('editPostId').value;
            const submitBtn = document.getElementById('submitEditBtn');
            submitBtn.disabled = true;

            try {
                let imageUrls = [...existingEditImages];

                for (const file of editImages) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                    const { error: uploadError } = await supabaseClient.storage.from('post-images').upload(fileName, file);
                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = supabaseClient.storage.from('post-images').getPublicUrl(fileName);
                    imageUrls.push(publicUrlData.publicUrl);
                }

                if (imageUrls.length === 0) {
                    imageUrls.push('https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
                }

                const updatedData = {
                    title: document.getElementById('editTitle').value.trim(),
                    category: document.getElementById('editCategory').value,
                    city: document.getElementById('editCity').value,
                    price: Number(document.getElementById('editPrice').value || 0),
                    description: document.getElementById('editDesc').value.trim(),
                    telegram: document.getElementById('editTelegram').value.trim(),
                    contact: document.getElementById('editTelegram').value.trim(),
                    images: imageUrls,
                    image_url: imageUrls[0]
                };

                const { error } = await supabaseClient.from('posts').update(updatedData).eq('id', id);
                if (error) throw error;

                closeEditModal();
                showToast(dict[currentLang].confirmEdit);
                await fetchPosts();
            } catch (err) {
                console.error(err);
                showToast('Ошибка сохранения');
            } finally {
                submitBtn.disabled = false;
            }
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!postToDeleteId) return;
            const id = postToDeleteId;
            closeDeleteModal();

            try {
                const { error } = await supabaseClient.from('posts').delete().eq('id', id);
                if (error) throw error;

                posts = posts.filter(p => p.id !== id);
                myLocalPostIds = myLocalPostIds.filter(item => String(item) !== String(id));
                localStorage.setItem('mne_my_posts', JSON.stringify(myLocalPostIds));

                showToast(dict[currentLang].confirmDelete);
                updateBadges();
                renderPosts();
            } catch (err) {
                console.error(err);
                showToast('Ошибка удаления');
            }
        });

        function setCity(city) {
            selectedCity = city;
            document.querySelectorAll('.city-btn').forEach(btn => {
                if (btn.getAttribute('data-city') === city) {
                    btn.className = "city-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-900 text-white shadow-xs shrink-0";
                } else {
                    btn.className = "city-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 shrink-0";
                }
            });
            checkResetButtonVisibility();
            renderPosts();
        }

        function setCategory(e, cat) {
            if (selectedCategory === cat) {
                selectedCategory = 'all';
            } else {
                selectedCategory = cat;
            }

            document.querySelectorAll('.category-tile').forEach(tile => {
                tile.classList.remove('ring-2', 'ring-[#009cf0]', 'bg-blue-50/50');
            });

            if (selectedCategory !== 'all' && e && e.currentTarget) {
                e.currentTarget.classList.add('ring-2', 'ring-[#009cf0]', 'bg-blue-50/50');
            }

            checkResetButtonVisibility();
            renderPosts();
        }

        function handleSearchInput(e) {
            const val = e.target.value;
            searchQuery = val.toLowerCase().trim();
            const clearBtn = document.getElementById('clearSearchBtn');
            if (val.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                checkResetButtonVisibility();
                renderPosts();
            }, 200);
        }

        function performSearchClick() {
            checkResetButtonVisibility();
            renderPosts();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            checkResetButtonVisibility();
            renderPosts();
        }

        function checkResetButtonVisibility() {
            const resetBtn = document.getElementById('resetFiltersBtn');
            if (selectedCity !== 'all' || selectedCategory !== 'all' || searchQuery !== '' || showOnlyFavorites || showOnlyMyPosts || showOnlyFree) {
                resetBtn.classList.remove('hidden');
                resetBtn.classList.add('flex');
            } else {
                resetBtn.classList.add('hidden');
                resetBtn.classList.remove('flex');
            }
        }

        function resetAllFilters() {
            selectedCity = 'all';
            selectedCategory = 'all';
            searchQuery = '';
            showOnlyFavorites = false;
            showOnlyMyPosts = false;
            showOnlyFree = false;
            const input = document.getElementById('searchInput');
            input.value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            document.getElementById('favoritesHeaderBtn').classList.remove('bg-rose-50', 'border', 'border-rose-200');
            document.getElementById('myPostsHeaderBtn').classList.remove('bg-blue-50', 'border', 'border-blue-200');
            document.getElementById('myPostsBanner').classList.add('hidden');
            document.getElementById('freeFilterBtn').classList.remove('bg-emerald-50', 'border', 'border-emerald-200', 'text-emerald-700');
            
            document.querySelectorAll('.category-tile').forEach(tile => {
                tile.classList.remove('ring-2', 'ring-[#009cf0]', 'bg-blue-50/50');
            });

            setCity('all');
            checkResetButtonVisibility();
            renderPosts();
        }

        async function fetchPosts() {
            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                posts = data || [];
                
                document.getElementById('loadingSkeleton').classList.add('hidden');
                const container = document.getElementById('postsContainer');
                container.classList.remove('hidden');
                container.classList.add('grid');

                updateBadges();
                renderPosts();
            } catch (err) {
                console.error(err);
                document.getElementById('loadingSkeleton').innerHTML = '<div class="col-span-full text-center text-xs text-rose-500 py-10">Ошибка загрузки базы данных.</div>';
            }
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const emptyState = document.getElementById('emptyState');
            const sortBy = document.getElementById('sortSelect').value;
            const countText = document.getElementById('resultsCountText');

            let filtered = posts.filter(post => {
                const postIdStr = String(post.id);
                if (selectedCity !== 'all' && post.city !== selectedCity) return false;
                if (selectedCategory !== 'all' && post.category !== selectedCategory) return false;
                if (showOnlyFavorites && !favorites.includes(postIdStr)) return false;
                if (showOnlyMyPosts && !isMyPost(post)) return false;
                if (showOnlyFree && Number(post.price || 0) > 0) return false;
                if (searchQuery && !post.title.toLowerCase().includes(searchQuery) && !(post.description && post.description.toLowerCase().includes(searchQuery))) return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'cheap') return (a.price || 0) - (b.price || 0);
                if (sortBy === 'expensive') return (b.price || 0) - (a.price || 0);
                return new Date(b.created_at || 0) - new Date(a.created_at || 0);
            });

            countText.innerText = dict[currentLang].foundCount(filtered.length);

            if (filtered.length === 0) {
                container.innerHTML = '';
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.classList.remove('hidden');

            const citiesMap = dict[currentLang].cities;
            const now = new Date();

            container.innerHTML = filtered.map(post => {
                const postIdStr = String(post.id);
                const isFav = favorites.includes(postIdStr);
                const isMine = isMyPost(post);
                const cityName = citiesMap[post.city] || post.city;
                const priceText = post.price > 0 ? `${post.price} €` : dict[currentLang].free;
                
                let rawImage = post.image_url || (post.images && post.images[0]);
                const hasValidImage = rawImage && rawImage.trim() !== '' && !rawImage.includes('images.unsplash.com') && !rawImage.startsWith('data:image/svg+xml');

                const imageBlock = hasValidImage 
                    ? `<img src="${rawImage}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${post.title}">`
                    : `<div class="w-full h-full bg-gradient-to-br from-blue-500/10 via-indigo-500/10 to-purple-500/10 flex flex-col items-center justify-center text-gray-400 group-hover:scale-105 transition-transform duration-500">
                           <div class="w-12 h-12 rounded-2xl bg-white/80 shadow-sm flex items-center justify-center text-[#009cf0] mb-1">
                               <i data-lucide="briefcase" class="w-6 h-6"></i>
                           </div>
                           <span class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">${dict[currentLang].noPhoto}</span>
                       </div>`;
                
                const isNew = post.created_at && (now - new Date(post.created_at) < 48 * 3600 * 1000);

                return `
                    <div onclick="window.location.href='post.html?id=${post.id}'" class="bg-white rounded-2xl border border-gray-200/70 hover:border-gray-300 overflow-hidden shadow-xs hover:shadow-lg transition-all duration-200 cursor-pointer flex flex-col group relative animate-fade-in">
                        <div class="relative aspect-square bg-gray-50 overflow-hidden flex items-center justify-center">
                            ${imageBlock}
                            
                            <div class="absolute top-2.5 left-2.5 flex flex-col gap-1 pointer-events-none">
                                ${isNew ? `<span class="bg-[#009cf0] text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded-md shadow-sm w-fit">${dict[currentLang].newBadge}</span>` : ''}
                                ${isMine ? `<span class="bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-md shadow-sm w-fit">${dict[currentLang].myBadgeText}</span>` : ''}
                            </div>

                            <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5 z-10">
                                ${isMine ? `
                                    <button onclick="openEditModal(event, '${post.id}')" title="${dict[currentLang].editPost}" class="bg-white/90 hover:bg-[#009cf0] hover:text-white text-gray-700 p-2 rounded-full backdrop-blur-sm transition-all cursor-pointer shadow-sm active:scale-90">
                                        <i data-lucide="pencil" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="openDeleteModal(event, '${post.id}')" title="${dict[currentLang].deletePost}" class="bg-white/90 hover:bg-rose-600 hover:text-white text-rose-600 p-2 rounded-full backdrop-blur-sm transition-all cursor-pointer shadow-sm active:scale-90">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                ` : ''}
                                <button onclick="toggleFavorite(event, '${post.id}')" class="bg-white/90 hover:bg-white p-2 rounded-full backdrop-blur-sm transition-all cursor-pointer shadow-sm active:scale-90">
                                    <svg class="w-4 h-4 ${isFav ? 'text-rose-500 fill-rose-500' : 'text-gray-600'}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                </button>
                            </div>
                        </div>

                        <div class="p-3.5 flex flex-col flex-1 justify-between gap-3">
                            <div>
                                <span class="font-extrabold text-gray-950 text-base block group-hover:text-[#009cf0] transition-colors">${priceText}</span>
                                <h3 class="font-medium text-gray-800 text-xs sm:text-sm line-clamp-2 mt-1">${post.title}</h3>
                            </div>
                            <div class="space-y-1">
                                <div class="flex items-center gap-1 text-[11px] text-gray-400">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i><span>${cityName}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        fetchPosts();

        let lastScrollTop = 0;
        const header = document.querySelector('header');
        const scrollThreshold = 50;

        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > scrollThreshold) {
                header.style.transform = 'translateY(-100%)';
            } else {
                header.style.transform = 'translateY(0)';
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }, { passive: true });
    </script>
</body>
</html>
