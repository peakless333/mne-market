<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Classifieds Montenegro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-16">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-gray-900">
                <span>🇲🇪</span>
                <span>MNE Market</span>
            </a>

            <div class="flex items-center gap-3">
                <button class="flex items-center gap-1 text-xs font-semibold bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-lg transition-colors">
                    <span>🇬🇧 EN</span>
                </button>
                <a href="create.html" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-4 py-2 rounded-lg flex items-center gap-1.5 transition-colors shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Sell</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Search & Filters -->
    <section class="max-w-6xl mx-auto px-4 pt-6 pb-2">
        <div class="flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="searchInput" oninput="filterPosts()" placeholder="Search announcements..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- City Dropdown (English) -->
            <select id="cityFilter" onchange="filterPosts()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="all">All cities</option>
                <option value="Budva">Budva</option>
                <option value="Bar">Bar</option>
                <option value="Tivat">Tivat</option>
                <option value="Podgorica">Podgorica</option>
                <option value="Kotor">Kotor</option>
                <option value="Herceg Novi">Herceg Novi</option>
            </select>

            <!-- Category Dropdown -->
            <select id="categoryFilter" onchange="filterPosts()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="all">All categories</option>
                <option value="Мебель">Furniture</option>
                <option value="Электроника">Electronics</option>
                <option value="Одежда">Clothing</option>
                <option value="Транспорт">Vehicles</option>
                <option value="Услуги">Services</option>
                <option value="Разное">Other</option>
            </select>
        </div>
    </section>

    <!-- Posts Grid -->
    <main class="max-w-6xl mx-auto px-4 pt-6">
        <div id="postsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center text-gray-400 py-12">Loading posts...</div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjgxNzYsImV4cCI6MjEwMTQ0NDE3Nn0.17Gx37ZpxkJPNICCISTZHOdbflbmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allPosts = [];

        async function loadPosts() {
            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching posts:', error);
                document.getElementById('postsGrid').innerHTML = `<div class="col-span-full text-center text-red-500 py-12">Failed to load posts</div>`;
                return;
            }

            allPosts = data || [];
            renderPosts(allPosts);
        }

        function renderPosts(posts) {
            const grid = document.getElementById('postsGrid');

            if (posts.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12">No announcements found</div>`;
                return;
            }

            grid.innerHTML = posts.map(post => {
                const isFree = Number(post.price) === 0;
                const priceTag = isFree ? `<span class="font-bold text-emerald-600">Free</span>` : `<span class="font-bold text-blue-600">${post.price} €</span>`;
                
                let img = 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500';
                if (Array.isArray(post.images) && post.images.length > 0) {
                    img = post.images[0];
                } else if (post.image_url) {
                    img = post.image_url;
                }

                return `
                    <a href="post.html?id=${post.id}" class="bg-white rounded-xl border border-gray-200 overflow-hidden hover:shadow-md transition-shadow flex flex-col group">
                        <div class="h-48 bg-gray-100 overflow-hidden relative">
                            <img src="${img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${post.title}">
                            <span class="absolute top-2 left-2 bg-white/90 backdrop-blur-sm text-xs font-semibold px-2 py-0.5 rounded-md text-gray-700">${post.category || 'Other'}</span>
                        </div>
                        <div class="p-4 flex flex-col justify-between flex-1">
                            <div>
                                <h3 class="font-semibold text-gray-900 group-hover:text-blue-600 transition-colors line-clamp-1 mb-1">${post.title}</h3>
                                <div class="flex items-center gap-1 text-gray-400 text-xs mb-3">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                                    <span>${post.city}</span>
                                </div>
                            </div>
                            <div class="text-lg">${priceTag}</div>
                        </div>
                    </a>
                `;
            }).join('');

            lucide.createIcons();
        }

        function filterPosts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const city = document.getElementById('cityFilter').value;
            const category = document.getElementById('categoryFilter').value;

            const filtered = allPosts.filter(post => {
                const matchesSearch = post.title.toLowerCase().includes(search) || (post.description && post.description.toLowerCase().includes(search));
                
                // Сравнение городов (без учета регистра)
                const matchesCity = city === 'all' || post.city.toLowerCase() === city.toLowerCase();
                const matchesCategory = category === 'all' || post.category === category;

                return matchesSearch && matchesCity && matchesCategory;
            });

            renderPosts(filtered);
        }

        loadPosts();
    </script>
</body>
</html>
