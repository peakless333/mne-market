<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNE Market — Доска объявлений</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo">MNE Market</a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по объявлениям...">
        <button id="searchBtn">Найти</button>
      </div>
      <div class="header-actions">
        <a href="create.html" class="btn-primary">+ Разместить</a>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <aside class="sidebar">
      <h3>Категории</h3>
      <ul class="category-list" id="categoryList">
        <li class="category-item active" data-category="">Все категории</li>
        <li class="category-item" data-category="Электроника">Электроника</li>
        <li class="category-item" data-category="Транспорт">Транспорт</li>
        <li class="category-item" data-category="Недвижимость">Недвижимость</li>
        <li class="category-item" data-category="Работа">Работа</li>
        <li class="category-item" data-category="Личные вещи">Личные вещи</li>
      </ul>
    </aside>

    <main class="content-area">
      <h2 id="currentCategoryTitle" style="font-size: 20px;">Рекомендации для вас</h2>
      <div class="products-grid" id="productsGrid">
        <p>Загрузка объявлений...</p>
      </div>
    </main>
  </div>

  <script src="supabase.js"></script>
  <script>
    let selectedCategory = '';

    async function fetchAds(searchQuery = '') {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '<p>Загрузка...</p>';

      let query = supabase.from('ads').select('*').order('id', { ascending: false });

      if (selectedCategory) {
        query = query.eq('category', selectedCategory);
      }

      if (searchQuery) {
        query = query.ilike('title', `%${searchQuery}%`);
      }

      const { data, error } = await query;

      if (error) {
        console.error(error);
        grid.innerHTML = '<p>Ошибка при загрузке данных из базы.</p>';
        return;
      }

      if (!data || data.length === 0) {
        grid.innerHTML = '<p>Объявлений не найдено.</p>';
        return;
      }

      grid.innerHTML = '';
      data.forEach(ad => {
        const card = document.createElement('a');
        card.href = `post.html?id=${ad.id}`;
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-img-wrap">
            <img src="${ad.image_url || 'https://via.placeholder.com/220x180?text=MNE+Market'}" alt="${ad.title}">
          </div>
          <div class="product-info">
            <div class="product-price">€${Number(ad.price).toLocaleString()}</div>
            <div class="product-title">${ad.title}</div>
            <div class="product-location">${ad.location || 'Город не указан'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.querySelectorAll('.category-item').forEach(item => {
      item.addEventListener('click', (e) => {
        document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
        e.target.classList.add('active');
        selectedCategory = e.target.getAttribute('data-category');
        document.getElementById('currentCategoryTitle').textContent = selectedCategory || 'Рекомендации для вас';
        fetchAds(document.getElementById('searchInput').value);
      });
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
      fetchAds(document.getElementById('searchInput').value);
    });

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchAds(e.target.value);
    });

    fetchAds();
  </script>
</body>
</html>
