<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNE Market — Доска объявлений Черногории</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇲🇪</text></svg>">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Шапка сайта -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <span class="text-2xl">🇲🇪</span>
                <h1 class="font-bold text-xl text-gray-900 tracking-tight">MNE Market</h1>
            </a>
            
            <div class="flex items-center gap-2">
                <!-- Переключатель языка -->
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border-none rounded-xl px-2.5 py-1.5 text-xs font-semibold text-gray-700 outline-none cursor-pointer">
                    <option value="ru">🇷🇺 RU</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="cnr">🇲🇪 CNR</option>
                </select>

                <button id="openModalBtn" class="bg-blue-600 text-white font-medium text-sm px-4 py-1.5 rounded-xl flex items-center gap-1.5 hover:bg-blue-700 shadow-sm transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i> <span data-i18n="sellBtn">Продать</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-6xl mx-auto px-4 pt-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-900" data-i18n="mainTitle">Свежие объявления</h2>
                <p class="text-xs text-gray-500" data-i18n="mainSubtitle">Покупки и продажи по всей Черногории</p>
            </div>
            
            <!-- Фильтр по городам -->
            <select id="cityFilter" onchange="filterPosts()" class="bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none shadow-sm cursor-pointer">
                <!-- Заполняется динамически -->
            </select>
        </div>

        <!-- Категории -->
        <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-6 no-scrollbar" id="categoryTabs">
            <button data-cat="ALL" onclick="selectCategory('ALL', this)" class="cat-btn bg-blue-600 text-white text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap shadow-sm transition-all" data-i18n="catAll">Всё</button>
            <button data-cat="furniture" onclick="selectCategory('furniture', this)" class="cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all" data-i18n="catFurniture">🪑 Мебель</button>
            <button data-cat="tech" onclick="selectCategory('tech', this)" class="cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all" data-i18n="catTech">💻 Техника</button>
            <button data-cat="auto" onclick="selectCategory('auto', this)" class="cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all" data-i18n="catAuto">🚗 Авто</button>
            <button data-cat="clothes" onclick="selectCategory('clothes', this)" class="cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all" data-i18n="catClothes">👕 Одежда</button>
            <button data-cat="other" onclick="selectCategory('other', this)" class="cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all" data-i18n="catOther">📦 Разное</button>
        </div>

        <!-- Сетка товаров -->
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center text-gray-400 py-12" data-i18n="loading">Загрузка объявлений...</div>
        </div>
    </main>

    <!-- Модалка создания объявления -->
    <div id="addModal" class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center hidden backdrop-blur-sm transition-all">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg text-gray-900" data-i18n="modalTitle">Новое объявление</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <form id="addPostForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formTitle">Название товара</label>
                    <input type="text" id="postTitle" required minlength="3" maxlength="60" placeholder="IKEA" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formPrice">Цена (€)</label>
                        <input type="number" id="postPrice" min="0" max="1000000" placeholder="0 = Free" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formCity">Город</label>
                        <select id="postCity" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <!-- Заполняется динамически -->
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formCat">Категория</label>
                        <select id="postCategory" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <!-- Заполняется динамически -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formTg">Telegram Ник</label>
                        <input type="text" id="postTg" required placeholder="@username" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formPhotos">Фотографии (до 5 шт)</label>
                    <input type="file" id="postFiles" multiple accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                    <!-- Превью загруженных фото -->
                    <div id="imagePreviewContainer" class="grid grid-cols-5 gap-2 mt-3 hidden"></div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="formDesc">Описание</label>
                    <textarea id="postDesc" rows="3" minlength="5" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-medium py-3 rounded-xl hover:bg-blue-700 transition-colors shadow-sm mt-2 flex items-center justify-center gap-2">
                    <span id="submitBtnText" data-i18n="formSubmit">Опубликовать</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://kxrdujitnswuajtbdgar.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4cmR1aml0bnN3dWFqdGJkZ2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjcxNzMsImV4cCI6MjA3MTQ0NDM3M30.17Gx37ZpxkJPNICCISTZHOdbf1bmiV36NtORnWjCLOY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const dict = {
            ru: {
                sellBtn: "Продать", mainTitle: "Свежие объявления", mainSubtitle: "Покупки и продажи по всей Черногории",
                catAll: "Всё", catFurniture: "🪑 Мебель", catTech: "💻 Техника", catAuto: "🚗 Авто", catClothes: "👕 Одежда", catOther: "📦 Разное",
                loading: "Загрузка...", noPosts: "В этой категории пока нет объявлений", free: "Бесплатно",
                modalTitle: "Новое объявление", formTitle: "Название товара", formPrice: "Цена (€)", formCity: "Город", formCat: "Категория", formTg: "Telegram Ник", formPhotos: "Фотографии (до 5 шт)", formDesc: "Описание", formSubmit: "Опубликовать",
                cities: { ALL: "Все города", budva: "Будва", bar: "Бар", tivat: "Тиват", podgorica: "Подгорица", kotor: "Котор", herceg_novi: "Херцег-Нови" },
                categories: { furniture: "Мебель", tech: "Техника", auto: "Авто", clothes: "Одежда", other: "Разное" }
            },
            en: {
                sellBtn: "Sell", mainTitle: "Recent Listings", mainSubtitle: "Buy and sell across Montenegro",
                catAll: "All", catFurniture: "🪑 Furniture", catTech: "💻 Tech", catAuto: "🚗 Auto", catClothes: "👕 Clothes", catOther: "📦 Other",
                loading: "Loading...", noPosts: "No listings here yet", free: "Free",
                modalTitle: "New Listing", formTitle: "Item Title", formPrice: "Price (€)", formCity: "City", formCat: "Category", formTg: "Telegram Handle", formPhotos: "Photos (up to 5)", formDesc: "Description", formSubmit: "Publish",
                cities: { ALL: "All cities", budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" },
                categories: { furniture: "Furniture", tech: "Electronics", auto: "Vehicles", clothes: "Clothing", other: "Other" }
            },
            cnr: {
                sellBtn: "Prodaj", mainTitle: "Novi oglasi", mainSubtitle: "Kupovina i prodaja širom Crne Gore",
                catAll: "Sve", catFurniture: "🪑 Namještaj", catTech: "💻 Tehnika", catAuto: "🚗 Auto", catClothes: "👕 Odjeća", catOther: "📦 Razno",
                loading: "Učitavanje...", noPosts: "Trenutno nema oglasa u ovoj kategoriji", free: "Besplatno",
                modalTitle: "Novi oglas", formTitle: "Naziv artikla", formPrice: "Cijena (€)", formCity: "Grad", formCat: "Kategorija", formTg: "Telegram korisničko ime", formPhotos: "Fotografije (do 5)", formDesc: "Opis", formSubmit: "Objavi",
                cities: { ALL: "Svi gradovi", budva: "Budva", bar: "Bar", tivat: "Tivat", podgorica: "Podgorica", kotor: "Kotor", herceg_novi: "Herceg Novi" },
                categories: { furniture: "Namještaj", tech: "Tehnika", auto: "Auto", clothes: "Odjeća", other: "Razno" }
            }
        };

        let currentLang = localStorage.getItem('mne_lang') || 'ru';
        let allPosts = [];
        let activeCategory = 'ALL';

        const productsGrid = document.getElementById('productsGrid');
        const cityFilter = document.getElementById('cityFilter');
        const postCity = document.getElementById('postCity');
        const postCategory = document.getElementById('postCategory');
        const addModal = document.getElementById('addModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const postFilesInput = document.getElementById('postFiles');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const addPostForm = document.getElementById('addPostForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = document.getElementById('submitBtnText');

        openModalBtn.addEventListener('click', () => addModal.classList.remove('hidden'));
        closeModalBtn.addEventListener('click', () => addModal.classList.add('hidden'));

        // Превью фото
        postFilesInput.addEventListener('change', function () {
            const files = Array.from(this.files).slice(0, 5);
            imagePreviewContainer.innerHTML = '';

            if (files.length === 0) {
                imagePreviewContainer.classList.add('hidden');
                return;
            }

            imagePreviewContainer.classList.remove('hidden');

            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const imgWrapper = document.createElement('div');
                    imgWrapper.className = 'relative w-full h-16 rounded-xl overflow-hidden border border-gray-200 bg-gray-100';
                    imgWrapper.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover" alt="Preview ${index + 1}">`;
                    imagePreviewContainer.appendChild(imgWrapper);
                };
                reader.readAsDataURL(file);
            });
        });

        // Отправка объявления в Supabase
        addPostForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtnText.innerText = dict[currentLang].loading;

            try {
                const title = document.getElementById('postTitle').value;
                const price = document.getElementById('postPrice').value || 0;
                const city = postCity.value;
                const category = postCategory.value;
                const telegram = document.getElementById('postTg').value.replace('@', '').trim();
                const description = document.getElementById('postDesc').value;
                const files = Array.from(postFilesInput.files).slice(0, 5);

                let imageUrls = [];

                for (const file of files) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}.${fileExt}`;
                    
                    const { data: uploadData, error: uploadError } = await supabaseClient.storage
                        .from('posts')
                        .upload(fileName, file);

                    if (!uploadError && uploadData) {
                        const { data: publicUrlData } = supabaseClient.storage
                            .from('posts')
                            .getPublicUrl(fileName);
                    
                        if (publicUrlData) imageUrls.push(publicUrlData.publicUrl);
                    }
                }

                const { error: insertError } = await supabaseClient.from('posts').insert([{
                    title,
                    price: Number(price),
                    city,
                    category,
                    telegram,
                    description,
                    images: imageUrls,
                    image_url: imageUrls[0] || ''
                }]);

                if (insertError) {
                    alert('Ошибка при публикации: ' + insertError.message);
                } else {
                    addPostForm.reset();
                    imagePreviewContainer.innerHTML = '';
                    imagePreviewContainer.classList.add('hidden');
                    addModal.classList.add('hidden');
                    await loadPosts();
                }
            } catch (err) {
                console.error(err);
                alert('Произошла ошибка при отправке');
            } finally {
                submitBtn.disabled = false;
                submitBtnText.innerText = dict[currentLang].formSubmit;
            }
        });

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mne_lang', lang);

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });

            const currentSelectedCity = cityFilter.value || 'ALL';
            cityFilter.innerHTML = Object.entries(dict[lang].cities).map(([val, label]) => 
                `<option value="${val}">${label}</option>`
            ).join('');
            cityFilter.value = currentSelectedCity;

            const currentModalCity = postCity.value || 'budva';
            postCity.innerHTML = Object.entries(dict[lang].cities)
                .filter(([val]) => val !== 'ALL')
                .map(([val, label]) => `<option value="${val}">${label}</option>`)
                .join('');
            postCity.value = currentModalCity;

            const currentModalCat = postCategory.value || 'furniture';
            postCategory.innerHTML = Object.entries(dict[lang].categories)
                .map(([val, label]) => `<option value="${val}">${label}</option>`)
                .join('');
            postCategory.value = currentModalCat;

            renderPosts();
        }

        async function loadPosts() {
            const { data: posts, error } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
            if (!error && posts) {
                allPosts = posts;
            }
            renderPosts();
        }

        function selectCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.className = 'cat-btn bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap transition-all');
            btn.className = 'cat-btn bg-blue-600 text-white text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap shadow-sm transition-all';
            activeCategory = cat;
            filterPosts();
        }

        function filterPosts() {
            renderPosts();
        }

        function renderPosts() {
            const selectedCity = cityFilter.value || 'ALL';
            let filtered = allPosts;

            if (activeCategory !== 'ALL') filtered = filtered.filter(p => p.category === activeCategory);
            if (selectedCity !== 'ALL') filtered = filtered.filter(p => p.city === selectedCity);

            if (filtered.length === 0) {
                productsGrid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12">${dict[currentLang].noPosts}</div>`;
                return;
            }

            productsGrid.innerHTML = filtered.map(post => {
                const isFree = Number(post.price) === 0;
                const priceTag = isFree ? `<span class="font-bold text-sm text-emerald-600">${dict[currentLang].free}</span>` : `<span class="font-bold text-sm text-blue-600">${post.price} €</span>`;
                const img = (post.images && post.images.length > 0) ? post.images[0] : (post.image_url || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500');
                const cityName = dict[currentLang].cities[post.city] || post.city;
                const categoryName = dict[currentLang].categories[post.category] || post.category || 'Other';

                return `
                    <a href="post.html?id=${post.id}" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition-all duration-200 group">
                        <div>
                            <div class="relative h-44 bg-gray-100 overflow-hidden">
                                <img src="${img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="${post.title}">
                                <span class="absolute top-2 right-2 bg-black/60 text-white text-[10px] font-medium px-2 py-0.5 rounded-lg backdrop-blur-md">${cityName}</span>
                                ${isFree ? `<span class="absolute top-2 left-2 bg-emerald-500 text-white font-medium text-[10px] px-2 py-0.5 rounded-lg shadow-sm">${dict[currentLang].free}</span>` : ''}
                            </div>
                            <div class="p-3">
                                <div class="text-[10px] text-blue-600 font-semibold uppercase tracking-wider mb-1">${categoryName}</div>
                                <h3 class="font-semibold text-sm text-gray-900 line-clamp-1 group-hover:text-blue-600 transition-colors">${post.title}</h3>
                                <p class="text-xs text-gray-500 mt-1 line-clamp-2">${post.description || ''}</p>
                            </div>
                        </div>
                        <div class="p-3 pt-0 flex items-center justify-between mt-2">
                            ${priceTag}
                            <span class="bg-blue-50 text-blue-600 p-2 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </span>
                        </div>
                    </a>
                `;
            }).join('');
            lucide.createIcons();
        }

        // Инициализация
        document.getElementById('langSelect').value = currentLang;
        changeLanguage(currentLang);
        loadPosts();
    </script>
</body>
</html>
